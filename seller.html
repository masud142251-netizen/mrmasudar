<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MR MASUDAR ENTERPRISE | Global Seller Ecosystem</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #000; --gold: #D4AF37; --white: #fff; --gradient: linear-gradient(135deg, #BF953F, #AA771C); }
        body { background: var(--bg); color: var(--white); font-family: 'Montserrat', sans-serif; margin: 0; }
        .lock-btn-fixed { position: fixed; bottom: 10px; left: 10px; opacity: 0.1; cursor: pointer; color: var(--gold); }
        .lock-btn-fixed:hover { opacity: 1; }
        .card { background: #0a0a0a; border: 1px solid var(--gold); border-radius: 20px; padding: 40px; margin: 50px auto; width: 85%; max-width: 700px; box-shadow: 0 0 40px rgba(212,175,55,0.15); }
        h1 { font-family: 'Cormorant Garamond', serif; text-align: center; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 32px; }
        .input-group { margin-bottom: 15px; }
        label { font-size: 10px; color: var(--gold); text-transform: uppercase; font-weight: bold; }
        input, select, textarea { width: 100%; background: #000; border: 1px solid #333; padding: 12px; color: #fff; border-radius: 8px; box-sizing: border-box; }
        .btn { background: var(--gradient); border: none; padding: 15px 30px; border-radius: 30px; color: #000; font-weight: bold; cursor: pointer; width: 100%; text-transform: uppercase; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="lock-btn-fixed" onclick="openAdmin()"><i class="fa fa-lock"></i></div>

    <div id="app" class="card">
        <div id="content">
            <h1>MR MASUDAR ENTERPRISE</h1>
            <p style="text-align:center; font-size:10px; letter-spacing:2px;">GLOBAL VENDOR PORTAL</p>
            <button class="btn" onclick="showForm()">REGISTER AS A GLOBAL SELLER</button>
        </div>
    </div>

    <script>
        let sellers = JSON.parse(localStorage.getItem('mme_sellers') || '[]');

        function showForm() {
            document.getElementById('content').innerHTML = `
                <div class="input-group"><label>Store Name</label><input type="text" id="bizName"></div>
                <div class="input-group"><label>Product Title</label><input type="text" id="pTitle"></div>
                <div class="input-group"><label>Select Category</label>
                    <select id="pCat">
                        <option>FASHION (MEN)</option><option>FASHION (WOMEN)</option>
                        <option>👶 BABY</option><option>🎁 LUXURY GIFTS</option>
                        <option>🏡 HOME DECOR</option><option>🎨 ART & CRAFT</option>
                    </select>
                </div>
                <div class="input-group"><label>Price (BDT - 5% Commission)</label><input type="number" id="pBDT"></div>
                <div class="input-group"><label>Price (Global Retail USD - 20% Commission)</label><input type="number" id="pUSD"></div>
                <div class="input-group"><label>Price (Wholesale USD - 5% Commission)</label><input type="number" id="pWhole"></div>
                <button class="btn" onclick="submit()">PUBLISH TO MARKETPLACE</button>
            `;
        }

        function submit() {
            let p = {
                title: document.getElementById('pTitle').value,
                cat: document.getElementById('pCat').value,
                bd: document.getElementById('pBDT').value,
                global: document.getElementById('pUSD').value,
                whole: document.getElementById('pWhole').value
            };
            let products = JSON.parse(localStorage.getItem('products') || '[]');
            products.push(p);
            localStorage.setItem('products', JSON.stringify(products));
            alert("Product published successfully to respective global market segments!");
        }

        function openAdmin() {
            let pass = prompt("Admin Password:");
            if(pass === 'mrseller.html' || pass === 'mrseller.htmld') {
                alert("Admin Access Granted");
                // এখানে আপনার সেলারদের লিস্ট ও কমিশন রিপোর্ট দেখানোর কোড যুক্ত করুন
            }
        }
    </script>
</body>
</html>
