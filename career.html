<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAREER | MR MASUDAR ENTERPRISE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold-primary: #D4AF37; --bg: #050505; --card-bg: #0c0c0c; }
        body { background: var(--bg); color: #fff; font-family: 'Montserrat', sans-serif; padding: 20px; }
        
        .luxury-card { max-width: 500px; margin: 50px auto; background: var(--card-bg); padding: 40px; border-radius: 20px; border: 1px solid var(--gold-primary); text-align: center; }
        h1 { font-family: 'Cormorant Garamond', serif; color: var(--gold-primary); text-transform: uppercase; }
        
        /* Form Styling */
        .form-section { display: none; text-align: left; }
        .input-group { margin-bottom: 15px; }
        label { font-size: 10px; color: #888; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; margin-top: 5px; }
        
        .btn { background: var(--gold-primary); color: #000; padding: 15px 30px; border: none; border-radius: 30px; font-weight: 800; text-transform: uppercase; cursor: pointer; margin-top: 20px; }
        
        #preview-area { display: none; background: #111; padding: 20px; border-radius: 15px; margin-top: 20px; text-align: left; }
    </style>
</head>
<body>

<!-- Entrance Card -->
<div class="luxury-card" id="entrance">
    <h1>MR MASUDAR ENTERPRISE</h1>
    <p>Elite Global Career Opportunities</p>
    <button class="btn" onclick="showForm()">Apply Now</button>
</div>

<!-- Application Form -->
<div class="luxury-card form-section" id="apply-form">
    <h2>Application Form</h2>
    <div class="input-group"><label>Full Name</label><input type="text" id="fname"></div>
    <div class="input-group"><label>Gmail</label><input type="email" id="gmail"></div>
    <div class="input-group"><label>WhatsApp/Emergency No</label><input type="text" id="phone"></div>
    <div class="input-group"><label>NID/Registration No</label><input type="text" id="nid"></div>
    <div class="input-group"><label>Job Sector</label>
        <select id="job">
            <option>Video Editing</option><option>Graphics Design</option><option>Web Developer</option>
            <option>Factory Worker</option><option>Office Worker</option>
        </select>
    </div>
    <div class="input-group"><label>Education (SSC/HSC/Honors/Masters)</label><input type="text" id="edu" placeholder="e.g. B.Sc in CSE, GPA 3.5"></div>
    <div class="input-group"><label>Upload Photo</label><input type="file" id="photo"></div>
    <button class="btn" onclick="previewCV()">Preview CV</button>
</div>

<!-- CV Preview Area -->
<div class="luxury-card" id="preview-area">
    <h2>Review Your Profile</h2>
    <div id="cv-data"></div>
    <button class="btn" onclick="finishApplication()">Confirm & Finish</button>
</div>

<script>
    function showForm() {
        document.getElementById('entrance').style.display = 'none';
        document.getElementById('apply-form').style.display = 'block';
    }

    function previewCV() {
        const data = `
            Name: ${document.getElementById('fname').value} <br>
            Email: ${document.getElementById('gmail').value} <br>
            Job: ${document.getElementById('job').value}
        `;
        document.getElementById('cv-data').innerHTML = data;
        document.getElementById('apply-form').style.display = 'none';
        document.getElementById('preview-area').style.display = 'block';
    }

    function finishApplication() {
        alert("Application submitted successfully to our Supabase database!");
        location.reload();
    }
</script>

</body>
</html>
