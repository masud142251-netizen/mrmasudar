<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR MASUDAR ENTERPRISE | Executive Recruitment</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold-primary: #D4AF37; --bg: #030303; --card: #0c0c0c; }
        body { background: var(--bg); color: #fff; font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; }

        /* Luxury Header */
        .header-bar { display: flex; justify-content: space-between; padding: 20px 30px; align-items: center; }
        .logo-text { font-family: 'Cormorant Garamond', serif; font-size: 16px; color: var(--gold-primary); letter-spacing: 2px; }
        .lock-btn { color: var(--gold-primary); font-size: 20px; cursor: pointer; }

        /* Entrance Animation Area */
        .hero-section { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; text-align: center; }
        .large-logo { width: 120px; margin-bottom: 20px; }
        .title-main { font-family: 'Cormorant Garamond', serif; font-size: 28px; color: #fff; margin-bottom: 10px; }
        .sub-title { font-size: 10px; color: #888; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 40px; }
        
        .apply-btn { background: var(--gold-primary); color: #000; padding: 15px 50px; border-radius: 50px; font-weight: 800; cursor: pointer; animation: pulse 2s infinite; border: none; }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212,175,55,0.7); } 70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(212,175,55,0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212,175,55,0); } }

        /* Form Styling */
        #form-wrapper { display: none; max-width: 600px; margin: 20px auto; padding: 30px; background: var(--card); border: 1px solid #333; border-radius: 20px; }
        .form-header { font-size: 16px; color: var(--gold-primary); text-align: center; margin-bottom: 25px; }
        .input-box { margin-bottom: 15px; }
        label { display: block; font-size: 9px; color: var(--gold-primary); margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: #fff; border-radius: 10px; }
    </style>
</head>
<body>

<div class="header-bar" id="nav-bar">
    <div class="logo-text">MR MASUDAR ENTERPRISE</div>
    <div class="lock-btn" onclick="openAdmin()"><i class="fa-solid fa-lock"></i></div>
</div>

<!-- Entrance -->
<div id="entrance" class="hero-section">
    <img src="https://lh3.googleusercontent.com/d/1iph42wSVX9xNglnVKSKTXicbInSJ3y4j=s400" class="large-logo">
    <h2 class="title-main">MR MASUDAR ENTERPRISE</h2>
    <p class="sub-title">ELITE GLOBAL CAREER OPPORTUNITIES & EXECUTIVE RECRUITMENT</p>
    <button class="apply-btn" onclick="showForm()">APPLY NOW</button>
</div>

<!-- Application Form -->
<div id="form-wrapper">
    <h3 class="form-header">EXECUTIVE APPLICATION FORM</h3>
    <div class="input-box"><label>FULL NAME</label><input type="text"></div>
    <div class="input-box"><label>FATHER'S NAME</label><input type="text"></div>
    <div class="input-box"><label>MOTHER'S NAME</label><input type="text"></div>
    <div class="input-box"><label>OFFICIAL GMAIL</label><input type="email"></div>
    <!-- বাকি সব ফিল্ড এই একই স্টাইলে থাকবে -->
    <button class="apply-btn" style="width:100%">SUBMIT APPLICATION</button>
</div>

<script>
    function showForm() {
        document.getElementById('entrance').style.display = 'none';
        document.getElementById('form-wrapper').style.display = 'block';
    }
    function openAdmin() {
        let pass = prompt("Enter Admin Password:");
        if(pass === "masudar99") alert("Welcome to Admin Panel");
    }
</script>

</body>
</html>
