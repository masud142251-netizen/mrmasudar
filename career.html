<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR MASUDAR ENTERPRISE | Elite Career Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #030303;
            --surface-card: #111111;
            --gold-primary: #D4AF37;
            --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            --border-luxury: rgba(212, 175, 55, 0.4);
        }
        body { background-color: var(--bg-color); color: #fff; font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        /* Ultra-Small & Discreet Secret Admin Lock */
        .lock-btn-fixed {
            position: fixed;
            bottom: 8px;
            left: 8px;
            color: var(--gold-primary);
            font-size: 8px; /* একদম ছোট করা হয়েছে */
            cursor: pointer;
            z-index: 9999;
            opacity: 0.2; /* খুব হালকা যাতে কেউ খেয়াল না করে */
            transition: 0.3s;
        }
        .lock-btn-fixed:hover { opacity: 0.8; }

        .portal-wrapper { width: 100%; max-width: 800px; padding: 30px 20px; display: flex; align-items: center; justify-content: center; }

        /* Luxury Card UI */
        .luxury-card { background: var(--surface-card); border: 1px solid var(--border-luxury); border-radius: 24px; padding: 40px 30px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.95); width: 100%; animation: fadeInCard 0.8s ease-out; }
        @keyframes fadeInCard { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } }

        .brand-logo { width: 80px; margin-bottom: 20px; animation: logoPulse 2.5s infinite ease-in-out; }
        @keyframes logoPulse { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(212,175,55,0.3)); } 50% { transform: scale(1.05); filter: drop-shadow(0 0 15px rgba(212,175,55,0.7)); } }

        .luxury-card h1 { font-family: 'Cormorant Garamond', serif; font-size: 24px; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; text-transform: uppercase; margin: 0 0 10px 0; }
        .luxury-card p { color: #888; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 30px; font-weight: 600; }

        .apply-btn { background: var(--gold-gradient); color: #000; padding: 14px 40px; border-radius: 35px; font-weight: 800; text-transform: uppercase; font-size: 11px; letter-spacing: 2px; border: none; cursor: pointer; animation: pulseBtn 2s infinite; }
        @keyframes pulseBtn { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212,175,55,0.7); } 70% { transform: scale(1.03); box-shadow: 0 0 0 15px rgba(212,175,55,0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212,175,55,0); } }

        /* Form Layout */
        .form-section, .preview-section, .admin-section { display: none; text-align: left; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full-width { grid-column: span 2; }
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; font-size: 9px; color: var(--gold-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; background: #000; border: 1px solid #333; padding: 10px; color: #fff; border-radius: 8px; font-size: 11px; outline: none; }
        
        .section-title { color: var(--gold-primary); font-size: 11px; text-transform: uppercase; border-bottom: 1px dashed var(--border-luxury); padding-bottom: 5px; margin: 10px 0; font-weight: 700; }
        .admin-table { width: 100%; border-collapse: collapse; font-size: 10px; margin-top: 10px; }
        .admin-table th, .admin-table td { border: 1px solid #333; padding: 8px; text-align: left; }
        .wa-chat-link { color: #2ecc71; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Ultra-Small Secret Lock Button (শুধুমাত্র এন্ট্রান্স পেজে দেখাবে) -->
    <div class="lock-btn-fixed" id="secretLock" onclick="openAdminModal()" title="Admin"><i class="fa-solid fa-lock"></i></div>

    <div class="portal-wrapper">
        <div class="luxury-card" id="entranceCard">
            <img src="https://lh3.googleusercontent.com/d/1iph42wSVX9xNglnVKSKTXicbInSJ3y4j=s400" alt="Logo" class="brand-logo">
            <h1>MR MASUDAR ENTERPRISE</h1>
            <p>ELITE GLOBAL CAREER OPPORTUNITIES & EXECUTIVE RECRUITMENT</p>
            <button class="apply-btn" onclick="showApplicationForm()">APPLY NOW</button>
        </div>

        <!-- ফর্ম এবং অ্যাডমিন প্যানেল কোড আগের মতোই থাকবে -->
        <div class="luxury-card form-section" id="formSection">
            <!-- (আপনার আগের ফর্মের ফিল্ডগুলো এখানে থাকবে) -->
            <h2 style="color:var(--gold-primary); text-align:center; font-size:18px;">CANDIDATE APPLICATION FORM</h2>
            <!-- ইনপুট ফিল্ডগুলো এখানে বসিয়ে নিন -->
            <button class="apply-btn" style="width:100%" onclick="previewCV()">REVIEW CV</button>
        </div>

        <!-- Admin Panel Section -->
        <div class="luxury-card admin-section" id="adminSection">
            <h2 style="color:var(--gold-primary); text-align:center; font-size:18px;">ADMIN SECURITY PORTAL</h2>
            <div id="adminLoginBox">
                <div class="input-group"><label>PASSWORD</label><input type="password" id="adminPassInput"></div>
                <button class="apply-btn" onclick="verifyAdmin()">LOGIN</button>
            </div>
            <!-- (অ্যাডমিন ড্যাশবোর্ড আগের মতোই) -->
        </div>
    </div>

    <script>
        function showApplicationForm() {
            document.getElementById('entranceCard').style.display = 'none';
            document.getElementById('formSection').style.display = 'block';
            document.getElementById('secretLock').style.display = 'none'; // ফর্মে গেলে তালা লুকিয়ে যাবে
        }
        function openAdminModal() {
            document.getElementById('entranceCard').style.display = 'none';
            document.getElementById('adminSection').style.display = 'block';
            document.getElementById('secretLock').style.display = 'none';
        }
        function verifyAdmin() {
            if(document.getElementById('adminPassInput').value === 'mrcareerhtml') {
                document.getElementById('adminLoginBox').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
            } else alert("Invalid Password");
        }
        // অন্যান্য ফাংশন আগের মতোই থাকবে...
    </script>
</body>
</html>
