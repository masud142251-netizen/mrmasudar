<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR MASUDAR ENTERPRISE | Elite Career Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #030303;
            --surface-card: #111111;
            --gold-primary: #D4AF37;
            --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            --border-luxury: rgba(212, 175, 55, 0.4);
        }
        body { background-color: var(--bg-color); color: #fff; font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow-x: hidden; }

        /* Small Lock Icon in bottom left */
        .lock-btn-fixed {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: var(--gold-primary);
            font-size: 16px;
            cursor: pointer;
            z-index: 9999;
            opacity: 0.6;
            transition: 0.3s;
        }
        .lock-btn-fixed:hover { opacity: 1; }

        /* Entrance Card */
        .luxury-card { background: var(--surface-card); border: 1px solid var(--border-luxury); border-radius: 24px; padding: 45px 35px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.95); width: 85%; max-width: 450px; animation: fadeInCard 0.8s ease-out; }
        
        .brand-logo { width: 80px; margin-bottom: 20px; animation: logoPulse 2.5s infinite ease-in-out; }
        @keyframes logoPulse { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(212,175,55,0.3)); } 50% { transform: scale(1.05); filter: drop-shadow(0 0 15px rgba(212,175,55,0.7)); } }

        .luxury-card h1 { font-family: 'Cormorant Garamond', serif; font-size: 26px; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; text-transform: uppercase; margin: 0 0 15px 0; }
        .luxury-card p { color: #888; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 35px; font-weight: 600; }

        .apply-btn { background: var(--gold-gradient); color: #000; padding: 15px 50px; border-radius: 35px; font-weight: 800; text-transform: uppercase; font-size: 11px; letter-spacing: 2px; border: none; cursor: pointer; transition: 0.3s; animation: pulseBtn 2s infinite; }
        @keyframes pulseBtn { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212,175,55,0.7); } 70% { transform: scale(1.03); box-shadow: 0 0 0 15px rgba(212,175,55,0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212,175,55,0); } }
        
        /* ... (অন্যান্য স্টাইল এবং স্ক্রিপ্ট আগের মতোই থাকবে) ... */
    </style>
</head>
<body>

    <!-- Fixed Lock Button -->
    <div class="lock-btn-fixed" onclick="openAdminModal()"><i class="fa-solid fa-lock"></i></div>

    <!-- Entrance Card -->
    <div class="luxury-card" id="entranceCard">
        <img src="https://lh3.googleusercontent.com/d/1iph42wSVX9xNglnVKSKTXicbInSJ3y4j=s400" class="brand-logo">
        <h1>MR MASUDAR ENTERPRISE</h1>
        <p>ELITE GLOBAL CAREER OPPORTUNITIES & EXECUTIVE RECRUITMENT</p>
        <button class="apply-btn" onclick="showApplicationForm()">APPLY NOW</button>
    </div>

    <!-- ... (ফাইনাল কোডের অবশিষ্ট অংশ এবং স্ক্রিপ্ট একই থাকবে) ... -->

</body>
</html>
