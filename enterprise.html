<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR MASUDAR ENTERPRISE | Enterprise Ecosystem</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #050505;
            --surface-color: #0c0c0c;
            --gold-primary: #D4AF37;
            --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            --text-main: #FFFFFF;
            --border-luxury: rgba(212, 175, 55, 0.3);
        }
        body { background: var(--bg-color); color: var(--text-main); font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }

        .luxury-wrapper { max-width: 850px; margin: 0 auto; padding: 50px 20px; text-align: center; }

        /* Branding */
        .brand-logo-img { width: 65px; border-radius: 14px; border: 1px solid var(--gold-primary); margin-bottom: 12px; box-shadow: 0 0 20px rgba(212,175,55,0.3); }
        h1 { font-family: 'Cormorant Garamond', serif; font-size: 24px; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; margin: 0; letter-spacing: 2px; }
        .tagline { font-size: 9px; letter-spacing: 4px; color: #888; margin-bottom: 50px; font-weight: 600; }

        /* Instant Visible Service Section */
        .service-section { margin-bottom: 80px; padding: 40px 25px; background: var(--surface-color); border: 1px solid var(--border-luxury); border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); position: relative; overflow: hidden; }
        
        .service-icon { font-size: 42px; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 15px; animation: floatIcon 3s infinite ease-in-out; }
        @keyframes floatIcon { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

        h2 { font-size: 16px; letter-spacing: 2px; text-transform: uppercase; margin: 10px 0; color: #fff; }
        p { color: #aaa; font-size: 11px; line-height: 1.7; max-width: 650px; margin: 0 auto 25px auto; letter-spacing: 0.5px; }

        /* 10 Unique Custom Graphs */
        .graph-box { height: 70px; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 8px; margin-top: 15px; padding-top: 10px; border-top: 1px dashed rgba(212,175,55,0.2); }
        
        .wave-bar { width: 6px; background: var(--gold-gradient); border-radius: 4px; animation: wavePulse 1s infinite alternate; }
        @keyframes wavePulse { from { height: 10px; } to { height: 60px; } }

        .step-bar { width: 12px; background: var(--gold-gradient); border-radius: 3px; }

        .finance-flow { display: flex; gap: 12px; align-items: center; justify-content: center; font-size: 10px; color: var(--gold-primary); letter-spacing: 1px; font-weight: bold; }
        .finance-dot { width: 12px; height: 12px; background: var(--gold-primary); border-radius: 50%; animation: blinkDot 1.2s infinite alternate; }
        @keyframes blinkDot { 0% { opacity: 0.3; transform: scale(0.8); } 100% { opacity: 1; box-shadow: 0 0 15px var(--gold-primary); transform: scale(1.2); } }

        .ai-nodes { display: flex; gap: 15px; align-items: center; justify-content: center; }
        .node-circle { width: 14px; height: 14px; background: var(--gold-primary); border-radius: 50%; box-shadow: 0 0 15px var(--gold-primary); animation: nodePulse 1.5s infinite alternate; }
        @keyframes nodePulse { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.3); opacity: 1; } }

        .sync-line { height: 2px; width: 150px; background: var(--gold-gradient); position: relative; overflow: hidden; border-radius: 2px; }
        .sync-ball { width: 10px; height: 10px; background: #fff; border-radius: 50%; position: absolute; top: -4px; animation: moveBall 2s infinite linear; box-shadow: 0 0 10px #fff; }
        @keyframes moveBall { 0% { left: 0; } 100% { left: 100%; } }

        .shield-meter { width: 80%; height: 6px; background: #111; border-radius: 3px; margin: 0 auto; overflow: hidden; border: 1px solid var(--gold-primary); position: relative; }
        .shield-progress { height: 100%; width: 100%; background: var(--gold-gradient); animation: secureGlow 2s infinite; }
        @keyframes secureGlow { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

        .eq-bar { width: 8px; background: var(--gold-gradient); border-radius: 2px; animation: eqDance 0.6s infinite alternate; }
        @keyframes eqDance { from { height: 10px; } to { height: 50px; } }

        .peak-bar { width: 10px; background: var(--gold-gradient); border-radius: 2px; }

        .radar-box { position: relative; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; }
        .radar-core { width: 14px; height: 14px; background: var(--gold-primary); border-radius: 50%; box-shadow: 0 0 10px var(--gold-primary); }
        .radar-pulse { position: absolute; width: 100%; height: 100%; border: 2px solid var(--gold-primary); border-radius: 50%; animation: radarExpand 1.5s infinite ease-out; }
        @keyframes radarExpand { 0% { transform: scale(0.3); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

        .target-ring { width: 45px; height: 45px; border: 2px dashed var(--gold-primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; animation: spinRing 8s infinite linear; }
        @keyframes spinRing { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .target-center { width: 12px; height: 12px; background: var(--gold-primary); border-radius: 50%; }

        /* --- Luxury Enterprise Inquiry Form --- */
        .enterprise-form-box { background: var(--surface-color); border: 2px solid var(--gold-primary); border-radius: 22px; padding: 40px 30px; margin-top: 60px; box-shadow: 0 0 40px rgba(212,175,55,0.2); text-align: left; }
        .enterprise-form-box h3 { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: var(--gold-primary); text-align: center; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .enterprise-form-box p.form-sub { color: #aaa; font-size: 10px; text-align: center; margin-bottom: 30px; letter-spacing: 1px; text-transform: uppercase; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-full { grid-column: span 2; }
        
        .form-group label { display: block; font-size: 9px; color: var(--gold-primary); text-transform: uppercase; font-weight: bold; letter-spacing: 1px; margin-bottom: 6px; }
        .form-control { width: 100%; background: #000; border: 1px solid var(--border-luxury); padding: 12px; color: #fff; border-radius: 10px; font-size: 11px; outline: none; box-sizing: border-box; transition: 0.3s; }
        .form-control:focus { border-color: var(--gold-primary); box-shadow: 0 0 10px rgba(212,175,55,0.3); }

        .phone-input-group { display: flex; gap: 8px; }
        .phone-input-group select { width: 130px; background: #000; border: 1px solid var(--border-luxury); color: #fff; padding: 10px; border-radius: 10px; font-size: 10px; outline: none; }

        .submit-enterprise-btn { background: var(--gold-gradient); color: #000; border: none; padding: 14px; width: 100%; font-weight: 900; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; border-radius: 30px; cursor: pointer; margin-top: 20px; box-shadow: 0 0 20px rgba(212,175,55,0.4); transition: 0.3s; }
        .submit-enterprise-btn:hover { transform: scale(1.02); box-shadow: 0 0 30px rgba(212,175,55,0.7); }

        .back-link { margin-top: 40px; margin-bottom: 40px; }
        .back-link a { color: var(--gold-primary); text-decoration: none; font-size: 11px; letter-spacing: 2px; border-bottom: 1px dashed var(--gold-primary); padding-bottom: 3px; }

        @media(max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-full { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="luxury-wrapper">
    <img src="https://lh3.googleusercontent.com/d/1iph42wSVX9xNglnVKSKTXicbInSJ3y4j=s400" class="brand-logo-img">
    <h1>MR MASUDAR ENTERPRISE</h1>
    <div class="tagline">ALL-IN-ONE . LESS IS MORE — ENTERPRISE ECOSYSTEM</div>

    <div id="services-flow"></div>

    <!-- Luxury Enterprise Inquiry Form -->
    <div class="enterprise-form-box">
        <h3>Connect With Enterprise Infrastructure</h3>
        <p class="form-sub">Direct Gateway for Elite Corporate Clients Worldwide</p>
        
        <div class="form-grid">
            <div class="form-group">
                <label>Full Name / Corporate Rep *</label>
                <input type="text" id="entName" class="form-control" placeholder="Enter full name">
            </div>
            <div class="form-group">
                <label>Business Gmail / Email *</label>
                <input type="email" id="entEmail" class="form-control" placeholder="client@company.com">
            </div>
            <div class="form-group form-full">
                <label>WhatsApp / Business Phone (237+ Country Codes) *</label>
                <div class="phone-input-group">
                    <select id="entPhoneCode">
                        <option value="+1">+1 (USA / Canada)</option>
                        <option value="+44">+44 (United Kingdom)</option>
                        <option value="+880" selected>+880 (Bangladesh)</option>
                        <option value="+91">+91 (India)</option>
                        <option value="+971">+971 (UAE)</option>
                        <option value="+966">+966 (Saudi Arabia)</option>
                        <option value="+86">+86 (China)</option>
                        <option value="+81">+81 (Japan)</option>
                        <option value="+49">+49 (Germany)</option>
                        <option value="+33">+33 (France)</option>
                        <option value="+61">+61 (Australia)</option>
                        <option value="+65">+65 (Singapore)</option>
                        <option value="+60">+60 (Malaysia)</option>
                        <option value="+92">+92 (Pakistan)</option>
                        <option value="+90">+90 (Turkey)</option>
                        <option value="+39">+39 (Italy)</option>
                        <option value="+34">+34 (Spain)</option>
                        <option value="+55">+55 (Brazil)</option>
                        <option value="+27">+27 (South Africa)</option>
                        <option value="+82">+82 (South Korea)</option>
                    </select>
                    <input type="text" id="entPhoneNum" class="form-control" placeholder="17XXXXXXXX / Mobile Number">
                </div>
            </div>
            <div class="form-group form-full">
                <label>Select Enterprise Service *</label>
                <select id="entService" class="form-control">
                    <option value="Luxury Web Design & Cloud">1. Luxury Web Design & Fast Infrastructure</option>
                    <option value="B2B Wholesale & Supply Chain">2. B2B Wholesale & Supply Chain</option>
                    <option value="Secure Multi-Currency Payments">3. 100% Secure Multi-Currency Payments</option>
                    <option value="Fast & Smart AI Automation">4. Fast & Smart AI Automation</option>
                    <option value="Multi-Channel E-Commerce">5. Multi-Channel E-Commerce Integration</option>
                    <option value="Enterprise Cybersecurity">6. Enterprise Cybersecurity & Protection</option>
                    <option value="Digital Media & Branding">7. Digital Media & Premium Branding</option>
                    <option value="Global Affiliate Network">8. Global Affiliate Partnership Network</option>
                    <option value="Elite Talent Solutions">9. Elite Talent & Workforce Solutions</option>
                    <option value="Strategic Business Advisory">10. Strategic Business & Growth Advisory</option>
                </select>
            </div>
            <div class="form-group form-full">
                <label>Project Requirements / Custom Notes *</label>
                <textarea id="entNotes" class="form-control" rows="3" placeholder="Describe your corporate goals or requirements..."></textarea>
            </div>
        </div>

        <button class="submit-enterprise-btn" onclick="submitEnterpriseInquiry()">SUBMIT ENTERPRISE INQUIRY</button>
    </div>

    <div class="back-link">
        <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Return to Main Ecosystem Dashboard</a>
    </div>
</div>

<script>
    const enterpriseData = [
        {
            icon: "fa-laptop-code",
            title: "1. Luxury Web Design & Fast Infrastructure",
            desc: "We craft high-end, luxury websites optimized for lightning-fast speeds. Powered by premium global cloud servers, we ensure your platform loads instantly and performs flawlessly without any lag.",
            graphType: "wave"
        },
        {
            icon: "fa-warehouse",
            title: "2. B2B Wholesale & Supply Chain",
            desc: "Seamlessly connect global suppliers and corporate buyers. We integrate automated bulk procurement and smart inventory systems directly into your platform for precision management and steady growth.",
            graphType: "steps"
        },
        {
            icon: "fa-vault",
            title: "3. 100% Secure Multi-Currency Payments",
            desc: "We integrate 100% secure, eco-friendly payment gateways into your website. Supporting multi-currency transactions and escrow systems to ensure flawless and safe financial management worldwide.",
            graphType: "finance"
        },
        {
            icon: "fa-robot",
            title: "4. Fast & Smart AI Automation",
            desc: "We simplify complex business tasks using advanced AI. From intelligent automated workflows to smart chatbots, our AI integrations make your operations faster, easier, and completely effortless.",
            graphType: "ai"
        },
        {
            icon: "fa-store",
            title: "5. Multi-Channel E-Commerce Integration",
            desc: "Unify your sales channels into one powerhouse. We build synchronized e-commerce platforms with centralized catalog management and automated tools for maximum reach and sales.",
            graphType: "sync"
        },
        {
            icon: "fa-shield-halved",
            title: "6. Enterprise Cybersecurity & Protection",
            desc: "Absolute protection for your digital assets. We implement military-grade encryption and advanced firewall security, keeping your corporate data and websites 100% safe from cyber threats.",
            graphType: "shield"
        },
        {
            icon: "fa-clapperboard",
            title: "7. Digital Media & Premium Branding",
            desc: "Elevate your brand with high-end commercial video production, premium 3D rendering (including luxury Gamar wood finishes), and professional UI/UX graphic design that captures attention.",
            graphType: "eq"
        },
        {
            icon: "fa-chart-line",
            title: "8. Global Affiliate Partnership Network",
            desc: "Build a scalable partner ecosystem. We design robust affiliate portals with real-time tracking, performance analytics, and automated 10% commission payouts to accelerate global brand growth.",
            graphType: "peak"
        },
        {
            icon: "fa-users-gear",
            title: "9. Elite Talent & Workforce Solutions",
            desc: "Connect with top-tier global professionals. We offer executive headhunting, professional CV curation, and specialized remote team deployment to ensure sustained business excellence.",
            graphType: "talent"
        },
        {
            icon: "fa-chess-queen",
            title: "10. Strategic Business & Growth Advisory",
            desc: "Tailored blueprints for corporate expansion. Our dedicated 24/7 strategic consulting helps you navigate international trade and achieve unparalleled market leadership.",
            graphType: "target"
        }
    ];

    const container = document.getElementById('services-flow');

    enterpriseData.forEach((item, idx) => {
        const section = document.createElement('div');
        section.className = 'service-section';

        let graphHTML = '';
        if(item.graphType === 'wave') {
            graphHTML = `<div class="graph-box">${Array(14).fill('<div class="wave-bar" style="animation-delay:'+(idx*0.1)+'s"></div>').join('')}</div>`;
        } else if(item.graphType === 'steps') {
            graphHTML = `<div class="graph-box">${[20, 35, 50, 65, 80].map((h, i) => `<div class="step-bar" style="height:${h}px; animation: wavePulse 1s infinite alternate; animation-delay:${i*0.2}s"></div>`).join('')}</div>`;
        } else if(item.graphType === 'finance') {
            graphHTML = `<div class="graph-box"><div class="finance-flow"><div class="finance-dot"></div> 100% SECURE TRANSACTIONS <div class="finance-dot"></div></div></div>`;
        } else if(item.graphType === 'ai') {
            graphHTML = `<div class="graph-box"><div class="ai-nodes"><div class="node-circle" style="animation-delay:0s"></div><div class="sync-line" style="width:40px;"><div class="sync-ball"></div></div><div class="node-circle" style="animation-delay:0.5s"></div><div class="sync-line" style="width:40px;"><div class="sync-ball"></div></div><div class="node-circle" style="animation-delay:1s"></div></div></div>`;
        } else if(item.graphType === 'sync') {
            graphHTML = `<div class="graph-box" style="flex-direction:column; align-items:center; gap:8px;"><div style="font-size:10px; color:var(--gold-primary); letter-spacing:1px; font-weight:bold;">REAL-TIME SYNCHRONIZATION</div><div class="sync-line"><div class="sync-ball"></div></div></div>`;
        } else if(item.graphType === 'shield') {
            graphHTML = `<div class="graph-box" style="flex-direction:column; gap:8px;"><div style="font-size:10px; color:var(--gold-primary); letter-spacing:1px; font-weight:bold;">SYSTEM FULLY PROTECTED</div><div class="shield-meter"><div class="shield-progress"></div></div></div>`;
        } else if(item.graphType === 'eq') {
            graphHTML = `<div class="graph-box">${Array(12).fill('<div class="eq-bar" style="animation-delay:'+(idx*0.15)+'s"></div>').join('')}</div>`;
        } else if(item.graphType === 'peak') {
            graphHTML = `<div class="graph-box">${[30, 45, 25, 60, 75, 50, 85].map((h, i) => `<div class="peak-bar" style="height:${h}px; animation: wavePulse 1.5s infinite alternate; animation-delay:${i*0.2}s"></div>`).join('')}</div>`;
        } else if(item.graphType === 'talent') {
            graphHTML = `<div class="graph-box" style="flex-direction:column; align-items:center;"><div class="radar-box"><div class="radar-pulse"></div><div class="radar-core"></div></div></div>`;
        } else if(item.graphType === 'target') {
            graphHTML = `<div class="graph-box"><div class="target-ring"><div class="target-center"></div></div></div>`;
        }

        section.innerHTML = `
            <div class="service-icon"><i class="fa-solid ${item.icon}"></i></div>
            <h2>${item.title}</h2>
            <p>${item.desc}</p>
            ${graphHTML}
        `;
        container.appendChild(section);
    });

    // Enterprise Form Submission Handler (Supabase Ready Storage)
    function submitEnterpriseInquiry() {
        let name = document.getElementById('entName').value.trim();
        let email = document.getElementById('entEmail').value.trim();
        let code = document.getElementById('entPhoneCode').value;
        let phoneNum = document.getElementById('entPhoneNum').value.trim();
        let service = document.getElementById('entService').value;
        let notes = document.getElementById('entNotes').value.trim();

        if(!name || !email || !phoneNum || !notes) {
            alert("Please fill in all required enterprise inquiry fields.");
            return;
        }

        let inquiryData = {
            id: 'ENT-' + Math.floor(100000 + Math.random() * 900000),
            name: name,
            email: email,
            phone: code + ' ' + phoneNum,
            service: service,
            notes: notes,
            date: new Date().toLocaleString(),
            status: 'Pending Executive Review'
        };

        // Saving to Local Storage (Supabase sync pipeline)
        let inquiries = JSON.parse(localStorage.getItem('mme_enterprise_inquiries') || '[]');
        inquiries.push(inquiryData);
        localStorage.setItem('mme_enterprise_inquiries', JSON.stringify(inquiries));

        alert("Enterprise Inquiry Submitted Successfully! Our executive strategy team will contact you shortly.");
        
        // Reset form
        document.getElementById('entName').value = '';
        document.getElementById('entEmail').value = '';
        document.getElementById('entPhoneNum').value = '';
        document.getElementById('entNotes').value = '';
    }
</script>

</body>
</html>
