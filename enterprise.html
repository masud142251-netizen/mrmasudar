<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR MASUDAR ENTERPRISE | Enterprise Ecosystem</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #050505;
            --gold-primary: #D4AF37;
            --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            --text-main: #FFFFFF;
        }
        body { background: var(--bg-color); color: var(--text-main); font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; }

        /* Main Container */
        .luxury-wrapper { max-width: 800px; margin: 0 auto; padding: 50px 20px; text-align: center; }

        /* Branding */
        .brand-logo-img { width: 70px; border-radius: 15px; border: 1px solid var(--gold-primary); margin-bottom: 15px; }
        h1 { font-family: 'Cormorant Garamond', serif; font-size: 28px; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; margin: 0; }
        .tagline { font-size: 10px; letter-spacing: 4px; color: #aaa; margin-bottom: 50px; }

        /* Animated Service Point */
        .service-point { margin-bottom: 80px; position: relative; opacity: 0; transform: translateY(50px); transition: all 1s ease-out; }
        .service-point.visible { opacity: 1; transform: translateY(0); }
        
        .icon-box { font-size: 50px; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; animation: glowPulse 3s infinite; }
        @keyframes glowPulse { 0%, 100% { filter: drop-shadow(0 0 5px var(--gold-primary)); } 50% { filter: drop-shadow(0 0 20px var(--gold-primary)); } }

        h2 { font-size: 18px; letter-spacing: 2px; text-transform: uppercase; margin: 10px 0; }
        p { color: #888; font-size: 12px; line-height: 1.6; max-width: 500px; margin: 0 auto; }

        /* Graphic/Graph Placeholder */
        .graph-viz { height: 100px; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 5px; margin-top: 20px; }
        .bar { width: 8px; background: var(--gold-gradient); animation: barDance 1.5s infinite alternate; }
        @keyframes barDance { from { height: 20px; } to { height: 80px; } }
    </style>
</head>
<body>

<div class="luxury-wrapper">
    <img src="https://lh3.googleusercontent.com/d/1iph42wSVX9xNglnVKSKTXicbInSJ3y4j=s400" class="brand-logo-img">
    <h1>MR MASUDAR ENTERPRISE</h1>
    <div class="tagline">ALL-IN-ONE . LESS IS MORE</div>

    <!-- সার্ভিসগুলোকে লজিক্যাল ফ্লোতে সাজানো হয়েছে -->
    <div id="services-area">
        <!-- Service 1-10 Dynamic Load -->
    </div>
</div>

<script>
    const services = [
        { icon: "fa-network-wired", title: "Global Infrastructure", desc: "Enterprise-grade cloud deployment across 237+ nations." },
        { icon: "fa-warehouse", title: "B2B Wholesale", desc: "Automated bulk procurement and global freight supply chain." },
        { icon: "fa-vault", title: "Global Finance", desc: "Multi-currency secure payout and escrow management." },
        { icon: "fa-robot", title: "AI Automation", desc: "Intelligent visual matching and customer success workflow." },
        { icon: "fa-store", title: "E-Commerce Ecosystem", desc: "Synchronized multi-channel store and catalog management." },
        { icon: "fa-shield-halved", title: "Cybersecurity", desc: "Military-grade encryption and global data compliance." },
        { icon: "fa-clapperboard", title: "Digital Media", desc: "Premium 3D rendering and high-end video production." },
        { icon: "fa-chart-line", title: "Affiliate Network", desc: "Real-time commission tracking and performance growth." },
        { icon: "fa-users-gear", title: "Elite Talent", desc: "Executive headhunting and professional CV curation." },
        { icon: "fa-chess-queen", title: "Strategic Advisory", desc: "Dedicated 24/7 corporate expansion and market consulting." }
    ];

    const area = document.getElementById('services-area');
    services.forEach((s, index) => {
        const div = document.createElement('div');
        div.className = 'service-point';
        div.innerHTML = `
            <div class="icon-box"><i class="fa-solid ${s.icon}"></i></div>
            <h2>${s.title}</h2>
            <p>${s.desc}</p>
            <div class="graph-viz">${Array(10).fill('<div class="bar" style="animation-delay:'+(index*0.1)+'s"></div>').join('')}</div>
        `;
        area.appendChild(div);
    });

    window.addEventListener('scroll', () => {
        document.querySelectorAll('.service-point').forEach(p => {
            if(p.getBoundingClientRect().top < window.innerHeight - 100) p.classList.add('visible');
        });
    });
</script>

</body>
</html>
