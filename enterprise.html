<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR MASUDAR ENTERPRISE | Enterprise Ecosystem</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #050505;
            --surface-color: #0c0c0c;
            --gold-primary: #D4AF37;
            --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            --text-main: #FFFFFF;
            --border-luxury: rgba(212, 175, 55, 0.3);
        }
        body { background: var(--bg-color); color: var(--text-main); font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }

        .luxury-wrapper { max-width: 850px; margin: 0 auto; padding: 60px 20px; text-align: center; }

        /* Branding */
        .brand-logo-img { width: 65px; border-radius: 14px; border: 1px solid var(--gold-primary); margin-bottom: 12px; box-shadow: 0 0 20px rgba(212,175,55,0.3); }
        h1 { font-family: 'Cormorant Garamond', serif; font-size: 26px; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; margin: 0; letter-spacing: 2px; }
        .tagline { font-size: 9px; letter-spacing: 4px; color: #888; margin-bottom: 60px; font-weight: 600; }

        /* Dynamic Service Section with Scroll Animation */
        .service-section { margin-bottom: 90px; padding: 40px 25px; background: var(--surface-color); border: 1px solid var(--border-luxury); border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); opacity: 0; transform: translateY(40px); transition: all 1s cubic-bezier(0.165, 0.84, 0.44, 1); position: relative; overflow: hidden; }
        .service-section.visible { opacity: 1; transform: translateY(0); }
        
        .service-icon { font-size: 42px; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 15px; animation: floatIcon 3s infinite ease-in-out; }
        @keyframes floatIcon { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

        h2 { font-size: 16px; letter-spacing: 2px; text-transform: uppercase; margin: 10px 0; color: #fff; }
        p { color: #aaa; font-size: 11px; line-height: 1.6; max-width: 650px; margin: 0 auto 25px auto; letter-spacing: 0.5px; }

        /* Unique Custom Graphs for Each Service */
        .graph-box { height: 70px; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 8px; margin-top: 15px; padding-top: 10px; border-top: 1px dashed rgba(212,175,55,0.2); }
        
        /* 1. Global Infrastructure Graph (Server Speed Waves) */
        .wave-bar { width: 6px; background: var(--gold-gradient); border-radius: 4px; animation: wavePulse 1.2s infinite alternate; }
        @keyframes wavePulse { from { height: 10px; } to { height: 60px; } }

        /* 2. B2B Wholesale Graph (Growth Step Bars) */
        .step-bar { width: 12px; background: var(--gold-gradient); border-radius: 3px; }

        /* 3. Global Finance Graph (Secure Ring / Flow) */
        .finance-flow { display: flex; gap: 12px; align-items: center; justify-content: center; font-size: 10px; color: var(--gold-primary); letter-spacing: 1px; }
        .finance-dot { width: 10px; height: 10px; background: var(--gold-primary); border-radius: 50%; animation: blinkDot 1.5s infinite; }
        @keyframes blinkDot { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; box-shadow: 0 0 10px var(--gold-primary); } }

        /* 4. AI Automation Graph (Neural Nodes) */
        .ai-nodes { display: flex; gap: 15px; align-items: center; justify-content: center; }
        .node-circle { width: 12px; height: 12px; background: var(--gold-primary); border-radius: 50%; box-shadow: 0 0 12px var(--gold-primary); animation: nodePulse 2s infinite; }
        @keyframes nodePulse { 0% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.4); opacity: 1; } 100% { transform: scale(1); opacity: 0.5; } }

        /* 5. E-Commerce Ecosystem Graph (Sync Orbit) */
        .sync-line { height: 2px; width: 150px; background: var(--gold-gradient); position: relative; overflow: hidden; }
        .sync-ball { width: 8px; height: 8px; background: #fff; border-radius: 50%; position: absolute; top: -3px; animation: moveBall 2s infinite linear; }
        @keyframes moveBall { 0% { left: 0; } 100% { left: 100%; } }

        /* 6. Cybersecurity Graph (Shield Security Pulse) */
        .shield-meter { width: 80%; height: 6px; background: #111; border-radius: 3px; margin: 0 auto; overflow: hidden; border: 1px solid var(--gold-primary); }
        .shield-progress { height: 100%; width: 99.9%; background: var(--gold-gradient); animation: secureGlow 2s infinite; }
        @keyframes secureGlow { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

        /* 7. Digital Media Graph (Spectrum Equalizer) */
        .eq-bar { width: 7px; background: var(--gold-gradient); animation: eqDance 0.8s infinite alternate; }
        @keyframes eqDance { from { height: 15px; } to { height: 55px; } }

        /* 8. Affiliate Network Graph (Commissions Peak) */
        .peak-bar { width: 10px; background: var(--gold-gradient); border-radius: 2px; }

        /* 9. Elite Talent Graph (Network Nodes) */
        .talent-node { width: 10px; height: 10px; background: var(--gold-primary); border-radius: 50%; animation: talentPulse 1.5s infinite alternate; }
        @keyframes talentPulse { from { transform: scale(0.8); } to { transform: scale(1.5); } }

        /* 10. Strategic Advisory Graph (Target Growth) */
        .target-ring { width: 45px; height: 45px; border: 2px dashed var(--gold-primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; animation: spinRing 10s infinite linear; }
        @keyframes spinRing { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .target-center { width: 10px; height: 10px; background: var(--gold-primary); border-radius: 50%; }

        .back-link { margin-top: 40px; }
        .back-link a { color: var(--gold-primary); text-decoration: none; font-size: 11px; letter-spacing: 2px; border-bottom: 1px dashed var(--gold-primary); padding-bottom: 3px; }
    </style>
</head>
<body>

<div class="luxury-wrapper">
    <img src="https://lh3.googleusercontent.com/d/1iph42wSVX9xNglnVKSKTXicbInSJ3y4j=s400" class="brand-logo-img">
    <h1>MR MASUDAR ENTERPRISE</h1>
    <div class="tagline">ALL-IN-ONE . LESS IS MORE — ENTERPRISE ECOSYSTEM</div>

    <div id="services-flow"></div>

    <div class="back-link">
        <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Return to Main Ecosystem Dashboard</a>
    </div>
</div>

<script>
    const enterpriseData = [
        {
            icon: "fa-network-wired",
            title: "1. Global Cloud & Server Infrastructure",
            desc: "We provide high-speed, enterprise-grade cloud architecture across 237+ countries. Our dedicated servers guarantee zero lag, 99.99% uptime, and lightning-fast content delivery worldwide so your visitors experience instant loading speeds without interruption.",
            graphType: "wave"
        },
        {
            icon: "fa-warehouse",
            title: "2. B2B Wholesale & Supply Chain",
            desc: "Our B2B wholesale network bridges global suppliers and corporate buyers seamlessly. We manage automated bulk procurement, custom manufacturing oversight, and international freight logistics with laser-focused efficiency and precision.",
            graphType: "steps"
        },
        {
            icon: "fa-vault",
            title: "3. Multi-Currency Financial & Payout Systems",
            desc: "Eco-friendly, secure multi-currency transaction processing and automated escrow management. We handle high-volume corporate financial management and instant 10% affiliate payouts with absolute banking transparency.",
            graphType: "finance"
        },
        {
            icon: "fa-robot",
            title: "4. AI-Powered Automation & Support",
            desc: "Turning complex enterprise tasks into effortless workflows. Our intelligent multilingual conversational agents and real-time visual product matching streamline customer success and operational tasks instantly.",
            graphType: "ai"
        },
        {
            icon: "fa-store",
            title: "5. Multi-Channel E-Commerce Ecosystem",
            desc: "Synchronizing your stores across multiple platforms in real-time. From centralized product catalog management to automated high-yield PPC marketing, we connect every sales channel into one powerhouse.",
            graphType: "sync"
        },
        {
            icon: "fa-shield-halved",
            title: "6. Enterprise Cybersecurity & Compliance",
            desc: "Military-grade data encryption, advanced DDoS mitigation, and global privacy compliance audits. We secure every digital touchpoint to protect your corporate assets against evolving cyber threats 24/7.",
            graphType: "shield"
        },
        {
            icon: "fa-clapperboard",
            title: "7. Digital Media Production & Branding",
            desc: "High-end commercial video production, stunning 3D product rendering (featuring luxury Gamar wood finishes), professional graphic design, and multi-platform brand consolidation under one roof.",
            graphType: "eq"
        },
        {
            icon: "fa-chart-line",
            title: "8. Global Affiliate & Partnership Network",
            desc: "Scalable affiliate recruitment portals equipped with real-time commission tracking, performance analytics, and automated payouts designed to maximize global brand growth and partner earnings.",
            graphType: "peak"
        },
        {
            icon: "fa-users-gear",
            title: "9. Elite Talent & Workforce Solutions",
            desc: "Professional CV curation, executive headhunting, and specialized remote team deployment. We connect elite global professionals with high-impact corporate projects for sustained business excellence.",
            graphType: "talent"
        },
        {
            icon: "fa-chess-queen",
            title: "10. Strategic Business & Growth Advisory",
            desc: "Tailored corporate expansion blueprints, international trade market-entry strategies, and dedicated 24/7 executive consulting to guide your enterprise toward unparalled market leadership.",
            graphType: "target"
        }
    ];

    const container = document.getElementById('services-flow');

    enterpriseData.forEach((item, idx) => {
        const section = document.createElement('div');
        section.className = 'service-section';

        let graphHTML = '';
        if(item.graphType === 'wave') {
            graphHTML = `<div class="graph-box">${Array(14).fill('<div class="wave-bar" style="animation-delay:'+(idx*0.1)+'s"></div>').join('')}</div>`;
        } else if(item.graphType === 'steps') {
            graphHTML = `<div class="graph-box">${[20, 35, 50, 65, 80].map((h, i) => `<div class="step-bar" style="height:${h}px; animation: wavePulse 1s infinite alternate; animation-delay:${i*0.2}s"></div>`).join('')}</div>`;
        } else if(item.graphType === 'finance') {
            graphHTML = `<div class="graph-box"><div class="finance-flow"><div class="finance-dot"></div> SECURE ESCROW ENCRYPTION <div class="finance-dot"></div> MULTI-CURRENCY PAYOUTS <div class="finance-dot"></div></div></div>`;
        } else if(item.graphType === 'ai') {
            graphHTML = `<div class="graph-box"><div class="ai-nodes"><div class="node-circle" style="animation-delay:0s"></div><div class="sync-line"><div class="sync-ball"></div></div><div class="node-circle" style="animation-delay:0.5s"></div><div class="sync-line"><div class="sync-ball"></div></div><div class="node-circle" style="animation-delay:1s"></div></div></div>`;
        } else if(item.graphType === 'sync') {
            graphHTML = `<div class="graph-box" style="flex-direction:column; align-items:center; gap:8px;"><div style="font-size:10px; color:var(--gold-primary); letter-spacing:1px;">SYNCHRONIZING MULTI-CHANNEL HUBS</div><div class="sync-line"><div class="sync-ball"></div></div></div>`;
        } else if(item.graphType === 'shield') {
            graphHTML = `<div class="graph-box" style="flex-direction:column; gap:8px;"><div style="font-size:10px; color:var(--gold-primary); letter-spacing:1px;">DEFENSE STATUS: 99.9% SECURE</div><div class="shield-meter"><div class="shield-progress"></div></div></div>`;
        } else if(item.graphType === 'eq') {
            graphHTML = `<div class="graph-box">${Array(12).fill('<div class="eq-bar" style="animation-delay:'+(idx*0.15)+'s"></div>').join('')}</div>`;
        } else if(item.graphType === 'peak') {
            graphHTML = `<div class="graph-box">${[30, 45, 25, 60, 75, 50, 85].map((h, i) => `<div class="peak-bar" style="height:${h}px; animation: wavePulse 1.5s infinite alternate; animation-delay:${i*0.2}s"></div>`).join('')}</div>`;
        } else if(item.graphType === 'talent') {
            graphHTML = `<div class="graph-box"><div class="ai-nodes"><div class="talent-node"></div><div class="sync-line"><div class="sync-ball"></div></div><div class="talent-node" style="animation-delay:0.5s"></div><div class="sync-line"><div class="sync-ball" style="animation-delay:0.5s"></div></div><div class="talent-node" style="animation-delay:1s"></div></div></div>`;
        } else if(item.graphType === 'target') {
            graphHTML = `<div class="graph-box"><div class="target-ring"><div class="target-center"></div></div></div>`;
        }

        section.innerHTML = `
            <div class="service-icon"><i class="fa-solid ${item.icon}"></i></div>
            <h2>${item.title}</h2>
            <p>${item.desc}</p>
            ${graphHTML}
        `;
        container.appendChild(section);
    });

    window.addEventListener('scroll', () => {
        document.querySelectorAll('.service-section').forEach(sec => {
            if(sec.getBoundingClientRect().top < window.innerHeight - 80) {
                sec.classList.add('visible');
            }
        });
    });
</script>

</body>
</html>
