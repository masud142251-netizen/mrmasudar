<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR MASUDAR ENTERPRISE | Affiliate Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #030303;
            --surface-card: #0a0a0a;
            --gold-primary: #D4AF37;
            --gold-light: #FBF5B7;
            --white-text: #ffffff;
            --grey-text: #a0a0a0;
            --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            --border-luxury: rgba(212, 175, 55, 0.6);
        }
        body { background-color: var(--bg-color); color: var(--white-text); font-family: 'Poppins', sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        .lock-btn-fixed { position: fixed; bottom: 10px; left: 10px; color: var(--gold-primary); font-size: 8px; opacity: 0.15; cursor: pointer; transition: 0.3s; }
        .lock-btn-fixed:hover { opacity: 1; }

        .luxury-card { 
            background: var(--surface-card); border: 1px solid var(--border-luxury); border-radius: 30px; 
            padding: 50px 40px; text-align: center; box-shadow: 0 0 50px rgba(0,0,0,0.8); width: 90%; max-width: 500px;
        }

        h1 { font-family: 'Playfair Display', serif; font-size: 32px; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        p { color: var(--grey-text); font-size: 11px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 30px; }

        .gold-effect-banner {
            background: rgba(212,175,55,0.05); border: 1px solid var(--gold-primary); padding: 20px;
            border-radius: 20px; margin-bottom: 30px; font-size: 12px; line-height: 1.6;
        }

        .apply-btn {
            background: var(--gold-gradient); color: #000; padding: 18px 50px; border-radius: 50px;
            font-weight: 900; text-transform: uppercase; border: none; cursor: pointer; font-size: 12px; letter-spacing: 2px;
            transition: 0.4s;
        }
        .apply-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(212,175,55,0.5); }

        .input-group label { display: block; font-size: 10px; color: var(--gold-primary); margin-bottom: 8px; text-transform: uppercase; font-weight: 600; }
        .input-group input { width: 100%; background: #000; border: 1px solid #333; padding: 15px; color: #fff; border-radius: 12px; box-sizing: border-box; }
        
        /* ড্যাশবোর্ডের গ্রাফিক্স কার্ড */
        .dash-card { background: #111; padding: 20px; border-radius: 20px; border: 1px solid #333; margin-top: 15px; }
        .stat-value { font-size: 24px; color: var(--gold-primary); font-weight: bold; }
    </style>
</head>
<body>

    <div class="lock-btn-fixed" id="secretLock" onclick="openAdminModal()"><i class="fa-solid fa-lock"></i></div>

    <div class="portal-wrapper">
        <div class="luxury-card" id="entranceCard">
            <img src="https://lh3.googleusercontent.com/d/1iph42wSVX9xNglnVKSKTXicbInSJ3y4j=s400" class="brand-logo">
            <h1>MR MASUDAR ENTERPRISE</h1>
            <p>Global Affiliate Ecosystem</p>
            <div class="gold-effect-banner">
                <i class="fa-solid fa-star" style="color:var(--gold-primary)"></i> Unlock 15% Global Commission.<br>
                Professional Affiliate Marketing Partner Portal.
            </div>
            <button class="apply-btn" onclick="showApplicationForm()">Join Affiliate Program</button>
        </div>

        <!-- ফর্ম এবং অন্যান্য অংশ আগের লজিক অনুযায়ী থাকবে, শুধু পাসওয়ার্ড ও ভ্যালিডেশন আপডেট করা হয়েছে -->
        <div class="luxury-card form-section" id="formSection" style="display:none;">
             <h2 style="color:var(--gold-primary);">REGISTRATION</h2>
             <div class="input-group">
                <label>Password (Min 10 chars, Upper, Lower, Number, Special)</label>
                <input type="password" id="partnerPassword" onchange="validatePassword()">
             </div>
             <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" onchange="validatePassword()">
             </div>
             <!-- অন্যান্য ইনপুট -->
             <button class="apply-btn" onclick="submitApplication()">SUBMIT APPLICATION</button>
        </div>
    </div>

    <script>
        function validatePassword() {
            const pass = document.getElementById('partnerPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{10,}$/;
            
            if (!regex.test(pass)) {
                alert("Password must be 10+ characters, contain Uppercase, Lowercase, Number, and Special Character.");
                return false;
            }
            if (pass !== confirm) {
                alert("Passwords do not match!");
                return false;
            }
            return true;
        }

        function submitApplication() {
            if(!validatePassword()) return;
            // বাকি সাবমিট লজিক...
        }
    </script>
</body>
</html>
