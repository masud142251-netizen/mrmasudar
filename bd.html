<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR MASUDAR ENTERPRISE | Bangladesh Luxury Market</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --surface-card: #0a0a0a;
            --gold-primary: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            --border-luxury: rgba(212, 175, 55, 0.4);
            --text-white: #ffffff;
            --text-gray: #aaaaaa;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 15px;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        /* Subtle Corner Admin Lock */
        .lock-btn-fixed { position: fixed; bottom: 3px; left: 3px; color: var(--gold-primary); font-size: 8px; cursor: pointer; z-index: 99999; opacity: 0.08; transition: 0.3s; padding: 4px; }
        .lock-btn-fixed:hover { opacity: 1; transform: scale(1.5); }

        /* Top Header & Search / AI Bar */
        .market-header {
            text-align: center;
            padding: 20px 15px;
            border: 1px solid var(--border-luxury);
            border-radius: 16px;
            background: var(--surface-card);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.15);
            max-width: 1200px;
            margin: 0 auto 15px auto;
        }
        .market-header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 6px 0 2px 0;
            letter-spacing: 1.5px;
        }

        /* Luxury Search Bar with Voice & Image */
        .search-bar-container {
            display: flex;
            align-items: center;
            background: #000;
            border: 1px solid var(--gold-primary);
            border-radius: 30px;
            max-width: 600px;
            margin: 15px auto 0 auto;
            padding: 6px 15px;
            box-shadow: 0 0 15px rgba(212,175,55,0.2);
        }
        .search-bar-container input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 12px;
            outline: none;
            padding: 6px;
        }
        .search-icon-btn {
            background: transparent;
            border: none;
            color: var(--gold-primary);
            font-size: 14px;
            cursor: pointer;
            padding: 0 8px;
            transition: 0.2s;
        }
        .search-icon-btn:hover { color: #fff; transform: scale(1.1); }

        /* 5 Luxury Category Menu Bar */
        .category-menu {
            display: flex;
            gap: 10px;
            max-width: 1200px;
            margin: 0 auto 20px auto;
            overflow-x: auto;
            padding: 5px 2px;
            scrollbar-width: none;
        }
        .category-menu::-webkit-scrollbar { display: none; }
        .cat-chip {
            background: var(--surface-card);
            border: 1px solid var(--border-luxury);
            color: var(--gold-light);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .cat-chip:hover, .cat-chip.active {
            background: var(--gold-gradient);
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 15px rgba(212,175,55,0.5);
        }

        /* Draggable & Floating Luxury Basket */
        .floating-basket {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--gold-gradient);
            color: #000;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.8);
            cursor: grab;
            z-index: 9999;
            user-select: none;
            transition: transform 0.2s ease;
        }
        .floating-basket:active { cursor: grabbing; }
        .floating-basket.pulse-focus {
            animation: basketFocusPulse 0.6s ease-in-out 3;
            transform: scale(1.25);
            box-shadow: 0 0 40px #fff, 0 0 30px var(--gold-primary);
        }
        @keyframes basketFocusPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }
        .basket-count {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #fff;
            color: #000;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 50%;
            border: 2px solid #000;
        }

        /* Product Grid (4 items desktop, 2 items mobile) */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Luxury Product Card */
        .product-card {
            background: var(--surface-card);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card:hover {
            border-color: var(--gold-primary);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            transform: translateY(-3px);
        }
        
        .product-img-box {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .product-img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: 0.4s;
        }
        .product-card:hover .product-img-box img { transform: scale(1.05); }

        .product-info { padding: 10px; text-align: center; }
        .product-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-white);
            margin: 0 0 4px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }
        .stars { color: var(--gold-primary); font-size: 8px; margin-bottom: 4px; }
        .card-actions { display: flex; border-top: 1px solid #222; }
        .card-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 9px;
            color: var(--gold-primary);
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }
        .card-btn:hover { background: rgba(212, 175, 55, 0.15); }

        /* Full Screen Luxury Details Modal (Vertical Stack) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 10px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .modal-content {
            background: var(--surface-card);
            border: 2px solid var(--gold-primary);
            border-radius: 20px;
            max-width: 850px;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            padding: 25px;
            position: relative;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.4);
            animation: zoomIn 0.3s ease-out;
            box-sizing: border-box;
        }
        @keyframes zoomIn { from { transform: scale(0.93); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .close-modal {
            position: absolute;
            top: 15px; right: 15px;
            background: transparent;
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            width: 30px; height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s;
            z-index: 10;
        }
        .close-modal:hover { background: var(--gold-primary); color: #000; }

        .apply-btn {
            background: var(--gold-gradient);
            border: none;
            padding: 12px;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 25px;
            cursor: pointer;
            color: #000;
            width: 100%;
            letter-spacing: 1px;
            transition: 0.2s;
            box-shadow: 0 0 15px rgba(212,175,55,0.3);
            font-size: 11px;
        }
        .apply-btn:hover { filter: brightness(1.15); transform: scale(1.01); }

        .details-stack { display: flex; flex-direction: column; gap: 15px; }
        .large-preview-wrap { background: #000; border: 1px solid rgba(255,255,255,0.2); border-radius: 14px; aspect-ratio: 1/1; width: 100%; max-height: 280px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; margin: 0 auto; }
        .large-preview-wrap img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.3s ease; cursor: zoom-in; }
        .thumb-gallery { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 4px; }
        .thumb-img { width: 60px; height: 60px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); object-fit: cover; cursor: pointer; background: #000; transition: 0.2s; flex-shrink: 0; }
        .thumb-img:hover { border-color: var(--gold-primary); transform: scale(1.05); }

        /* Quantity Selector */
        .qty-box { display: flex; align-items: center; gap: 10px; margin: 12px 0; }
        .qty-btn { background: #222; border: 1px solid var(--gold-primary); color: #fff; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-weight: bold; }
        .qty-btn:hover { background: var(--gold-primary); color: #000; }

        /* Flying Coin Animation */
        .flying-coin {
            position: fixed;
            width: 35px;
            height: 35px;
            background: var(--gold-gradient);
            border: 2px solid #fff;
            border-radius: 50%;
            z-index: 99999;
            pointer-events: none;
            box-shadow: 0 0 15px var(--gold-primary);
            transition: all 0.8s cubic-bezier(0.15, 0.85, 0.25, 1);
        }

        /* Form Inputs */
        .form-group-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; text-align: left; }
        .form-full { grid-column: span 2; }
        .input-box { width: 100%; background: #000; border: 1px solid #333; padding: 10px 12px; color: #fff; border-radius: 8px; margin-top: 3px; font-size: 12px; box-sizing: border-box; outline: none; }
        .input-box:focus { border-color: var(--gold-primary); }

        /* Admin Table */
        .admin-table { width: 100%; border-collapse: collapse; font-size: 10px; margin-top: 10px; }
        .admin-table th, .admin-table td { border: 1px solid #333; padding: 8px; text-align: left; }
        .admin-table th { background: rgba(212,175,55,0.2); color: var(--gold-primary); }

        @media(max-width: 768px) {
            .product-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .market-header h1 { font-size: 18px; }
            .modal-content { padding: 15px; }
            .form-group-grid { grid-template-columns: 1fr; }
            .form-full { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <!-- Subtle Admin Lock -->
    <div class="lock-btn-fixed" onclick="openAdminModal()" title="Admin"><i class="fa-solid fa-lock"></i></div>

    <!-- Draggable Floating Luxury Basket -->
    <div class="floating-basket" id="floatingBasket" title="Drag or Click to Checkout">
        <i class="fa-solid fa-basket-shopping"></i>
        <span class="basket-count" id="cartBadge">0</span>
    </div>

    <!-- Header & Search Bar -->
    <div class="market-header">
        <i class="fa-solid fa-house-chimney" style="color:var(--gold-primary); font-size: 22px;"></i>
        <h1>BANGLADESH LUXURY MARKET</h1>
        <p style="color: var(--text-gray); font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase; margin: 0;">Local Retail & Elite Global Showcase</p>
        
        <!-- Search Bar with Live Speech & Camera Input -->
        <div class="search-bar-container">
            <i class="fa-solid fa-magnifying-glass" style="color:var(--gold-primary); margin-left: 5px;"></i>
            <input type="text" id="searchInput" placeholder="Search luxury products..." onkeyup="filterProducts()">
            <button class="search-icon-btn" onclick="startVoiceSearch()" title="Voice Search"><i class="fa-solid fa-microphone"></i></button>
            <button class="search-icon-btn" onclick="triggerImageSearch()" title="Image Search"><i class="fa-solid fa-camera"></i></button>
            <input type="file" id="imageUploadInput" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
        </div>
    </div>

    <!-- 5 Luxury Category Menu Bar -->
    <div class="category-menu" id="categoryMenu">
        <div class="cat-chip active" onclick="filterCategory('All', this)">🌟 All Products</div>
        <div class="cat-chip" onclick="filterCategory('Home Decor', this)">🛏️ Home Decor</div>
        <div class="cat-chip" onclick="filterCategory("Men's Fashion", this)">👔 Men's Fashion</div>
        <div class="cat-chip" onclick="filterCategory("Women's Fashion", this)">👗 Women's Fashion</div>
        <div class="cat-chip" onclick="filterCategory('Baby', this)">🍼 Baby</div>
        <div class="cat-chip" onclick="filterCategory('Art & Craft', this)">🏺 Art & Craft</div>
    </div>

    <!-- Product Grid Section -->
    <div class="product-grid" id="marketProductGrid"></div>

    <!-- Fullscreen Product Details Modal -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content" id="modalBody"></div>
    </div>

    <script>
        // Draggable Floating Basket
        const basket = document.getElementById('floatingBasket');
        let isDragging = false, startX, startY, initialX, initialY;

        basket.addEventListener('mousedown', dragStart);
        basket.addEventListener('touchstart', dragStart, {passive: true});
        document.addEventListener('mousemove', drag);
        document.addEventListener('touchmove', drag, {passive: true});
        document.addEventListener('mouseup', dragEnd);
        document.addEventListener('touchend', dragEnd);

        function dragStart(e) {
            isDragging = true;
            startX = e.clientX || e.touches[0].clientX;
            startY = e.clientY || e.touches[0].clientY;
            let rect = basket.getBoundingClientRect();
            initialX = rect.left;
            initialY = rect.top;
            basket.style.right = 'auto';
            basket.style.top = initialY + 'px';
            basket.style.left = initialX + 'px';
        }

        function drag(e) {
            if (!isDragging) return;
            let currentX = e.clientX || e.touches[0].clientX;
            let currentY = e.clientY || e.touches[0].clientY;
            basket.style.left = (initialX + (currentX - startX)) + 'px';
            basket.style.top = (initialY + (currentY - startY)) + 'px';
        }

        function dragEnd() { isDragging = false; }

        basket.onclick = function() {
            if(!isDragging) { openCheckoutModal(); }
        };

        // Default Sample Products with Seller set shipping cost
        function getProducts() {
            let p = JSON.parse(localStorage.getItem('mme_products') || '[]');
            if(p.length === 0) {
                p = [
                    { name: "Royal Gamar Bed", title: "Handcrafted Luxury Teak Bed", category: "Home Decor", price: 45000, bd: "৳ 45,000", shipping: 100, desc: "Pure high-gloss lacquer finish with solid Gamar wood structure." },
                    { name: "Executive Silk Suit", title: "Premium Men's Formal Wear", category: "Men's Fashion", price: 8500, bd: "৳ 8,500", shipping: 70, desc: "Tailored Italian cut luxury fabric designed for top executives." },
                    { name: "Designer Silk Saree", title: "Royal Katan Silk Saree", category: "Women's Fashion", price: 15000, bd: "৳ 15,000", shipping: 80, desc: "Exquisite hand-woven golden zari work for luxury occasions." },
                    { name: "Golden Baby Stroller", title: "Ultra Safe Luxury Pram", category: "Baby", price: 22000, bd: "৳ 22,000", shipping: 120, desc: "Gold-plated alloy frame with shock-absorbent wheels." },
                    { name: "Artisan Ceramic Vase", title: "Handmade Gold Leaf Decor", category: "Art & Craft", price: 3500, bd: "৳ 3,500", shipping: 60, desc: "Exclusive golden accented masterpiece for modern living rooms." }
                ];
            }
            return p;
        }

        // Auto-Rotating / Scrolling Grid Display
        function loadMarketProducts(filterCat = 'All') {
            let grid = document.getElementById('marketProductGrid');
            let products = getProducts();

            if(filterCat !== 'All') {
                products = products.filter(p => p.category && p.category.toLowerCase() === filterCat.toLowerCase());
            }

            grid.innerHTML = '';
            products.forEach((p, index) => {
                let card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-img-box" onclick="openProductDetails(${index})">
                        <img src="https://cdn-icons-png.flaticon.com/512/3176/3176363.png" alt="Product">
                    </div>
                    <div class="product-info">
                        <div class="product-title" onclick="openProductDetails(${index})">${p.title || p.name}</div>
                        <div class="stars"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></div>
                        <div style="font-size:11px; color:var(--gold-primary); font-weight:bold;">${p.bd || '৳ ' + p.price}</div>
                    </div>
                    <div class="card-actions">
                        <button class="card-btn" onclick="openProductDetails(${index})">View Details</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(cat, el) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            loadMarketProducts(cat);
        }

        function filterProducts() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let products = getProducts();
            let grid = document.getElementById('marketProductGrid');
            grid.innerHTML = '';
            products.filter(p => (p.title || p.name).toLowerCase().includes(query)).forEach((p, index) => {
                let card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-img-box" onclick="openProductDetails(${index})"><img src="https://cdn-icons-png.flaticon.com/512/3176/3176363.png"></div>
                    <div class="product-info">
                        <div class="product-title">${p.title || p.name}</div>
                        <div class="stars"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></div>
                        <div style="font-size:11px; color:var(--gold-primary); font-weight:bold;">${p.bd || '৳ ' + p.price}</div>
                    </div>
                    <div class="card-actions"><button class="card-btn" onclick="openProductDetails(${index})">View Details</button></div>
                `;
                grid.appendChild(card);
            });
        }

        // Live Speech Recognition for Voice Search
        function startVoiceSearch() {
            try {
                let SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if(!SpeechRecognition) {
                    alert("Speech Recognition not supported in this browser.");
                    return;
                }
                let recognition = new SpeechRecognition();
                recognition.lang = 'bn-BD';
                recognition.onstart = () => { document.getElementById('searchInput').placeholder = "Listening..."; };
                recognition.onresult = (event) => {
                    let spokenText = event.results[0][0].transcript;
                    document.getElementById('searchInput').value = spokenText;
                    filterProducts();
                    document.getElementById('searchInput').placeholder = "Search luxury products...";
                };
                recognition.start();
            } catch(e) {
                let text = prompt("Speak or type product name:");
                if(text) { document.getElementById('searchInput').value = text; filterProducts(); }
            }
        }

        // Camera / Image Search Trigger
        function triggerImageSearch() {
            document.getElementById('imageUploadInput').click();
        }

        function handleImageUpload(event) {
            let file = event.target.files[0];
            if(file) {
                alert("Visual Image Analyzed: Matching luxury product catalog...");
                document.getElementById('searchInput').value = "Handcrafted";
                filterProducts();
            }
        }

        // Product Details Modal with Quantity Counter & Pricing
        function openProductDetails(index) {
            let products = getProducts();
            let p = products[index] || products[0];
            let basePrice = p.price || 45000;
            let shippingCost = p.shipping || 100;

            let modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                <div class="details-stack">
                    <div>
                        <div class="large-preview-wrap">
                            <img id="mainPreviewImg" src="https://cdn-icons-png.flaticon.com/512/3176/3176363.png" onclick="toggleZoom(this)" title="Click to Zoom">
                        </div>
                        <div class="thumb-gallery">
                            <img src="https://cdn-icons-png.flaticon.com/512/3176/3176363.png" class="thumb-img" onclick="setMainImg(this.src)">
                            <img src="https://cdn-icons-png.flaticon.com/512/2933/2933888.png" class="thumb-img" onclick="setMainImg(this.src)">
                            <img src="https://cdn-icons-png.flaticon.com/512/1041/1041883.png" class="thumb-img" onclick="setMainImg(this.src)">
                            <img src="https://cdn-icons-png.flaticon.com/512/2618/2618488.png" class="thumb-img" onclick="setMainImg(this.src)">
                            <img src="https://cdn-icons-png.flaticon.com/512/3050/3050259.png" class="thumb-img" onclick="setMainImg(this.src)">
                        </div>
                        <div style="margin-top:10px; background:#000; border:1px solid rgba(255,255,255,0.15); border-radius:10px; padding:8px; text-align:center;">
                            <span style="font-size:8px; color:var(--gold-light); text-transform:uppercase; letter-spacing:1px;">Product Video Showcase</span>
                            <div style="font-size:10px; color:#aaa; margin-top:3px;"><i class="fa-solid fa-circle-play" style="color:var(--gold-primary); font-size:14px;"></i> High Definition Preview Active</div>
                        </div>
                    </div>
                    <div>
                        <span style="font-size:9px; color:var(--gold-primary); font-weight:bold; letter-spacing:2px;">${p.category || 'LUXURY ITEM'}</span>
                        <h2 style="font-family:'Cormorant Garamond', serif; color:#fff; font-size:24px; margin:4px 0 6px 0;">${p.title || p.name}</h2>
                        <div class="stars"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i> (Global Certified)</div>
                        <p style="color:#aaa; font-size:11px; line-height:1.6; margin:10px 0;">${p.desc || 'Masterpiece craftsmanship engineered for premier lifestyle requirements.'}</p>
                        
                        <div style="font-size:16px; color:var(--gold-primary); font-weight:800; margin-bottom:5px;">Price: ৳ <span id="unitPrice">${basePrice.toLocaleString()}</span></div>
                        <div style="font-size:11px; color:#aaa; margin-bottom:10px;">Seller Shipping Cost: ৳ <span id="shippingFee">${shippingCost}</span></div>

                        <!-- Quantity Selector -->
                        <div class="qty-box">
                            <span style="font-size:11px; color:var(--gold-light);">Quantity:</span>
                            <button class="qty-btn" onclick="updateQty(-1)">-</button>
                            <span id="prodQty" style="font-weight:bold; font-size:14px; min-width:20px; text-align:center;">1</span>
                            <button class="qty-btn" onclick="updateQty(1)">+</button>
                        </div>

                        <div style="font-size:15px; color:#fff; font-weight:bold; margin-bottom:15px;">Total Subtotal: ৳ <span id="totalItemPrice">${(basePrice + shippingCost).toLocaleString()}</span></div>

                        <button class="apply-btn" onclick="addCartWithQty(event, '${p.title || p.name}', ${basePrice}, ${shippingCost})">ADD TO CART</button>
                    </div>
                </div>
            `;
            document.getElementById('productModal').style.display = 'flex';
        }

        let currentQty = 1;
        let activeBasePrice = 45000;
        let activeShipping = 100;

        function updateQty(change) {
            currentQty += change;
            if(currentQty < 1) currentQty = 1;
            document.getElementById('prodQty').innerText = currentQty;
            let subtotal = (activeBasePrice * currentQty) + activeShipping;
            document.getElementById('totalItemPrice').innerText = subtotal.toLocaleString();
        }

        function setMainImg(src) {
            let img = document.getElementById('mainPreviewImg');
            img.style.transform = 'scale(1)';
            img.src = src;
        }

        function toggleZoom(img) {
            if(img.style.transform === 'scale(1.8)') {
                img.style.transform = 'scale(1)';
                img.style.cursor = 'zoom-in';
            } else {
                img.style.transform = 'scale(1.8)';
                img.style.cursor = 'zoom-out';
            }
        }

        // Add to Cart with Exact Quantity & Shipping Calculation
        function addCartWithQty(event, prodName, price, shipping) {
            let badge = document.getElementById('cartBadge');
            badge.innerText = parseInt(badge.innerText) + currentQty;

            let cartItem = { name: prodName, qty: currentQty, price: price, shipping: shipping };
            let cart = JSON.parse(localStorage.getItem('mme_cart_details') || '[]');
            cart.push(cartItem);
            localStorage.setItem('mme_cart_details', JSON.stringify(cart));

            playCoinSound();

            let btnRect = event.target.getBoundingClientRect();
            let basketRect = basket.getBoundingClientRect();

            let coin = document.createElement('div');
            coin.className = 'flying-coin';
            coin.style.left = btnRect.left + 'px';
            coin.style.top = btnRect.top + 'px';
            document.body.appendChild(coin);

            setTimeout(() => {
                coin.style.left = (basketRect.left + 15) + 'px';
                coin.style.top = (basketRect.top + 15) + 'px';
                coin.style.transform = 'scale(0.2) rotate(720deg)';
                coin.style.opacity = '0';
            }, 30);

            setTimeout(() => {
                coin.remove();
                closeModal();
                basket.classList.add('pulse-focus');
                setTimeout(() => { basket.classList.remove('pulse-focus'); }, 2000);
            }, 800);
            currentQty = 1; // reset
        }

        function playCoinSound() {
            try {
                let ctx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch(e) {}
        }

        // Checkout Modal with Dynamic Total Calculation (Product Price + Seller Shipping)
        function openCheckoutModal() {
            let cart = JSON.parse(localStorage.getItem('mme_cart_details') || '[]');
            let totalProductCost = 0;
            let totalShippingCost = 0;

            cart.forEach(item => {
                totalProductCost += (item.price * item.qty);
                totalShippingCost += item.shipping;
            });
            let grandTotal = totalProductCost + totalShippingCost;

            let modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                <h3 style="font-family:'Cormorant Garamond', serif; color:var(--gold-primary); font-size:22px; text-align:center; margin-bottom:6px;">Luxury Shopping & Checkout</h3>
                <p style="font-size:10px; color:#aaa; text-align:center; margin-bottom:15px;">Total Cart Items: <b style="color:#fff;">${cart.length}</b> | Grand Total: <b style="color:var(--gold-primary);">৳ ${grandTotal.toLocaleString()}</b> (Shipping Included)</p>
                
                <div class="form-group-grid">
                    <div>
                        <label style="font-size:8px; color:var(--gold-light); text-transform:uppercase; font-weight:bold;">Full Name *</label>
                        <input type="text" id="custName" class="input-box" placeholder="Enter full name" required>
                    </div>
                    <div>
                        <label style="font-size:8px; color:var(--gold-light); text-transform:uppercase; font-weight:bold;">Gmail Address *</label>
                        <input type="email" id="custEmail" class="input-box" placeholder="client@gmail.com" required>
                    </div>
                    <div>
                        <label style="font-size:8px; color:var(--gold-light); text-transform:uppercase; font-weight:bold;">WhatsApp Number *</label>
                        <div style="display:flex; gap:6px; margin-top:3px;">
                            <select id="phoneCode" style="width:75px; background:#000; border:1px solid #333; color:#fff; padding:10px; border-radius:8px; font-size:11px;">
                                <option value="+880">+880</option>
                            </select>
                            <input type="text" id="custPhone" class="input-box" placeholder="17XXXXXXXX" style="margin-top:0;" required>
                        </div>
                    </div>
                    <div>
                        <label style="font-size:8px; color:var(--gold-light); text-transform:uppercase; font-weight:bold;">City *</label>
                        <input type="text" id="custCity" class="input-box" placeholder="e.g. Dhaka / Rajshahi" required>
                    </div>
                    <div class="form-full">
                        <label style="font-size:8px; color:var(--gold-light); text-transform:uppercase; font-weight:bold;">Complete Delivery Address *</label>
                        <textarea id="custAddr" rows="2" class="input-box" placeholder="House, Road, Area, Postal Code..." required></textarea>
                    </div>
                    <div class="form-full">
                        <label style="font-size:8px; color:var(--gold-light); text-transform:uppercase; font-weight:bold;">Select Payment Gateway *</label>
                        <select id="paymentMethod" class="input-box" onchange="togglePaymentFields()">
                            <option value="bKash">bKash (Send Money to 01767319670)</option>
                            <option value="Nagad">Nagad (Send Money to 01767319670)</option>
                            <option value="International Card">International Card / PayPal</option>
                        </select>
                    </div>
                    <div class="form-full" id="trxBox">
                        <label style="font-size:8px; color:var(--gold-light); text-transform:uppercase; font-weight:bold;">Transaction ID (TrxID) *</label>
                        <input type="text" id="custTrx" class="input-box" placeholder="Enter TrxID after sending payment to 01767319670">
                    </div>
                </div>

                <div style="text-align:center; margin-top:20px;">
                    <button class="apply-btn" onclick="submitFinalOrder(${grandTotal})">ORDER NOW</button>
                </div>
            `;
            document.getElementById('productModal').style.display = 'flex';
        }

        function togglePaymentFields() {
            let method = document.getElementById('paymentMethod').value;
            let trxBox = document.getElementById('trxBox');
            if(method.includes('International')) {
                trxBox.style.display = 'none';
            } else {
                trxBox.style.display = 'block';
            }
        }

        // Strict verification: Cart stays intact until valid order & payment info submitted
        function submitFinalOrder(grandTotal) {
            let name = document.getElementById('custName').value;
            let email = document.getElementById('custEmail').value;
            let phone = '+880' + document.getElementById('custPhone').value;
            let city = document.getElementById('custCity').value;
            let addr = document.getElementById('custAddr').value;
            let payment = document.getElementById('paymentMethod').value;
            let trx = document.getElementById('custTrx') ? document.getElementById('custTrx').value : 'Card Payment';
            let cart = JSON.parse(localStorage.getItem('mme_cart_details') || '[]');

            if(!name || !email || !document.getElementById('custPhone').value || !city || !addr || (!payment.includes('International') && !trx)) {
                alert("দয়া করে সমস্ত বাধ্যতামূলক তথ্য এবং পেমেন্ট ট্রানজেকশন আইডি পূরণ করুন।");
                return;
            }

            let orderData = {
                id: 'ORD-' + Math.floor(100000 + Math.random() * 900000),
                name: name, email: email, phone: phone, city: city, addr: addr, 
                payment: payment + (trx !== 'Card Payment' ? ' (Trx: ' + trx + ')' : ''),
                total: '৳ ' + grandTotal.toLocaleString(),
                status: 'Paid / Pending Dispatch', 
                items: cart.map(i => `${i.name} (x${i.qty})`).join(', ') || 'Direct Luxury Product', 
                date: new Date().toLocaleString()
            };

            let allOrders = JSON.parse(localStorage.getItem('mme_orders') || '[]');
            allOrders.push(orderData);
            localStorage.setItem('mme_orders', JSON.stringify(allOrders));

            localStorage.removeItem('mme_cart_details');
            document.getElementById('cartBadge').innerText = '0';
            alert("পেমেন্ট ভেরিফায়েড! অর্ডার সফলভাবে সাবমিট হয়েছে এবং অ্যাডমিন প্যানেলে কানেক্ট করা হয়েছে।");
            closeModal();
        }

        // Master Admin Panel Modal with Password: mrbtrmlc
        function openAdminModal() {
            let modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                <h3 style="font-family:'Cormorant Garamond', serif; color:var(--gold-primary); text-align:center; font-size:20px; margin-bottom:15px;">Master Admin Control</h3>
                <div id="adminLoginBox">
                    <div style="max-width:280px; margin:0 auto; text-align:left;">
                        <label style="font-size:9px; color:var(--gold-light);">Enter Admin Password</label>
                        <input type="password" id="adminPassInput" class="input-box" placeholder="Password">
                    </div>
                    <div style="text-align:center; margin-top:15px;">
                        <button class="apply-btn" onclick="verifyAdmin()" style="max-width:180px;">Authenticate</button>
                    </div>
                </div>
                <div id="adminDashboard" style="display:none;">
                    <p style="font-size:10px; color:#2ecc71; margin-bottom:8px; font-weight:bold;">Total Connected Orders: <span id="orderCount">0</span></p>
                    <div style="max-height: 320px; overflow-y: auto;">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Order ID</th>
                                    <th>Customer & WhatsApp</th>
                                    <th>Status & Payment</th>
                                    <th>Items & Total</th>
                                </tr>
                            </thead>
                            <tbody id="ordersTableBody"></tbody>
                        </table>
                    </div>
                </div>
            `;
            document.getElementById('productModal').style.display = 'flex';
        }

        function verifyAdmin() {
            let pass = document.getElementById('adminPassInput').value;
            if(pass === 'mrbtrmlc') {
                document.getElementById('adminLoginBox').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                loadOrdersTable();
            } else {
                alert("ভুল পাসওয়ার্ড!");
            }
        }

        function loadOrdersTable() {
            let orders = JSON.parse(localStorage.getItem('mme_orders') || '[]');
            document.getElementById('orderCount').innerText = orders.length;
            let tbody = document.getElementById('ordersTableBody');
            tbody.innerHTML = '';

            if(orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#777;">কোনো অর্ডার নেই।</td></tr>`;
                return;
            }

            orders.forEach(o => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>[${o.id}]</b><br><small>${o.date}</small></td>
                    <td><b>${o.name}</b><br><a href="https://wa.me/${o.phone.replace(/[^0-9]/g,'')}" target="_blank" style="color:#2ecc71; text-decoration:none;"><i class="fa-brands fa-whatsapp"></i> ${o.phone}</a></td>
                    <td><span style="color:var(--gold-primary);">${o.status}</span><br><small>${o.payment}</small><br><small>${o.city} - ${o.addr}</small></td>
                    <td><b>${o.items}</b><br><span style="color:var(--gold-primary);">${o.total}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        window.onload = () => loadMarketProducts('All');
    </script>
</body>
</html>
