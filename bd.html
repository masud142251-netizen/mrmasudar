<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR MASUDAR ENTERPRISE | Luxury Market</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-color: #000; --gold: #D4AF37; --gold-grad: linear-gradient(135deg, #BF953F, #FCF6BA, #AA771C); }
        body { background: var(--bg-color); color: #fff; font-family: 'Montserrat', sans-serif; margin: 0; padding: 10px; }
        
        /* Auto-Sliding Categories */
        .category-menu { display: flex; gap: 10px; overflow-x: auto; padding: 15px 5px; scrollbar-width: none; animation: slideInfinite 30s linear infinite; }
        @keyframes slideInfinite { 0% { transform: translateX(0); } 50% { transform: translateX(-50px); } 100% { transform: translateX(0); } }
        
        .cat-chip { background: #111; border: 1px solid var(--gold); color: #fff; padding: 10px 20px; border-radius: 30px; font-size: 12px; white-space: nowrap; cursor: pointer; }
        .cat-chip.active { background: var(--gold-grad); color: #000; font-weight: bold; }
        
        .search-bar { background: #000; border: 1px solid var(--gold); border-radius: 30px; padding: 12px 20px; display: flex; align-items: center; max-width: 600px; margin: 15px auto; }
        input { background: none; border: none; color: #fff; width: 100%; outline: none; }
        
        /* Modal for Cart Management */
        .cart-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #333; }
        .remove-btn { color: #ff4757; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

    <div class="market-header" style="text-align:center; padding:15px;">
        <h1 style="font-family:'Cormorant Garamond'; color:var(--gold);">MR MASUDAR ENTERPRISE</h1>
        <div class="search-bar">
            <i class="fa fa-search" style="color:var(--gold); margin-right:10px;"></i>
            <input type="text" id="searchInput" placeholder="Search luxury products..." onkeyup="autoTranslateAndFilter()">
            <i class="fa fa-microphone" onclick="startVoice()" style="color:var(--gold); cursor:pointer;"></i>
        </div>
    </div>

    <div class="category-menu" id="catMenu">
        <div class="cat-chip active" onclick="filter(this, 'All')">🌟 All</div>
        <div class="cat-chip" onclick="filter(this, 'Women')">👗 Women's Fashion</div>
        <div class="cat-chip" onclick="filter(this, 'Men')">👔 Men's Fashion</div>
        <div class="cat-chip" onclick="filter(this, 'Baby')">🍼 Baby</div>
        <div class="cat-chip" onclick="filter(this, 'Gift')">🎁 Gift</div>
        <div class="cat-chip" onclick="filter(this, 'Decor')">🏺 Decor</div>
    </div>

    <div id="grid" style="display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; max-width:600px; margin:auto;"></div>

    <script>
        const dict = { "বিছানা": "Bed", "পোশাক": "Suit", "বেবি": "Baby", "উপহার": "Gift", "সাজসজ্জা": "Decor" };
        let idleTimer;

        // Reset timer function (5 minutes)
        function resetIdleTimer() {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                localStorage.removeItem('mme_cart_details');
                location.reload();
            }, 300000); // 300,000ms = 5 minutes
        }
        document.onmousemove = resetIdleTimer;

        function autoTranslateAndFilter() {
            let input = document.getElementById('searchInput');
            let val = input.value;
            for(let b in dict) { if(val.includes(b)) input.value = dict[b]; }
            // Filter logic...
        }

        function startVoice() {
            let rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            rec.lang = 'bn-BD';
            rec.onresult = (e) => {
                let text = e.results[0][0].transcript;
                for(let b in dict) { if(text.includes(b)) text = dict[b]; }
                document.getElementById('searchInput').value = text;
                // Auto Search trigger
            };
            rec.start();
        }

        function openCheckout() {
            let cart = JSON.parse(localStorage.getItem('mme_cart_details') || '[]');
            let html = cart.map((item, i) => `
                <div class="cart-item">
                    <span>${item.name} (x${item.qty}) - ৳ ${item.price * item.qty}</span>
                    <span class="remove-btn" onclick="removeItem(${i})"><i class="fa fa-trash"></i></span>
                </div>
            `).join('');
            // Display modal...
        }

        function removeItem(i) {
            let cart = JSON.parse(localStorage.getItem('mme_cart_details') || '[]');
            cart.splice(i, 1);
            localStorage.setItem('mme_cart_details', JSON.stringify(cart));
            openCheckout(); // Refresh modal
        }
        
        window.onload = resetIdleTimer;
    </script>
</body>
</html>
