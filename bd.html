<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR MASUDAR ENTERPRISE | Bangladesh Luxury Market</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --surface-card: #0a0a0a;
            --gold-primary: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            --border-luxury: rgba(212, 175, 55, 0.4);
            --text-white: #ffffff;
            --text-gray: #aaaaaa;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Top Header */
        .market-header {
            text-align: center;
            padding: 30px 20px;
            border: 1px solid var(--border-luxury);
            border-radius: 20px;
            background: var(--surface-card);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.15);
            max-width: 1200px;
            margin: 0 auto 30px auto;
        }
        .market-header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 28px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 10px 0 5px 0;
            letter-spacing: 2px;
        }

        /* Floating Luxury Cart Basket */
        .floating-basket {
            position: fixed;
            top: 25px;
            right: 25px;
            background: var(--gold-gradient);
            color: #000;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.7);
            cursor: pointer;
            z-index: 9999;
            transition: 0.3s;
            animation: floatBasket 3s infinite ease-in-out alternate;
        }
        .floating-basket:hover { transform: scale(1.1); }
        @keyframes floatBasket { from { transform: translateY(0); } to { transform: translateY(-8px); } }
        .basket-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #fff;
            color: #000;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 7px;
            border-radius: 50%;
            border: 2px solid #000;
        }

        /* Product Grid (4 items desktop, 2 items mobile) */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Luxury Product Card */
        .product-card {
            background: var(--surface-card);
            border: 1px solid var(--border-luxury);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            transition: 0.4s;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card:hover {
            border-color: var(--gold-primary);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
            transform: translateY(-5px);
        }
        .product-img-box {
            width: 100%;
            height: 180px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
        }
        .product-img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: 0.5s;
        }
        .product-card:hover .product-img-box img { transform: scale(1.08); }

        .product-info {
            padding: 15px;
            text-align: center;
        }
        .product-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-white);
            margin: 0 0 8px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }
        .stars {
            color: var(--gold-primary);
            font-size: 10px;
            margin-bottom: 8px;
        }
        .card-actions {
            display: flex;
            border-top: 1px solid #222;
        }
        .card-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px;
            color: var(--gold-primary);
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }
        .card-btn:hover { background: rgba(212, 175, 55, 0.15); }
        .card-btn.add-cart { border-left: 1px solid #222; color: #fff; }
        .card-btn.add-cart:hover { background: var(--gold-gradient); color: #000; }

        /* Full Screen Luxury Details Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-content {
            background: var(--surface-card);
            border: 2px solid var(--gold-primary);
            border-radius: 24px;
            max-width: 950px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 35px;
            position: relative;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.4);
            animation: zoomIn 0.3s ease-out;
        }
        @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .close-modal {
            position: absolute;
            top: 20px; right: 20px;
            background: transparent;
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            width: 35px; height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: flex; align-items: center; justify-content: center;
            transition: 0.3s;
        }
        .close-modal:hover { background: var(--gold-primary); color: #000; }

        .apply-btn {
            background: var(--gold-gradient);
            border: none;
            padding: 14px;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 30px;
            cursor: pointer;
            color: #000;
            width: 100%;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        .apply-btn:hover { transform: scale(1.02); filter: brightness(1.1); }

        /* Flying Animation Object */
        .flying-item {
            position: fixed;
            width: 40px;
            height: 40px;
            background: var(--gold-primary);
            border-radius: 50%;
            z-index: 99999;
            pointer-events: none;
            transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* Responsive Mobile Layout: 2 items per line */
        @media(max-width: 768px) {
            .product-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .market-header h1 { font-size: 22px; }
            .product-img-box { height: 130px; }
            .modal-content { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- Floating Luxury Basket -->
    <div class="floating-basket" onclick="openCartDrawer()" title="View Cart">
        <i class="fa-solid fa-basket-shopping"></i>
        <span class="basket-count" id="cartBadge">0</span>
    </div>

    <!-- Header -->
    <div class="market-header">
        <i class="fa-solid fa-house-chimney" style="color:var(--gold-primary); font-size: 30px;"></i>
        <h1>BANGLADESH LUXURY MARKET</h1>
        <p style="color: var(--text-gray); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; margin: 0;">Local Retail, Premium Essentials & Global Hub</p>
    </div>

    <!-- Product Grid Section -->
    <div class="product-grid" id="marketProductGrid"></div>

    <!-- Fullscreen Product Details Modal -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content" id="modalBody"></div>
    </div>

    <script>
        function loadMarketProducts() {
            let grid = document.getElementById('marketProductGrid');
            let products = JSON.parse(localStorage.getItem('mme_products') || '[]');

            if(products.length === 0) {
                products = [
                    { name: "Royal Gamar Bed", title: "Handcrafted Luxury Teak Bed", category: "HOME DECOR", stock: "15", bd: "৳ 45,000", global: "$ 450", desc: "Pure high-gloss lacquer finish with solid Gamar wood structure." },
                    { name: "Executive Silk Suit", title: "Premium Men's Formal Wear", category: "FASHION (MEN)", stock: "30", bd: "৳ 8,500", global: "$ 85", desc: "Tailored Italian cut luxury fabric designed for top executives." },
                    { name: "Golden Baby Stroller", title: "Ultra Safe Luxury Pram", category: "BABY", stock: "10", bd: "৳ 22,000", global: "$ 220", desc: "Gold-plated alloy frame with shock-absorbent wheels." },
                    { name: "Artisan Ceramic Vase", title: "Handmade Gold Leaf Decor", category: "ART & CRAFT", stock: "25", bd: "৳ 3,500", global: "$ 35", desc: "Exclusive golden accented masterpiece for modern living rooms." }
                ];
            }

            grid.innerHTML = '';
            products.forEach((p, index) => {
                let card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-img-box" onclick="openProductDetails(${index})">
                        <img src="https://cdn-icons-png.flaticon.com/512/3176/3176363.png" alt="Product">
                    </div>
                    <div class="product-info">
                        <div class="product-title" onclick="openProductDetails(${index})">${p.title || p.name}</div>
                        <div class="stars"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></div>
                        <div style="font-size:12px; color:var(--gold-primary); font-weight:bold;">${p.bd || p.global || '৳ 2,500'}</div>
                    </div>
                    <div class="card-actions">
                        <button class="card-btn" onclick="openProductDetails(${index})">Explore</button>
                        <button class="card-btn add-cart" onclick="addToCart(event, '${p.name}')">Add to Cart</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function addToCart(event, productName) {
            let badge = document.getElementById('cartBadge');
            let currentCount = parseInt(badge.innerText) + 1;
            badge.innerText = currentCount;

            let btnRect = event.target.getBoundingClientRect();
            let basketRect = document.querySelector('.floating-basket').getBoundingClientRect();

            let flyer = document.createElement('div');
            flyer.className = 'flying-item';
            flyer.style.left = btnRect.left + 'px';
            flyer.style.top = btnRect.top + 'px';
            document.body.appendChild(flyer);

            setTimeout(() => {
                flyer.style.left = basketRect.left + 'px';
                flyer.style.top = basketRect.top + 'px';
                flyer.style.transform = 'scale(0.2)';
                flyer.style.opacity = '0';
            }, 50);

            setTimeout(() => { flyer.remove(); }, 850);
            playBuzzerSound();
        }

        function playBuzzerSound() {
            try {
                let ctx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch(e) {}
        }

        function openProductDetails(index) {
            let products = JSON.parse(localStorage.getItem('mme_products') || '[]');
            if(products.length === 0) {
                products = [
                    { name: "Royal Gamar Bed", title: "Handcrafted Luxury Teak Bed", category: "HOME DECOR", stock: "15", bd: "৳ 45,000", global: "$ 450", desc: "Pure high-gloss lacquer finish with solid Gamar wood structure." }
                ];
            }
            let p = products[index] || products[0];

            let modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                <div style="display:grid; grid-template-columns: 1fr 1.2fr; gap:30px; align-items:center;">
                    <div style="background:#000; border:1px solid #333; border-radius:18px; height:280px; display:flex; align-items:center; justify-content:center;">
                        <img src="https://cdn-icons-png.flaticon.com/512/3176/3176363.png" style="max-height:210px; object-fit:contain;">
                    </div>
                    <div>
                        <span style="font-size:10px; color:var(--gold-primary); font-weight:bold; letter-spacing:2px;">${p.category || 'LUXURY ITEM'}</span>
                        <h2 style="font-family:'Cormorant Garamond', serif; color:#fff; font-size:28px; margin:5px 0 10px 0;">${p.title || p.name}</h2>
                        <div class="stars"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i> (Global Certified)</div>
                        <p style="color:#aaa; font-size:12px; line-height:1.7; margin:15px 0;">${p.desc || 'Premium quality masterpiece designed for elite lifestyle.'}</p>
                        <div style="font-size:20px; color:var(--gold-primary); font-weight:800; margin-bottom:20px;">Price: ${p.bd || p.global || '৳ 2,500'}</div>
                        <button class="apply-btn" onclick="openCheckoutForm('${p.title || p.name}')">Proceed to Checkout & Order</button>
                    </div>
                </div>
            `;
            document.getElementById('productModal').style.display = 'flex';
        }

        function openCheckoutForm(prodName) {
            let modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                <h3 style="font-family:'Cormorant Garamond', serif; color:var(--gold-primary); font-size:22px; text-align:center; margin-bottom:20px;">Secure Order Checkout</h3>
                <p style="text-align:center; font-size:11px; color:#aaa; margin-bottom:20px;">Selected Item: <b style="color:#fff;">${prodName}</b></p>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; text-align:left;">
                    <div><label style="font-size:10px; color:var(--gold-light);">Full Name *</label><input type="text" id="custName" style="width:100%; background:#000; border:1px solid #333; padding:12px; color:#fff; border-radius:8px; margin-top:5px;" required></div>
                    <div><label style="font-size:10px; color:var(--gold-light);">Phone Number *</label><input type="text" id="custPhone" style="width:100%; background:#000; border:1px solid #333; padding:12px; color:#fff; border-radius:8px; margin-top:5px;" required></div>
                    <div style="grid-column: span 2;"><label style="font-size:10px; color:var(--gold-light);">Complete Delivery Address *</label><textarea id="custAddr" rows="2" style="width:100%; background:#000; border:1px solid #333; padding:12px; color:#fff; border-radius:8px; margin-top:5px;" required></textarea></div>
                </div>
                <div style="text-align:center; margin-top:25px;">
                    <button class="apply-btn" onclick="finalizeOrder()">Confirm & Place Order</button>
                </div>
            `;
        }

        function finalizeOrder() {
            let name = document.getElementById('custName').value;
            let phone = document.getElementById('custPhone').value;
            if(!name || !phone) {
                alert("দয়া করে নাম এবং ফোন নম্বর পূরণ করুন।");
                return;
            }
            alert("অর্ডার সফলভাবে সম্পন্ন হয়েছে! আপনার পণ্যটি শিপ্রুটে পাঠানো হয়েছে।");
            closeModal();
        }

        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        function openCartDrawer() {
            alert("Luxury Basket is active. Total items in cart: " + document.getElementById('cartBadge').innerText);
        }

        window.onload = loadMarketProducts;
    </script>
</body>
</html>
