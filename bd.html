<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR MASUDAR ENTERPRISE | Bangladesh Luxury Market</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --surface-card: #0a0a0a;
            --gold-primary: #D4AF37;
            --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            --text-white: #ffffff;
        }
        body { background-color: var(--bg-color); color: var(--text-white); font-family: 'Montserrat', sans-serif; margin: 0; padding: 20px; }
        
        .floating-basket { position: fixed; top: 25px; right: 25px; background: var(--gold-gradient); color: #000; width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: grab; z-index: 9999; box-shadow: 0 0 30px rgba(212, 175, 55, 0.6); }
        .basket-count { position: absolute; top: -5px; right: -5px; background: #fff; padding: 3px 8px; border-radius: 50%; font-size: 11px; font-weight: 800; }
        
        .product-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .product-card { background: var(--surface-card); border: 1px solid rgba(255,255,255,0.2); border-radius: 16px; padding: 15px; transition: 0.3s; text-align: center; }
        .product-card:hover { border-color: var(--gold-primary); transform: translateY(-5px); }
        
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 10000; padding: 20px; overflow-y: auto; }
        .modal-content { background: var(--surface-card); border: 2px solid var(--gold-primary); border-radius: 20px; max-width: 900px; width: 100%; padding: 30px; position: relative; color: #fff; }
        
        .apply-btn { background: var(--gold-gradient); border: none; padding: 15px; width: 100%; border-radius: 30px; font-weight: 800; cursor: pointer; text-transform: uppercase; margin-top: 15px; }
        .thumb-img { width: 60px; height: 60px; border-radius: 8px; cursor: pointer; border: 1px solid var(--gold-primary); margin: 5px; }
        
        @media(max-width: 768px) { .product-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

    <div class="floating-basket" id="floatingBasket"><i class="fa-solid fa-basket-shopping"></i><span class="basket-count" id="cartBadge">0</span></div>
    
    <div class="market-header">
        <h1>BANGLADESH LUXURY MARKET</h1>
        <p style="font-size: 10px; letter-spacing: 3px; text-transform: uppercase;">Elite Global Luxury Showcase</p>
    </div>

    <div class="product-grid" id="marketProductGrid"></div>
    <div class="modal-overlay" id="productModal"><div class="modal-content" id="modalBody"></div></div>

    <script>
        // Load Products
        function loadMarketProducts() {
            let products = JSON.parse(localStorage.getItem('mme_products') || '[{"name":"Luxury Bed", "title":"Handcrafted Teak Bed", "bd":"৳ 45,000", "desc":"Ultra luxury solid Gamar wood bed."}]');
            document.getElementById('marketProductGrid').innerHTML = products.map((p, i) => `
                <div class="product-card">
                    <img src="https://cdn-icons-png.flaticon.com/512/3176/3176363.png" style="width:100%; height:150px; object-fit:contain; cursor:pointer;" onclick="openProductDetails(${i})">
                    <h3 style="font-size:14px; margin:10px 0;">${p.title}</h3>
                    <p style="color:var(--gold-primary); font-weight:bold;">${p.bd}</p>
                    <button class="apply-btn" onclick="openProductDetails(${i})">Explore Luxury</button>
                </div>
            `).join('');
        }

        function openProductDetails(i) {
            let p = JSON.parse(localStorage.getItem('mme_products')||'[]')[i];
            document.getElementById('modalBody').innerHTML = `
                <button class="close-modal" style="background:none; border:none; color:gold; position:absolute; right:20px; top:20px; cursor:pointer;" onclick="closeModal()">X</button>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                    <div><img id="mainImg" src="https://cdn-icons-png.flaticon.com/512/3176/3176363.png" style="width:100%; border-radius:15px;">
                         <div style="display:flex; margin-top:10px;">
                            ${[1,2,3,4,5].map(n => `<img src="https://cdn-icons-png.flaticon.com/512/3176/3176363.png" class="thumb-img" onclick="document.getElementById('mainImg').src=this.src">`).join('')}
                         </div>
                    </div>
                    <div>
                        <h2>${p.title}</h2>
                        <p style="color:#aaa;">${p.desc}</p>
                        <h3>Price: ${p.bd}</h3>
                        <button class="apply-btn" onclick="addToCart('${p.title}')">ADD TO CART</button>
                    </div>
                </div>
            `;
            document.getElementById('productModal').style.display = 'flex';
        }

        function addToCart(name) {
            document.getElementById('cartBadge').innerText = parseInt(document.getElementById('cartBadge').innerText) + 1;
            let cart = JSON.parse(localStorage.getItem('mme_cart') || '[]');
            cart.push(name);
            localStorage.setItem('mme_cart', JSON.stringify(cart));
            // Sound & Animation logic here...
            closeModal();
        }

        function openCheckoutModal() {
            document.getElementById('modalBody').innerHTML = `
                <h2 style="color:var(--gold-primary); text-align:center;">Final Checkout</h2>
                <input type="text" id="cName" placeholder="Full Name" style="width:100%; padding:12px; margin:5px 0; border-radius:8px;">
                <input type="email" id="cEmail" placeholder="Gmail" style="width:100%; padding:12px; margin:5px 0; border-radius:8px;">
                <input type="text" id="cPhone" placeholder="WhatsApp with Country Code (+880...)" style="width:100%; padding:12px; margin:5px 0; border-radius:8px;">
                <input type="text" id="cAddr" placeholder="Complete Delivery Address" style="width:100%; padding:12px; margin:5px 0; border-radius:8px;">
                <select id="payMethod" style="width:100%; padding:12px; margin:5px 0; border-radius:8px;">
                    <option>Cash on Delivery</option>
                    <option>International Card / PayPal</option>
                    <option>Bank Wire Transfer</option>
                </select>
                <button class="apply-btn" onclick="submitOrder()">SUBMIT ORDER & DISPATCH</button>
            `;
            document.getElementById('productModal').style.display = 'flex';
        }

        function submitOrder() {
            alert("Order Submitted Successfully!");
            closeModal();
        }

        function closeModal() { document.getElementById('productModal').style.display = 'none'; }
        window.onload = loadMarketProducts;
    </script>
</body>
</html>
