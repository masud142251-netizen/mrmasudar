<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR MASUDAR ENTERPRISE | Bangladesh Luxury Market</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --surface-card: #0a0a0a;
            --gold-primary: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            --border-luxury: rgba(212, 175, 55, 0.4);
            --text-white: #ffffff;
            --text-gray: #aaaaaa;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* Top Header & Search Bar */
        .market-header {
            text-align: center;
            padding: 15px;
            border: 1px solid var(--border-luxury);
            border-radius: 16px;
            background: var(--surface-card);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
            max-width: 1200px;
            margin: 0 auto 12px auto;
        }
        .market-header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 4px 0;
            letter-spacing: 1px;
        }

        /* Continuous Auto-Sliding Luxury Menu (Click doesn't stop it) */
        .category-menu-wrap {
            max-width: 1200px;
            margin: 0 auto 15px auto;
            overflow: hidden;
            position: relative;
            padding: 5px 0;
        }
        .category-menu {
            display: flex;
            gap: 10px;
            width: max-content;
            animation: autoScrollCat 30s linear infinite;
        }
        @keyframes autoScrollCat {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .cat-chip {
            background: var(--surface-card);
            border: 1px solid var(--border-luxury);
            color: var(--gold-light);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .cat-chip:hover, .cat-chip.active {
            background: var(--gold-gradient);
            color: #000;
            border-color: #fff;
        }

        /* Floating Luxury Basket */
        .floating-basket {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--gold-gradient);
            color: #000;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.9);
            cursor: grab;
            z-index: 9999;
            animation: basketFloatEffect 3s ease-in-out infinite;
        }
        @keyframes basketFloatEffect {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-6px) scale(1.05); }
        }
        
        .basket-center-focus {
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) scale(1.8) !important;
            box-shadow: 0 0 80px #fff, 0 0 50px var(--gold-primary) !important;
            z-index: 99999 !important;
            animation: none !important;
        }

        .basket-count {
            position: absolute;
            top: -3px;
            right: -3px;
            background: #fff;
            color: #000;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 50%;
            border: 2px solid #000;
        }

        /* Large Luxury Coin Animation */
        .flying-coin {
            position: fixed;
            width: 45px;
            height: 45px;
            background: var(--gold-gradient);
            border: 3px solid #fff;
            border-radius: 50%;
            z-index: 99999;
            pointer-events: none;
            box-shadow: 0 0 25px var(--gold-primary);
            transition: all 0.7s cubic-bezier(0.15, 0.85, 0.25, 1);
        }

        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 1200px; margin: 0 auto; }
        .product-card { background: var(--surface-card); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; overflow: hidden; padding: 10px; text-align: center; }
        .apply-btn { background: var(--gold-gradient); border: none; padding: 10px 20px; font-weight: 800; text-transform: uppercase; border-radius: 20px; cursor: pointer; color: #000; width: 100%; max-width: 250px; display: block; margin: 15px auto; font-size: 11px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 10000; padding: 10px; overflow-y: auto; }
        .modal-content { background: var(--surface-card); border: 2px solid var(--gold-primary); border-radius: 18px; width: 100%; max-width: 500px; padding: 20px; position: relative; }
        .close-modal { position: absolute; top: 12px; right: 12px; background: transparent; border: 1px solid var(--gold-primary); color: var(--gold-primary); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>

    <div class="floating-basket" id="floatingBasket">
        <i class="fa-solid fa-basket-shopping"></i>
        <span class="basket-count" id="cartBadge">0</span>
    </div>

    <div class="market-header">
        <h1>MR MASUDAR ENTERPRISE</h1>
        <div class="search-bar-container">
            <input type="text" id="searchInput" placeholder="Search luxury products...">
            <button class="search-icon-btn" onclick="startVoice()"><i class="fa-solid fa-microphone"></i></button>
        </div>
    </div>

    <div class="category-menu-wrap">
        <div class="category-menu">
            <div class="cat-chip" onclick="filter(this, 'Women')">👗 Women's Fashion</div>
            <div class="cat-chip" onclick="filter(this, 'Men')">👔 Men's Fashion</div>
            <div class="cat-chip" onclick="filter(this, 'Baby')">🍼 Baby</div>
            <div class="cat-chip" onclick="filter(this, 'Gift')">🎁 Gift</div>
            <div class="cat-chip" onclick="filter(this, 'Decor')">🏺 Decor</div>
            <div class="cat-chip" onclick="filter(this, 'Women')">👗 Women's Fashion</div>
            <div class="cat-chip" onclick="filter(this, 'Men')">👔 Men's Fashion</div>
            <div class="cat-chip" onclick="filter(this, 'Baby')">🍼 Baby</div>
            <div class="cat-chip" onclick="filter(this, 'Gift')">🎁 Gift</div>
            <div class="cat-chip" onclick="filter(this, 'Decor')">🏺 Decor</div>
        </div>
    </div>

    <div class="product-grid" id="grid">
        <!-- Sample Product -->
        <div class="product-card">
            <div class="product-img-box"><img src="https://cdn-icons-png.flaticon.com/512/3176/3176363.png" style="width:100px;"></div>
            <p>Luxury Saree</p>
            <button class="apply-btn" onclick="addToCart(event, 'Luxury Saree', 15000)">ADD TO CART</button>
        </div>
    </div>

    <div class="modal-overlay" id="modal"><div class="modal-content" id="modalBody"></div></div>

    <script>
        // High Quality Premium Sound Effect
        function playLuxurySound() {
            try {
                let ctx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1000, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(2000, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch(e) {}
        }

        function addToCart(event, name, price) {
            playLuxurySound();
            
            let btnRect = event.target.getBoundingClientRect();
            let basketRect = document.getElementById('floatingBasket').getBoundingClientRect();
            
            let coin = document.createElement('div');
            coin.className = 'flying-coin';
            coin.style.left = btnRect.left + 'px';
            coin.style.top = btnRect.top + 'px';
            document.body.appendChild(coin);

            setTimeout(() => {
                coin.style.left = (basketRect.left + 15) + 'px';
                coin.style.top = (basketRect.top + 15) + 'px';
                coin.style.transform = 'scale(0.2) rotate(720deg)';
                coin.style.opacity = '0';
            }, 30);

            setTimeout(() => {
                coin.remove();
                let basket = document.getElementById('floatingBasket');
                basket.classList.add('basket-center-focus');
                setTimeout(() => basket.classList.remove('basket-center-focus'), 800);
            }, 600);
            
            // Cart Update Logic...
        }
        
        function startVoice() { /* Auto Translate and Search logic */ }
    </script>
</body>
</html>
