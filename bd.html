<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR MASUDAR ENTERPRISE | Bangladesh Luxury Market</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --surface-card: #0a0a0a;
            --gold-primary: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            --border-luxury: rgba(212, 175, 55, 0.4);
            --text-white: #ffffff;
            --text-gray: #aaaaaa;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Secret Admin Lock */
        .lock-btn-fixed { position: fixed; bottom: 12px; left: 12px; color: var(--gold-primary); font-size: 11px; cursor: pointer; z-index: 99999; opacity: 0.2; transition: 0.3s; background: #0a0a0a; padding: 10px; border-radius: 50%; border: 1px solid var(--gold-primary); }
        .lock-btn-fixed:hover { opacity: 1; transform: scale(1.2); }

        /* Top Header */
        .market-header {
            text-align: center;
            padding: 25px 20px;
            border: 1px solid var(--border-luxury);
            border-radius: 20px;
            background: var(--surface-card);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.15);
            max-width: 1200px;
            margin: 0 auto 30px auto;
        }
        .market-header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 8px 0 4px 0;
            letter-spacing: 2px;
        }

        /* Draggable & Floating Luxury Basket */
        .floating-basket {
            position: fixed;
            top: 25px;
            right: 25px;
            background: var(--gold-gradient);
            color: #000;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.9);
            cursor: grab;
            z-index: 9999;
            user-select: none;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }
        .floating-basket:active { cursor: grabbing; }
        .floating-basket.pulse-focus {
            animation: basketFocusPulse 0.6s ease-in-out 3;
            transform: scale(1.25);
            box-shadow: 0 0 50px #fff, 0 0 35px var(--gold-primary);
        }
        @keyframes basketFocusPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }
        .basket-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #fff;
            color: #000;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 50%;
            border: 2px solid #000;
        }

        /* Product Grid (4 items desktop, 2 items mobile) */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Luxury Product Card */
        .product-card {
            background: var(--surface-card);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            transition: 0.3s;
            box-shadow: 0 5px 20px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card:hover {
            border-color: var(--gold-primary);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
            transform: translateY(-4px);
        }
        .product-img-box {
            width: 100%;
            height: 170px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .product-img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: 0.4s;
        }
        .product-card:hover .product-img-box img { transform: scale(1.06); }

        .product-info { padding: 12px; text-align: center; }
        .product-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-white);
            margin: 0 0 6px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }
        .stars { color: var(--gold-primary); font-size: 9px; margin-bottom: 6px; }
        .card-actions { display: flex; border-top: 1px solid #222; }
        .card-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px;
            color: var(--gold-primary);
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }
        .card-btn:hover { background: rgba(212, 175, 55, 0.15); }

        /* Full Screen Luxury Details Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 15px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .modal-content {
            background: var(--surface-card);
            border: 2px solid var(--gold-primary);
            border-radius: 24px;
            max-width: 950px;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            padding: 35px;
            position: relative;
            box-shadow: 0 0 60px rgba(212, 175, 55, 0.5);
            animation: zoomIn 0.3s ease-out;
            box-sizing: border-box;
        }
        @keyframes zoomIn { from { transform: scale(0.93); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .close-modal {
            position: absolute;
            top: 20px; right: 20px;
            background: transparent;
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            width: 35px; height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s;
            z-index: 10;
        }
        .close-modal:hover { background: var(--gold-primary); color: #000; }

        .apply-btn {
            background: var(--gold-gradient);
            border: none;
            padding: 14px;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 30px;
            cursor: pointer;
            color: #000;
            width: 100%;
            letter-spacing: 1.5px;
            transition: 0.2s;
            box-shadow: 0 0 20px rgba(212,175,55,0.4);
        }
        .apply-btn:hover { filter: brightness(1.15); transform: scale(1.01); }

        /* Gallery & Zoom */
        .large-preview-wrap { background: #000; border: 1px solid rgba(255,255,255,0.2); border-radius: 16px; height: 280px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .large-preview-wrap img { max-height: 230px; object-fit: contain; transition: transform 0.3s ease; cursor: zoom-in; }
        .thumb-gallery { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 5px; }
        .thumb-img { width: 55px; height: 55px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); object-fit: cover; cursor: pointer; background: #000; transition: 0.2s; }
        .thumb-img:hover { border-color: var(--gold-primary); transform: scale(1.06); }

        /* Flying Coin Animation */
        .flying-coin {
            position: fixed;
            width: 40px;
            height: 40px;
            background: var(--gold-gradient);
            border: 2px solid #fff;
            border-radius: 50%;
            z-index: 99999;
            pointer-events: none;
            box-shadow: 0 0 20px var(--gold-primary);
            transition: all 0.85s cubic-bezier(0.15, 0.85, 0.25, 1);
        }

        /* Admin Table */
        .admin-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 15px; }
        .admin-table th, .admin-table td { border: 1px solid #333; padding: 10px; text-align: left; }
        .admin-table th { background: rgba(212,175,55,0.2); color: var(--gold-primary); }

        @media(max-width: 768px) {
            .product-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .market-header h1 { font-size: 20px; }
            .product-img-box { height: 130px; }
            .modal-content { padding: 20px; }
            .modal-grid { grid-template-columns: 1fr !important; }
        }
    </style>
</head>
<body>

    <!-- Secret Admin Lock -->
    <div class="lock-btn-fixed" onclick="openAdminModal()" title="Master Admin Control"><i class="fa-solid fa-lock"></i></div>

    <!-- Draggable Floating Luxury Basket -->
    <div class="floating-basket" id="floatingBasket" title="Drag or Click to Checkout">
        <i class="fa-solid fa-basket-shopping"></i>
        <span class="basket-count" id="cartBadge">0</span>
    </div>

    <!-- Header -->
    <div class="market-header">
        <i class="fa-solid fa-house-chimney" style="color:var(--gold-primary); font-size: 26px;"></i>
        <h1>BANGLADESH LUXURY MARKET</h1>
        <p style="color: var(--text-gray); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; margin: 0;">Local Retail & Elite Global Showcase</p>
    </div>

    <!-- Product Grid Section (4 items desktop, 2 mobile) -->
    <div class="product-grid" id="marketProductGrid"></div>

    <!-- Fullscreen Product Details Modal -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content" id="modalBody"></div>
    </div>

    <script>
        // Make Floating Basket Draggable
        const basket = document.getElementById('floatingBasket');
        let isDragging = false, startX, startY, initialX, initialY;

        basket.addEventListener('mousedown', dragStart);
        basket.addEventListener('touchstart', dragStart, {passive: true});
        document.addEventListener('mousemove', drag);
        document.addEventListener('touchmove', drag, {passive: true});
        document.addEventListener('mouseup', dragEnd);
        document.addEventListener('touchend', dragEnd);

        function dragStart(e) {
            isDragging = true;
            startX = e.clientX || e.touches[0].clientX;
            startY = e.clientY || e.touches[0].clientY;
            let rect = basket.getBoundingClientRect();
            initialX = rect.left;
            initialY = rect.top;
            basket.style.right = 'auto';
            basket.style.top = initialY + 'px';
            basket.style.left = initialX + 'px';
        }

        function drag(e) {
            if (!isDragging) return;
            let currentX = e.clientX || e.touches[0].clientX;
            let currentY = e.clientY || e.touches[0].clientY;
            basket.style.left = (initialX + (currentX - startX)) + 'px';
            basket.style.top = (initialY + (currentY - startY)) + 'px';
        }

        function dragEnd() { isDragging = false; }

        basket.onclick = function() {
            if(!isDragging) { openCheckoutModal(); }
        };

        // Load Products
        function loadMarketProducts() {
            let grid = document.getElementById('marketProductGrid');
            let products = JSON.parse(localStorage.getItem('mme_products') || '[]');

            if(products.length === 0) {
                products = [
                    { name: "Royal Gamar Bed", title: "Handcrafted Luxury Teak Bed", category: "HOME DECOR", bd: "৳ 45,000", desc: "Pure high-gloss lacquer finish with solid Gamar wood structure." },
                    { name: "Executive Silk Suit", title: "Premium Men's Formal Wear", category: "FASHION (MEN)", bd: "৳ 8,500", desc: "Tailored Italian cut luxury fabric designed for top executives." },
                    { name: "Golden Baby Stroller", title: "Ultra Safe Luxury Pram", category: "BABY", bd: "৳ 22,000", desc: "Gold-plated alloy frame with shock-absorbent wheels." },
                    { name: "Artisan Ceramic Vase", title: "Handmade Gold Leaf Decor", category: "ART & CRAFT", bd: "৳ 3,500", desc: "Exclusive golden accented masterpiece for modern living rooms." }
                ];
            }

            grid.innerHTML = '';
            products.forEach((p, index) => {
                let card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-img-box" onclick="openProductDetails(${index})">
                        <img src="https://cdn-icons-png.flaticon.com/512/3176/3176363.png" alt="Product">
                    </div>
                    <div class="product-info">
                        <div class="product-title" onclick="openProductDetails(${index})">${p.title || p.name}</div>
                        <div class="stars"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></div>
                        <div style="font-size:12px; color:var(--gold-primary); font-weight:bold;">${p.bd || p.global || '৳ 2,500'}</div>
                    </div>
                    <div class="card-actions">
                        <button class="card-btn" onclick="openProductDetails(${index})">Explore Details</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Open Product Details Modal with 5-7 Images, Zoom & Video Showcase
        function openProductDetails(index) {
            let products = JSON.parse(localStorage.getItem('mme_products') || '[]');
            if(products.length === 0) {
                products = [{ name: "Royal Gamar Bed", title: "Handcrafted Luxury Teak Bed", category: "HOME DECOR", bd: "৳ 45,000", desc: "Pure high-gloss lacquer finish." }];
            }
            let p = products[index] || products[0];

            let modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                <div class="modal-grid" style="display:grid; grid-template-columns: 1.1fr 1.3fr; gap:30px; align-items:start;">
                    <div>
                        <div class="large-preview-wrap">
                            <img id="mainPreviewImg" src="https://cdn-icons-png.flaticon.com/512/3176/3176363.png" onclick="toggleZoom(this)" title="Click to Zoom">
                        </div>
                        <!-- 5 to 7 Image Thumbnails Gallery -->
                        <div class="thumb-gallery">
                            <img src="https://cdn-icons-png.flaticon.com/512/3176/3176363.png" class="thumb-img" onclick="setMainImg(this.src)">
                            <img src="https://cdn-icons-png.flaticon.com/512/2933/2933888.png" class="thumb-img" onclick="setMainImg(this.src)">
                            <img src="https://cdn-icons-png.flaticon.com/512/1041/1041883.png" class="thumb-img" onclick="setMainImg(this.src)">
                            <img src="https://cdn-icons-png.flaticon.com/512/2618/2618488.png" class="thumb-img" onclick="setMainImg(this.src)">
                            <img src="https://cdn-icons-png.flaticon.com/512/3050/3050259.png" class="thumb-img" onclick="setMainImg(this.src)">
                            <img src="https://cdn-icons-png.flaticon.com/512/929/929426.png" class="thumb-img" onclick="setMainImg(this.src)">
                        </div>
                        <!-- Video Showcase -->
                        <div style="margin-top:12px; background:#000; border:1px solid rgba(255,255,255,0.15); border-radius:12px; padding:10px; text-align:center;">
                            <span style="font-size:9px; color:var(--gold-light); text-transform:uppercase; letter-spacing:1px;">Product Video Showcase</span>
                            <div style="font-size:11px; color:#aaa; margin-top:4px;"><i class="fa-solid fa-circle-play" style="color:var(--gold-primary); font-size:16px;"></i> High Definition Preview Active</div>
                        </div>
                    </div>
                    <div>
                        <span style="font-size:10px; color:var(--gold-primary); font-weight:bold; letter-spacing:2px;">${p.category || 'LUXURY ITEM'}</span>
                        <h2 style="font-family:'Cormorant Garamond', serif; color:#fff; font-size:28px; margin:4px 0 8px 0;">${p.title || p.name}</h2>
                        <div class="stars"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i> (Global Certified)</div>
                        <p style="color:#aaa; font-size:12px; line-height:1.7; margin:14px 0;">${p.desc || 'Masterpiece craftsmanship engineered for premier lifestyle requirements.'}</p>
                        <div style="font-size:20px; color:var(--gold-primary); font-weight:800; margin-bottom:20px;">Price: ${p.bd || p.global || '৳ 2,500'}</div>
                        <button class="apply-btn" onclick="addCoinToBasketAndAnimate(event, '${p.title || p.name}')">ADD TO CART</button>
                    </div>
                </div>
            `;
            document.getElementById('productModal').style.display = 'flex';
        }

        function setMainImg(src) {
            let img = document.getElementById('mainPreviewImg');
            img.style.transform = 'scale(1)';
            img.src = src;
        }

        function toggleZoom(img) {
            if(img.style.transform === 'scale(1.8)') {
                img.style.transform = 'scale(1)';
                img.style.cursor = 'zoom-in';
            } else {
                img.style.transform = 'scale(1.8)';
                img.style.cursor = 'zoom-out';
            }
        }

        // Golden Coin Fly Animation, Sound & Basket Pulse
        function addCoinToBasketAndAnimate(event, prodName) {
            let badge = document.getElementById('cartBadge');
            badge.innerText = parseInt(badge.innerText) + 1;

            let cart = JSON.parse(localStorage.getItem('mme_cart') || '[]');
            cart.push(prodName);
            localStorage.setItem('mme_cart', JSON.stringify(cart));

            playCoinSound();

            let btnRect = event.target.getBoundingClientRect();
            let basketRect = basket.getBoundingClientRect();

            let coin = document.createElement('div');
            coin.className = 'flying-coin';
            coin.style.left = btnRect.left + 'px';
            coin.style.top = btnRect.top + 'px';
            document.body.appendChild(coin);

            setTimeout(() => {
                coin.style.left = (basketRect.left + 15) + 'px';
                coin.style.top = (basketRect.top + 15) + 'px';
                coin.style.transform = 'scale(0.2) rotate(720deg)';
                coin.style.opacity = '0';
            }, 30);

            setTimeout(() => {
                coin.remove();
                closeModal();
                basket.classList.add('pulse-focus');
                setTimeout(() => { basket.classList.remove('pulse-focus'); }, 2000);
            }, 800);
        }

        function playCoinSound() {
            try {
                let ctx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch(e) {}
        }

        // Comprehensive International Checkout Form
        function openCheckoutModal() {
            let cart = JSON.parse(localStorage.getItem('mme_cart') || '[]');
            let modalBody = document.getElementById('modalBody');
            
            modalBody.innerHTML = `
                <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                <h3 style="font-family:'Cormorant Garamond', serif; color:var(--gold-primary); font-size:24px; text-align:center; margin-bottom:8px;">Luxury Shopping & Checkout</h3>
                <p style="font-size:11px; color:#aaa; text-align:center; margin-bottom:20px;">Total Items in Cart: <b style="color:#fff;">${cart.length}</b></p>
                
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:14px; text-align:left;">
                    <div>
                        <label style="font-size:9px; color:var(--gold-light); text-transform:uppercase; font-weight:bold;">Full Name *</label>
                        <input type="text" id="custName" placeholder="Enter full name" style="width:100%; background:#000; border:1px solid #333; padding:11px; color:#fff; border-radius:8px; margin-top:4px;" required>
                    </div>
                    <div>
                        <label style="font-size:9px; color:var(--gold-light); text-transform:uppercase; font-weight:bold;">Official Gmail Address *</label>
                        <input type="email" id="custEmail" placeholder="client@gmail.com" style="width:100%; background:#000; border:1px solid #333; padding:11px; color:#fff; border-radius:8px; margin-top:4px;" required>
                    </div>
                    <div>
                        <label style="font-size:9px; color:var(--gold-light); text-transform:uppercase; font-weight:bold;">WhatsApp Number (Country Code Tracked) *</label>
                        <div style="display:flex; gap:6px; margin-top:4px;">
                            <select id="phoneCode" style="width:95px; background:#000; border:1px solid #333; color:#fff; padding:11px; border-radius:8px;">
                                <option value="+880">🇧🇩 +880</option>
                                <option value="+1">🇺🇸 +1</option>
                                <option value="+44">🇬🇧 +44</option>
                                <option value="+91">🇮🇳 +91</option>
                                <option value="+971">🇦🇪 +971</option>
                            </select>
                            <input type="text" id="custPhone" placeholder="17XXXXXXXX" style="width:100%; background:#000; border:1px solid #333; padding:11px; color:#fff; border-radius:8px;" required>
                        </div>
                    </div>
                    <div>
                        <label style="font-size:9px; color:var(--gold-light); text-transform:uppercase; font-weight:bold;">Target Country / Location *</label>
                        <select id="custCountry" style="width:100%; background:#000; border:1px solid #333; padding:11px; color:#fff; border-radius:8px; margin-top:4px;">
                            <option value="Bangladesh">Bangladesh (Local Hub)</option>
                            <option value="United States">United States (USA)</option>
                            <option value="United Kingdom">United Kingdom (UK)</option>
                            <option value="Canada">Canada</option>
                            <option value="UAE">United Arab Emirates (UAE)</option>
                            <option value="Others">Others (237+ Countries)</option>
                        </select>
                    </div>
                    <div style="grid-column: span 2;">
                        <label style="font-size:9px; color:var(--gold-light); text-transform:uppercase; font-weight:bold;">Complete Delivery Address *</label>
                        <textarea id="custAddr" rows="2" placeholder="House, Road, City, Postal Code..." style="width:100%; background:#000; border:1px solid #333; padding:11px; color:#fff; border-radius:8px; margin-top:4px;" required></textarea>
                    </div>
                    <div style="grid-column: span 2;">
                        <label style="font-size:9px; color:var(--gold-light); text-transform:uppercase; font-weight:bold;">Select Payment Gateway *</label>
                        <select id="paymentMethod" style="width:100%; background:#000; border:1px solid #333; padding:11px; color:#fff; border-radius:8px; margin-top:4px;">
                            <option value="Cash on Delivery (COD)">Cash on Delivery (COD)</option>
                            <option value="bKash / Nagad / Rocket">bKash / Nagad / Rocket (Mobile Banking)</option>
                            <option value="International Credit Card / PayPal">International Credit Card / PayPal</option>
                            <option value="Direct Bank Wire Transfer">Direct Bank Wire Transfer</option>
                        </select>
                    </div>
                </div>

                <div style="text-align:center; margin-top:25px;">
                    <button class="apply-btn" onclick="submitFinalOrder()">SUBMIT ORDER & DISPATCH</button>
                </div>
            `;
            document.getElementById('productModal').style.display = 'flex';
        }

        function submitFinalOrder() {
            let name = document.getElementById('custName').value;
            let email = document.getElementById('custEmail').value;
            let phone = document.getElementById('phoneCode').value + document.getElementById('custPhone').value;
            let country = document.getElementById('custCountry').value;
            let addr = document.getElementById('custAddr').value;
            let payment = document.getElementById('paymentMethod').value;
            let cart = JSON.parse(localStorage.getItem('mme_cart') || '[]');

            if(!name || !email || !phone || !addr) {
                alert("দয়া করে সমস্ত বাধ্যতামূলক তথ্য পূরণ করুন।");
                return;
            }

            let orderData = {
                id: 'ORD-' + Math.floor(100000 + Math.random() * 900000),
                name: name, email: email, phone: phone, country: country, addr: addr, payment: payment,
                items: cart.join(', ') || 'Direct Luxury Product', date: new Date().toLocaleString()
            };

            let allOrders = JSON.parse(localStorage.getItem('mme_orders') || '[]');
            allOrders.push(orderData);
            localStorage.setItem('mme_orders', JSON.stringify(allOrders));

            localStorage.removeItem('mme_cart');
            document.getElementById('cartBadge').innerText = '0';
            alert("অর্ডার সফলভাবে সাবমিট হয়েছে এবং অ্যাডমিন প্যানেলে ডিসপাচের জন্য যুক্ত করা হয়েছে!");
            closeModal();
        }

        // Master Admin Panel Modal with Password: mrbtrmlc
        function openAdminModal() {
            let modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                <h3 style="font-family:'Cormorant Garamond', serif; color:var(--gold-primary); text-align:center; font-size:22px; margin-bottom:20px;">Master Admin Panel</h3>
                <div id="adminLoginBox">
                    <div style="max-width:320px; margin:0 auto; text-align:left;">
                        <label style="font-size:10px; color:var(--gold-light);">Enter Admin Password</label>
                        <input type="password" id="adminPassInput" placeholder="Enter password" style="width:100%; background:#000; border:1px solid #333; padding:11px; color:#fff; border-radius:8px; margin-top:5px;">
                    </div>
                    <div style="text-align:center; margin-top:20px;">
                        <button class="apply-btn" onclick="verifyAdmin()" style="max-width:200px;">Authenticate</button>
                    </div>
                </div>
                <div id="adminDashboard" style="display:none;">
                    <p style="font-size:11px; color:#2ecc71; margin-bottom:10px; font-weight:bold;">Total Customer Orders Received: <span id="orderCount">0</span></p>
                    <div style="max-height: 350px; overflow-y: auto;">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Order ID & Date</th>
                                    <th>Customer & Contact</th>
                                    <th>Location & Payment</th>
                                    <th>Items</th>
                                </tr>
                            </thead>
                            <tbody id="ordersTableBody"></tbody>
                        </table>
                    </div>
                </div>
            `;
            document.getElementById('productModal').style.display = 'flex';
        }

        function verifyAdmin() {
            let pass = document.getElementById('adminPassInput').value;
            if(pass === 'mrbtrmlc') {
                document.getElementById('adminLoginBox').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                loadOrdersTable();
            } else {
                alert("ভুল পাসওয়ার্ড!");
            }
        }

        function loadOrdersTable() {
            let orders = JSON.parse(localStorage.getItem('mme_orders') || '[]');
            document.getElementById('orderCount').innerText = orders.length;
            let tbody = document.getElementById('ordersTableBody');
            tbody.innerHTML = '';

            if(orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#777;">কোনো অর্ডার পাওয়া যায়নি।</td></tr>`;
                return;
            }

            orders.forEach(o => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>[${o.id}]</b><br><small style="color:#aaa;">${o.date}</small></td>
                    <td><b>${o.name}</b><br><a href="https://wa.me/${o.phone.replace(/[^0-9]/g,'')}" target="_blank" style="color:#2ecc71; text-decoration:none;"><i class="fa-brands fa-whatsapp"></i> ${o.phone}</a><br><small>${o.email}</small></td>
                    <td><b>${o.country}</b><br><small>${o.addr}</small><br><span style="color:var(--gold-light);">Pay: ${o.payment}</span></td>
                    <td><b style="color:var(--gold-primary);">${o.items}</b></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        window.onload = loadMarketProducts;
    </script>
</body>
