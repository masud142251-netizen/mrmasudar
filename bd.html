<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR MASUDAR ENTERPRISE | Bangladesh Luxury Market</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --surface-card: #0a0a0a;
            --gold-primary: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            --border-luxury: rgba(212, 175, 55, 0.4);
            --text-white: #ffffff;
            --text-gray: #aaaaaa;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 8px;
            overflow-x: hidden;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* Top Header & Search Bar */
        .market-header {
            text-align: center;
            padding: 12px;
            border: 1px solid var(--border-luxury);
            border-radius: 14px;
            background: var(--surface-card);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
            max-width: 1200px;
            margin: 0 auto 10px auto;
        }
        .market-header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 18px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 3px 0;
            letter-spacing: 1px;
        }

        .search-bar-container {
            display: flex;
            align-items: center;
            background: #000;
            border: 1px solid var(--gold-primary);
            border-radius: 30px;
            max-width: 450px;
            margin: 6px auto 0 auto;
            padding: 4px 10px;
        }
        .search-bar-container input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 11px;
            outline: none;
            padding: 4px;
        }
        .search-icon-btn {
            background: transparent;
            border: none;
            color: var(--gold-primary);
            font-size: 12px;
            cursor: pointer;
            padding: 0 5px;
        }

        /* Categories Menu */
        .category-menu-wrap {
            max-width: 1200px;
            margin: 0 auto 10px auto;
            overflow: hidden;
            position: relative;
            padding: 2px 0;
        }
        .category-menu {
            display: flex;
            gap: 8px;
            width: max-content;
            animation: autoScrollCat 25s linear infinite;
        }
        .category-menu:hover { animation-play-state: paused; }
        @keyframes autoScrollCat {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .cat-chip {
            background: var(--surface-card);
            border: 1px solid var(--border-luxury);
            color: var(--gold-light);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .cat-chip:hover, .cat-chip.active {
            background: var(--gold-gradient);
            color: #000;
            border-color: #fff;
        }

        /* Floating Basket with Center Jump Animation */
        .floating-basket {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--gold-gradient);
            color: #000;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.8);
            cursor: grab;
            z-index: 9999;
            user-select: none;
            touch-action: none;
            transition: transform 0.3s ease, left 0.5s ease, top 0.5s ease;
        }
        .basket-center-jump {
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) scale(1.6) !important;
            z-index: 20000;
            box-shadow: 0 0 40px rgba(212, 175, 55, 1);
        }
        .basket-count {
            position: absolute;
            top: -3px;
            right: -3px;
            background: #fff;
            color: #000;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 50%;
            border: 2px solid #000;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .product-card {
            background: var(--surface-card);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: 0.2s ease;
        }
        .product-card:hover {
            border-color: var(--gold-primary);
            transform: translateY(-3px);
        }
        
        /* 🎬 Auto-Playing Video Box */
        .product-video-box {
            width: 100%;
            aspect-ratio: 9 / 16;
            background: #000;
            position: relative;
            overflow: hidden;
            border-radius: 11px 11px 0 0;
        }
        .product-video-box iframe {
            width: 100%;
            height: 100%;
            border: none;
            transform: scale(1.35);
            pointer-events: none;
        }
        .video-click-blocker {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5;
            background: transparent;
        }

        .product-info { padding: 6px; text-align: center; }
        .product-title { font-size: 10px; font-weight: 700; color: #fff; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stars { color: var(--gold-primary); font-size: 7px; margin-bottom: 2px; }
        .card-actions { display: flex; border-top: 1px solid #222; }
        .card-btn { flex: 1; background: transparent; border: none; padding: 6px; color: var(--gold-primary); font-size: 9px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .card-btn:hover { background: rgba(212, 175, 55, 0.15); }

        /* Modal Details Layout */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 4px;
            box-sizing: border-box;
        }
        .modal-content {
            background: var(--surface-card);
            border: 2px solid var(--gold-primary);
            border-radius: 14px;
            max-width: 480px;
            width: 100%;
            max-height: 98vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-sizing: border-box;
            overflow: hidden;
        }
        .close-modal {
            position: absolute;
            top: 8px; right: 8px;
            background: rgba(0,0,0,0.8);
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            width: 25px; height: 25px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 10px;
            display: flex; align-items: center; justify-content: center;
            z-index: 20;
        }

        .modal-scroll-body {
            padding: 10px 14px;
            overflow-y: auto;
            flex: 1;
            box-sizing: border-box;
        }

        .modal-sticky-footer {
            padding: 8px 14px;
            background: #0a0a0a;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            text-align: center;
            flex-shrink: 0;
        }

        .video-sound-toggle {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            font-size: 10px;
        }

        .apply-btn {
            background: var(--gold-gradient);
            border: none;
            padding: 10px;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 22px;
            cursor: pointer;
            color: #000;
            width: 100%;
            font-size: 11px;
            box-shadow: 0 3px 12px rgba(212, 175, 55, 0.4);
        }

        .grand-total-box {
            background: rgba(212, 175, 55, 0.12);
            border: 2px solid var(--gold-primary);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            margin: 8px 0;
        }
        .grand-total-price { font-size: 20px; font-weight: 900; color: var(--gold-primary); margin: 2px 0; }

        .details-stack { display: flex; flex-direction: column; gap: 8px; }
        .large-preview-wrap { background: #000; border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; aspect-ratio: 9/16; width: 100%; max-height: 350px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin: 0 auto; position: relative; }
        .large-preview-wrap iframe { width: 100%; height: 100%; border: none; transform: scale(1.3); }
        
        .qty-box { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 5px 0; }
        .qty-btn { background: #222; border: 1px solid var(--gold-primary); color: #fff; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; font-weight: bold; }

        .cart-item-row { display: flex; justify-content: space-between; align-items: center; background: #000; border: 1px solid #333; padding: 6px 8px; border-radius: 6px; margin-bottom: 5px; font-size: 11px; }
        .cart-remove-btn { color: #ff4d4d; cursor: pointer; font-size: 11px; background: none; border: none; }

        .form-group-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; text-align: left; }
        .form-full { grid-column: span 2; }
        .input-box { width: 100%; background: #000; border: 1px solid #333; padding: 8px; color: #fff; border-radius: 6px; margin-top: 2px; font-size: 11px; box-sizing: border-box; outline: none; }
        .input-box:focus { border-color: var(--gold-primary); }

        /* Glowing Luxury Notice Board */
        .payment-info-box {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), rgba(0, 0, 0, 0.8));
            border: 1px solid var(--gold-primary);
            border-radius: 10px;
            padding: 10px;
            margin: 8px 0;
            font-size: 10px;
            color: var(--gold-light);
            text-align: left;
            line-height: 1.5;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        /* Flying Coin Effect */
        .flying-coin {
            position: fixed;
            width: 22px;
            height: 22px;
            background: var(--gold-gradient);
            border-radius: 50%;
            border: 2px solid #fff;
            z-index: 99999;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 0 12px var(--gold-primary);
        }

        @media(max-width: 768px) {
            .product-grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
            .market-header h1 { font-size: 15px; }
        }
    </style>
</head>
<body>

    <!-- Floating Basket -->
    <div class="floating-basket" id="floatingBasket" title="Checkout">
        <i class="fa-solid fa-basket-shopping"></i>
        <span class="basket-count" id="cartBadge">0</span>
    </div>

    <!-- Header & Search Bar -->
    <div class="market-header">
        <h1>MR MASUDAR ENTERPRISE</h1>
        <p style="color: var(--text-gray); font-size: 7px; letter-spacing: 1px; text-transform: uppercase; margin: 0;">Elite Luxury Bangladesh Market</p>
        
        <div class="search-bar-container">
            <i class="fa-solid fa-magnifying-glass" style="color:var(--gold-primary); margin-left: 4px;"></i>
            <input type="text" id="searchInput" placeholder="Search luxury products..." onkeyup="filterProducts()">
            <button class="search-icon-btn" onclick="startVoiceSearch()"><i class="fa-solid fa-microphone"></i></button>
            <button class="search-icon-btn" onclick="triggerImageSearch()"><i class="fa-solid fa-camera"></i></button>
            <input type="file" id="imageUploadInput" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
        </div>
    </div>

    <!-- Category Menu -->
    <div class="category-menu-wrap">
        <div class="category-menu" id="catMenu">
            <div class="cat-chip" onclick="filterCategory('Women\'s Fashion', this)">👗 Women's Fashion</div>
            <div class="cat-chip" onclick="filterCategory('Men\'s Fashion', this)">👔 Men's Fashion</div>
            <div class="cat-chip" onclick="filterCategory('Baby', this)">🍼 Baby</div>
            <div class="cat-chip" onclick="filterCategory('Gift', this)">🎁 Gift</div>
            <div class="cat-chip" onclick="filterCategory('Decor', this)">🏺 Decor</div>
        </div>
    </div>

    <!-- Product Grid -->
    <div class="product-grid" id="marketProductGrid"></div>

    <!-- Modal -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content" id="modalBody"></div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const currentPath = window.location.pathname;
            if(currentPath.includes('/mr-master-admin')) {
                openHiddenAdminPanel();
            }
        });

        function getCachedProducts() {
            let cached = localStorage.getItem('mme_local_cache_products_v23');
            if(cached) {
                return JSON.parse(cached);
            }
            
            let ytEmbedBase = "https://www.youtube.com/embed/ZVTRyR7Ubas?autoplay=1&mute=1&loop=1&playlist=ZVTRyR7Ubas&controls=0&modestbranding=1&playsinline=1&rel=0";
            
            let defaultProducts = [
                { 
                    name: "Designer Silk Saree", title: "Royal Katan Silk Saree", category: "Women's Fashion", price: 15000, bd: "৳ 15,000", shipping: 80, desc: "Exquisite hand-woven golden zari work for luxury occasions.", 
                    videoUrl: ytEmbedBase 
                },
                { 
                    name: "Executive Silk Suit", title: "Premium Men's Formal Wear", category: "Men's Fashion", price: 8500, bd: "৳ 8,500", shipping: 70, desc: "Tailored Italian cut luxury fabric designed for top executives.", 
                    videoUrl: ytEmbedBase 
                },
                { 
                    name: "Golden Baby Stroller", title: "Ultra Safe Luxury Pram", category: "Baby", price: 22000, bd: "৳ 22,000", shipping: 120, desc: "Gold-plated alloy frame with shock-absorbent wheels.", 
                    videoUrl: ytEmbedBase 
                },
                { 
                    name: "Luxury Gift Hamper", title: "Gold-Accent Gift Box", category: "Gift", price: 4500, bd: "৳ 4,500", shipping: 50, desc: "Exotic curated luxury gift items for special events.", 
                    videoUrl: ytEmbedBase 
                },
                { 
                    name: "Royal Gamar Bed", title: "Handcrafted Luxury Teak Bed", category: "Decor", price: 45000, bd: "৳ 45,000", shipping: 150, desc: "Pure high-gloss lacquer finish with solid Gamar wood structure.", 
                    videoUrl: ytEmbedBase 
                }
            ];

            localStorage.setItem('mme_local_cache_products_v23', JSON.stringify(defaultProducts));
            return defaultProducts;
        }

        let idleTimer;
        function resetIdleTimer() {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                localStorage.removeItem('mme_cart_details');
                location.reload();
            }, 300000);
        }
        window.onload = () => {
            loadMarketProducts("Women's Fashion");
            resetIdleTimer();
            updateCartBadgeCount();
        };
        document.onmousemove = resetIdleTimer;
        document.onkeypress = resetIdleTimer;

        function updateCartBadgeCount() {
            let cart = JSON.parse(localStorage.getItem('mme_cart_details') || '[]');
            let totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cartBadge').innerText = totalQty;
        }

        const basket = document.getElementById('floatingBasket');
        let isDragging = false, startX, startY, initialX, initialY;

        basket.addEventListener('mousedown', dragStart);
        basket.addEventListener('touchstart', dragStart, {passive: true});
        document.addEventListener('mousemove', drag);
        document.addEventListener('touchmove', drag, {passive: true});
        document.addEventListener('mouseup', dragEnd);
        document.addEventListener('touchend', dragEnd);

        function dragStart(e) {
            isDragging = true;
            startX = e.clientX || e.touches[0].clientX;
            startY = e.clientY || e.touches[0].clientY;
            let r = basket.getBoundingClientRect();
            initialX = r.left;
            initialY = r.top;
            basket.style.right = 'auto';
            basket.style.bottom = 'auto';
            basket.style.top = initialY + 'px';
            basket.style.left = initialX + 'px';
        }

        function drag(e) {
            if(!isDragging) return;
            let currentX = e.clientX || e.touches[0].clientX;
            let currentY = e.clientY || e.touches[0].clientY;
            basket.style.left = (initialX + (currentX - startX)) + 'px';
            basket.style.top = (initialY + (currentY - startY)) + 'px';
        }
        function dragEnd() { isDragging = false; }
        basket.onclick = function() { if(!isDragging) { openCheckoutModal(); } };

        function loadMarketProducts(filterCat = "Women's Fashion") {
            let grid = document.getElementById('marketProductGrid');
            let products = getCachedProducts().filter(p => p.category && p.category.toLowerCase() === filterCat.toLowerCase());
            grid.innerHTML = products.map((p) => `
                <div class="product-card" onclick="openProductDetails('${p.title}')">
                    <div class="product-video-box">
                        <div class="video-click-blocker"></div>
                        <iframe src="${p.videoUrl}" frameborder="0" allow="autoplay; encrypted-media" playsinline loading="eager"></iframe>
                    </div>
                    <div class="product-info">
                        <div class="product-title">${p.title}</div>
                        <div class="stars"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></div>
                        <div style="font-size:10px; color:var(--gold-primary); font-weight:bold;">${p.bd}</div>
                    </div>
                    <div class="card-actions">
                        <button class="card-btn">View Details</button>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(cat, el) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            loadMarketProducts(cat);
        }

        function filterProducts() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let products = getCachedProducts();
            let grid = document.getElementById('marketProductGrid');
            grid.innerHTML = products.filter(p => p.title.toLowerCase().includes(query) || p.category.toLowerCase().includes(query)).map((p) => `
                <div class="product-card" onclick="openProductDetails('${p.title}')">
                    <div class="product-video-box">
                        <div class="video-click-blocker"></div>
                        <iframe src="${p.videoUrl}" frameborder="0" allow="autoplay; encrypted-media" playsinline loading="eager"></iframe>
                    </div>
                    <div class="product-info">
                        <div class="product-title">${p.title}</div>
                        <div class="stars"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></div>
                        <div style="font-size:10px; color:var(--gold-primary); font-weight:bold;">${p.bd}</div>
                    </div>
                    <div class="card-actions"><button class="card-btn">View Details</button></div>
                </div>
            `).join('');
        }

        function startVoiceSearch() {
            try {
                let rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
                rec.lang = 'en-US';
                rec.onresult = (e) => { document.getElementById('searchInput').value = e.results[0][0].transcript; filterProducts(); };
                rec.start();
            } catch(e) {
                let txt = prompt("Type product name:");
                if(txt) { document.getElementById('searchInput').value = txt; filterProducts(); }
            }
        }
        function triggerImageSearch() { document.getElementById('imageUploadInput').click(); }
        function handleImageUpload(e) { alert("AI Visual Match Found!"); document.getElementById('searchInput').value = "Royal"; filterProducts(); }

        let currentQty = 1;
        let activePrice = 0;
        let activeShipping = 0;
        let activeTitle = "";
        let isVideoMuted = true;

        function openProductDetails(title) {
            let p = getCachedProducts().find(item => item.title === title) || getCachedProducts()[0];
            activePrice = p.price;
            activeShipping = p.shipping;
            activeTitle = p.title;
            currentQty = 1;
            isVideoMuted = true;

            renderModalContent(p);
            document.getElementById('productModal').style.display = 'flex';
        }

        function renderModalContent(p) {
            let detailVideoSrc = isVideoMuted ? p.videoUrl : p.videoUrl.replace('mute=1', 'mute=0');

            document.getElementById('modalBody').innerHTML = `
                <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                
                <div class="modal-scroll-body">
                    <div class="details-stack">
                        <div>
                            <div class="large-preview-wrap">
                                <iframe src="${detailVideoSrc}" frameborder="0" allow="autoplay; encrypted-media" playsinline></iframe>
                                <div class="video-sound-toggle" onclick="toggleDetailVideoSound('${p.title}')" title="Toggle Sound">
                                    <i class="fa-solid ${isVideoMuted ? 'fa-volume-xmark' : 'fa-volume-high'}"></i>
                                </div>
                            </div>
                        </div>
                        <div>
                            <span style="font-size:8px; color:var(--gold-primary); font-weight:bold; letter-spacing:1px;">${p.category}</span>
                            <h2 style="font-family:'Cormorant Garamond', serif; color:#fff; font-size:18px; margin:2px 0;">${p.title}</h2>
                            <div class="stars"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></div>
                            <p style="color:#aaa; font-size:10px; line-height:1.4; margin:5px 0;">${p.desc}</p>
                            
                            <div style="font-size:12px; color:var(--gold-primary); font-weight:bold;">Unit Price: ৳ <span id="unitPrice">${activePrice.toLocaleString()}</span></div>
                            <div style="font-size:10px; color:#aaa;">Seller Shipping (Included): ৳ <span id="shippingFee">${activeShipping}</span></div>

                            <div class="qty-box">
                                <span style="font-size:10px; color:var(--gold-light);">Quantity:</span>
                                <button class="qty-btn" onclick="updateQty(-1)">-</button>
                                <span id="prodQty" style="font-weight:bold; font-size:11px; min-width:15px; text-align:center;">1</span>
                                <button class="qty-btn" onclick="updateQty(1)">+</button>
                            </div>

                            <div style="font-size:12px; color:#fff; font-weight:bold; text-align:center; margin-bottom:4px;">Subtotal: ৳ <span id="totalItemPrice">${(activePrice + activeShipping).toLocaleString()}</span></div>
                        </div>
                    </div>
                </div>

                <div class="modal-sticky-footer">
                    <button class="apply-btn" id="addToCartBtn">ADD TO CART</button>
                </div>
            `;
            document.getElementById('addToCartBtn').onclick = function(e) { addCartAndAnimate(e, activeTitle, activePrice, activeShipping); };
        }

        function toggleDetailVideoSound(title) {
            isVideoMuted = !isVideoMuted;
            let p = getCachedProducts().find(item => item.title === title);
            renderModalContent(p);
        }

        function updateQty(change) {
            currentQty += change;
            if(currentQty < 1) currentQty = 1;
            document.getElementById('prodQty').innerText = currentQty;
            let subtotal = (activePrice * currentQty) + activeShipping;
            document.getElementById('totalItemPrice').innerText = subtotal.toLocaleString();
        }

        // 🌟 Premium Soft Crystal Chime Sound Effect
        function playSoftLuxurySound() {
            try {
                let ctx = new (window.AudioContext || window.webkitAudioContext)();
                let now = ctx.currentTime;

                let osc1 = ctx.createOscillator();
                let gain1 = ctx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(659.25, now); // E5
                osc1.frequency.exponentialRampToValueAtTime(1318.51, now + 0.4);
                
                gain1.gain.setValueAtTime(0.08, now);
                gain1.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);

                osc1.connect(gain1);
                gain1.connect(ctx.destination);
                osc1.start(now);
                osc1.stop(now + 0.4);

                let osc2 = ctx.createOscillator();
                let gain2 = ctx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(1046.50, now + 0.08); // C6
                osc2.frequency.exponentialRampToValueAtTime(2093.00, now + 0.5);

                gain2.gain.setValueAtTime(0.06, now + 0.08);
                gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);

                osc2.connect(gain2);
                gain2.connect(ctx.destination);
                osc2.start(now + 0.08);
                osc2.stop(now + 0.5);
            } catch(e) {}
        }

        function addCartAndAnimate(event, name, price, shipping) {
            let cart = JSON.parse(localStorage.getItem('mme_cart_details') || '[]');
            cart.push({ name: name, qty: currentQty, price: price, shipping: shipping });
            localStorage.setItem('mme_cart_details', JSON.stringify(cart));
            updateCartBadgeCount();
            closeModal();

            // Play the new soft luxury chime sound
            playSoftLuxurySound();

            // 🪙 Flying Coin & Center Basket Jump Effect
            let btnRect = event.target.getBoundingClientRect();

            let coin = document.createElement('div');
            coin.className = 'flying-coin';
            coin.style.left = (btnRect.left + btnRect.width / 2) + 'px';
            coin.style.top = (btnRect.top + btnRect.height / 2) + 'px';
            document.body.appendChild(coin);

            setTimeout(() => {
                coin.style.left = (window.innerWidth / 2) + 'px';
                coin.style.top = (window.innerHeight / 2) + 'px';
                coin.style.transform = 'scale(1.6)';
            }, 20);

            setTimeout(() => {
                coin.remove();
                basket.classList.add('basket-center-jump');

                setTimeout(() => {
                    basket.classList.remove('basket-center-jump');
                }, 400);
            }, 400);
        }

        function openCheckoutModal() {
            let cart = JSON.parse(localStorage.getItem('mme_cart_details') || '[]');
            if(cart.length === 0) { alert("Your cart is empty."); return; }

            let prodCost = 0, shipCost = 0;
            cart.forEach(i => { prodCost += (i.price * i.qty); shipCost += i.shipping; });
            let grandTotal = prodCost + shipCost;

            let cartItemsHTML = cart.map((item, idx) => `
                <div class="cart-item-row">
                    <span><b>${item.name}</b> (x${item.qty}) - ৳ ${(item.price * item.qty).toLocaleString()}</span>
                    <button class="cart-remove-btn" onclick="removeCartItem(${idx})"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');

            document.getElementById('modalBody').innerHTML = `
                <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                <div class="modal-scroll-body">
                    <h3 style="font-family:'Cormorant Garamond', serif; color:var(--gold-primary); font-size:18px; text-align:center; margin-bottom:5px;">Secure Luxury Checkout</h3>
                    
                    <div style="margin-bottom: 10px;">
                        <div style="font-size:9px; color:var(--gold-light); text-transform:uppercase; margin-bottom:3px; font-weight:bold;">Selected Cart Items & Shipping:</div>
                        <div style="max-height: 80px; overflow-y: auto;">${cartItemsHTML}</div>
                    </div>

                    <div class="grand-total-box">
                        <div style="font-size:9px; color:#aaa; text-transform:uppercase;">Grand Total (Including Shipping)</div>
                        <div class="grand-total-price">৳ ${grandTotal.toLocaleString()}</div>
                    </div>

                    <!-- Glowing Luxury Payment Notice Board (English & bKash Only) -->
                    <div class="payment-info-box">
                        <b style="color: #fff; font-size: 11px;"><i class="fa-solid fa-circle-info" style="color:var(--gold-primary);"></i> PAYMENT INSTRUCTIONS:</b><br>
                        Please Send Money total <b>৳ ${grandTotal.toLocaleString()}</b> to bKash below:<br>
                        • <b>bKash Personal:</b> 01767319670<br>
                        • <b>bKash Merchant:</b> 01332008886<br>
                        After payment, fill up your paid mobile number & TrxID below.
                    </div>

                    <div class="form-group-grid">
                        <div><input type="text" id="custName" class="input-box" placeholder="Full Name *"></div>
                        <div><input type="text" id="custPhone" class="input-box" placeholder="Paid Mobile Number *"></div>
                        <div><input type="text" id="custWhatsapp" class="input-box" placeholder="WhatsApp Number *"></div>
                        <div><input type="text" id="custCity" class="input-box" placeholder="City / District *"></div>
                        <div class="form-full"><textarea id="custAddr" rows="2" class="input-box" placeholder="Complete Delivery Address (House, Road, Thana) *"></textarea></div>
                        <div class="form-full"><input type="text" id="custTrx" class="input-box" placeholder="Transaction ID (TrxID) *"></div>
                    </div>
                </div>
                <div class="modal-sticky-footer">
                    <button class="apply-btn" onclick="submitFinalOrder(${grandTotal})">CONFIRM & ORDER NOW</button>
                </div>
            `;
            document.getElementById('productModal').style.display = 'flex';
        }

        function removeCartItem(index) {
            let cart = JSON.parse(localStorage.getItem('mme_cart_details') || '[]');
            cart.splice(index, 1);
            localStorage.setItem('mme_cart_details', JSON.stringify(cart));
            updateCartBadgeCount();
            openCheckoutModal();
        }

        function submitFinalOrder(grandTotal) {
            let name = document.getElementById('custName').value;
            let phone = document.getElementById('custPhone').value;
            let whatsapp = document.getElementById('custWhatsapp').value;
            let city = document.getElementById('custCity').value;
            let addr = document.getElementById('custAddr').value;
            let trx = document.getElementById('custTrx').value;
            
            if(!name || !phone || !whatsapp || !city || !addr || !trx) { 
                alert("Please fill all required fields (Name, Paid Number, WhatsApp, City, Address & TrxID) correctly."); 
                return; 
            }
            
            localStorage.removeItem('mme_cart_details');
            updateCartBadgeCount();
            alert("Order placed successfully! Thank you for shopping with MR MASUDAR ENTERPRISE.");
            closeModal();
        }

            let p = prompt("Enter Master Admin Password:");
            if(p === '1422511460601767319670Mrmasudar@@@') {
                document.getElementById('modalBody').innerHTML = `
                    <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                    <div class="modal-scroll-body"><h3 style="color:var(--gold-primary); text-align:center;">Admin Panel Open</h3></div>
                `;
                document.getElementById('productModal').style.display = 'flex';
            } else if(p) { window.location.href = "/"; }
        }
        function closeModal() { document.getElementById('productModal').style.display = 'none'; }
    </script>
