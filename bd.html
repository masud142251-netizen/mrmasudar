<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR MASUDAR ENTERPRISE | Bangladesh Luxury Market</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --surface-card: #0a0a0a;
            --gold-primary: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            --border-luxury: rgba(212, 175, 55, 0.4);
            --text-white: #ffffff;
            --text-gray: #aaaaaa;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* Top Header & Search Bar */
        .market-header {
            text-align: center;
            padding: 15px;
            border: 1px solid var(--border-luxury);
            border-radius: 16px;
            background: var(--surface-card);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
            max-width: 1200px;
            margin: 0 auto 12px auto;
        }
        .market-header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 4px 0;
            letter-spacing: 1px;
        }

        .search-bar-container {
            display: flex;
            align-items: center;
            background: #000;
            border: 1px solid var(--gold-primary);
            border-radius: 30px;
            max-width: 500px;
            margin: 10px auto 0 auto;
            padding: 5px 12px;
        }
        .search-bar-container input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 11px;
            outline: none;
            padding: 5px;
        }
        .search-icon-btn {
            background: transparent;
            border: none;
            color: var(--gold-primary);
            font-size: 13px;
            cursor: pointer;
            padding: 0 6px;
        }

        /* Continuous Auto-Sliding Luxury Categories Menu */
        .category-menu-wrap {
            max-width: 1200px;
            margin: 0 auto 15px auto;
            overflow: hidden;
            position: relative;
            padding: 5px 0;
        }
        .category-menu {
            display: flex;
            gap: 10px;
            width: max-content;
            animation: autoScrollCat 25s linear infinite;
        }
        .category-menu:hover { animation-play-state: paused; }
        @keyframes autoScrollCat {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .cat-chip {
            background: var(--surface-card);
            border: 1px solid var(--border-luxury);
            color: var(--gold-light);
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .cat-chip:hover, .cat-chip.active {
            background: var(--gold-gradient);
            color: #000;
            border-color: #fff;
        }

        /* Draggable & Floating Luxury Basket */
        .floating-basket {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: var(--gold-gradient);
            color: #000;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.8);
            cursor: grab;
            z-index: 9999;
            user-select: none;
            touch-action: none;
            transition: transform 0.2s ease;
        }
        .basket-count {
            position: absolute;
            top: -3px;
            right: -3px;
            background: #fff;
            color: #000;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 50%;
            border: 2px solid #000;
        }

        /* Product Grid & Hover Animation */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .product-card {
            background: var(--surface-card);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: 0.3s ease;
        }
        .product-card:hover {
            border-color: var(--gold-primary);
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.2);
        }
        
        /* 📱 Clean YouTube iframe Box (No Logos) */
        .product-video-box {
            width: 100%;
            aspect-ratio: 9 / 16;
            background: #000;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px 12px 0 0;
        }
        .product-video-box iframe {
            width: 100%;
            height: 100%;
            border: none;
            transform: scale(1.3);
            pointer-events: none;
        }
        .video-click-blocker {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5;
            background: transparent;
        }

        .product-info { padding: 8px; text-align: center; }
        .product-title { font-size: 10px; font-weight: 700; color: #fff; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stars { color: var(--gold-primary); font-size: 8px; margin-bottom: 4px; }
        .card-actions { display: flex; border-top: 1px solid #222; }
        .card-btn { flex: 1; background: transparent; border: none; padding: 8px; color: var(--gold-primary); font-size: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .card-btn:hover { background: rgba(212, 175, 55, 0.15); }

        /* Modal Details */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 10px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .modal-content {
            background: var(--surface-card);
            border: 2px solid var(--gold-primary);
            border-radius: 18px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            position: relative;
            box-sizing: border-box;
        }
        .close-modal {
            position: absolute;
            top: 12px; right: 12px;
            background: transparent;
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            width: 28px; height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 11px;
            display: flex; align-items: center; justify-content: center;
        }

        .video-sound-toggle {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            font-size: 12px;
        }

        .apply-btn {
            background: var(--gold-gradient);
            border: none;
            padding: 10px 20px;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 20px;
            cursor: pointer;
            color: #000;
            width: 100%;
            max-width: 280px;
            display: block;
            margin: 15px auto 0 auto;
            font-size: 11px;
        }

        .grand-total-box {
            background: rgba(212, 175, 55, 0.12);
            border: 2px solid var(--gold-primary);
            border-radius: 14px;
            padding: 15px;
            text-align: center;
            margin: 15px 0;
        }
        .grand-total-price { font-size: 24px; font-weight: 900; color: var(--gold-primary); margin: 4px 0; }

        .details-stack { display: flex; flex-direction: column; gap: 12px; }
        .large-preview-wrap { background: #000; border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; aspect-ratio: 9/16; width: 100%; max-height: 350px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin: 0 auto; position: relative; }
        .large-preview-wrap iframe { width: 100%; height: 100%; border: none; transform: scale(1.3); }
        
        .qty-box { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 8px 0; }
        .qty-btn { background: #222; border: 1px solid var(--gold-primary); color: #fff; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-weight: bold; }

        .cart-item-row { display: flex; justify-content: space-between; align-items: center; background: #000; border: 1px solid #333; padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 11px; }
        .cart-remove-btn { color: #ff4d4d; cursor: pointer; font-size: 13px; background: none; border: none; }

        .form-group-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; }
        .form-full { grid-column: span 2; }
        .input-box { width: 100%; background: #000; border: 1px solid #333; padding: 10px; color: #fff; border-radius: 8px; margin-top: 3px; font-size: 11px; box-sizing: border-box; outline: none; }
        .input-box:focus { border-color: var(--gold-primary); }

        .admin-table { width: 100%; border-collapse: collapse; font-size: 10px; margin-top: 10px; }
        .admin-table th, .admin-table td { border: 1px solid #333; padding: 8px; text-align: left; }
        .admin-table th { background: rgba(212,175,55,0.2); color: var(--gold-primary); }

        @media(max-width: 768px) {
            .product-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .market-header h1 { font-size: 16px; }
            .form-group-grid { grid-template-columns: 1fr; }
            .form-full { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <!-- Floating Basket -->
    <div class="floating-basket" id="floatingBasket" title="Checkout">
        <i class="fa-solid fa-basket-shopping"></i>
        <span class="basket-count" id="cartBadge">0</span>
    </div>

    <!-- Header & Search Bar -->
    <div class="market-header">
        <h1>MR MASUDAR ENTERPRISE</h1>
        <p style="color: var(--text-gray); font-size: 7px; letter-spacing: 1px; text-transform: uppercase; margin: 0;">Elite Luxury Bangladesh Market</p>
        
        <div class="search-bar-container">
            <i class="fa-solid fa-magnifying-glass" style="color:var(--gold-primary); margin-left: 4px;"></i>
            <input type="text" id="searchInput" placeholder="Search luxury products..." onkeyup="filterProducts()">
            <button class="search-icon-btn" onclick="startVoiceSearch()"><i class="fa-solid fa-microphone"></i></button>
            <button class="search-icon-btn" onclick="triggerImageSearch()"><i class="fa-solid fa-camera"></i></button>
            <input type="file" id="imageUploadInput" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
        </div>
    </div>

    <!-- Category Menu -->
    <div class="category-menu-wrap">
        <div class="category-menu" id="catMenu">
            <div class="cat-chip" onclick="filterCategory('Women\'s Fashion', this)">👗 Women's Fashion</div>
            <div class="cat-chip" onclick="filterCategory('Men\'s Fashion', this)">👔 Men's Fashion</div>
            <div class="cat-chip" onclick="filterCategory('Baby', this)">🍼 Baby</div>
            <div class="cat-chip" onclick="filterCategory('Gift', this)">🎁 Gift</div>
            <div class="cat-chip" onclick="filterCategory('Decor', this)">🏺 Decor</div>
        </div>
    </div>

    <!-- Product Grid -->
    <div class="product-grid" id="marketProductGrid"></div>

    <!-- Modal -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content" id="modalBody"></div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const currentPath = window.location.pathname;
            if(currentPath.includes('/mr-master-admin')) {
                openHiddenAdminPanel();
            }
        });

        // 🟢 Cache Key v5: আপনার নতুন ইউটিউব শর্টস লিংক (ZVTRyR7Ubas) দিয়ে আপডেট করা হয়েছে
        function getCachedProducts() {
            let cached = localStorage.getItem('mme_local_cache_products_v5');
            if(cached) {
                return JSON.parse(cached);
            }
            
            // আপনার নতুন ইউটিউব শর্টস আইডি: ZVTRyR7Ubas
            let ytEmbedBase = "https://www.youtube.com/embed/ZVTRyR7Ubas?autoplay=1&mute=1&loop=1&playlist=ZVTRyR7Ubas&controls=0&modestbranding=1&playsinline=1&rel=0";
            
            let defaultProducts = [
                { 
                    name: "Designer Silk Saree", title: "Royal Katan Silk Saree", category: "Women's Fashion", price: 15000, bd: "৳ 15,000", shipping: 80, desc: "Exquisite hand-woven golden zari work for luxury occasions.", 
                    videoUrl: ytEmbedBase
                },
                { 
                    name: "Executive Silk Suit", title: "Premium Men's Formal Wear", category: "Men's Fashion", price: 8500, bd: "৳ 8,500", shipping: 70, desc: "Tailored Italian cut luxury fabric designed for top executives.", 
                    videoUrl: ytEmbedBase
                },
                { 
                    name: "Golden Baby Stroller", title: "Ultra Safe Luxury Pram", category: "Baby", price: 22000, bd: "৳ 22,000", shipping: 120, desc: "Gold-plated alloy frame with shock-absorbent wheels.", 
                    videoUrl: ytEmbedBase
                },
                { 
                    name: "Luxury Gift Hamper", title: "Gold-Accent Gift Box", category: "Gift", price: 4500, bd: "৳ 4,500", shipping: 50, desc: "Exotic curated luxury gift items for special events.", 
                    videoUrl: ytEmbedBase
                },
                { 
                    name: "Royal Gamar Bed", title: "Handcrafted Luxury Teak Bed", category: "Decor", price: 45000, bd: "৳ 45,000", shipping: 150, desc: "Pure high-gloss lacquer finish with solid Gamar wood structure.", 
                    videoUrl: ytEmbedBase
                }
            ];

            localStorage.setItem('mme_local_cache_products_v5', JSON.stringify(defaultProducts));
            return defaultProducts;
        }

        let idleTimer;
        function resetIdleTimer() {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                localStorage.removeItem('mme_cart_details');
                location.reload();
            }, 300000);
        }
        window.onload = () => {
            loadMarketProducts("Women's Fashion");
            resetIdleTimer();
            updateCartBadgeCount();
        };
        document.onmousemove = resetIdleTimer;
        document.onkeypress = resetIdleTimer;

        function updateCartBadgeCount() {
            let cart = JSON.parse(localStorage.getItem('mme_cart_details') || '[]');
            let totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cartBadge').innerText = totalQty;
        }

        const basket = document.getElementById('floatingBasket');
        let isDragging = false, startX, startY, initialX, initialY;

        basket.addEventListener('mousedown', dragStart);
        basket.addEventListener('touchstart', dragStart, {passive: true});
        document.addEventListener('mousemove', drag);
        document.addEventListener('touchmove', drag, {passive: true});
        document.addEventListener('mouseup', dragEnd);
        document.addEventListener('touchend', dragEnd);

        function dragStart(e) {
            isDragging = true;
            startX = e.clientX || e.touches[0].clientX;
            startY = e.clientY || e.touches[0].clientY;
            let r = basket.getBoundingClientRect();
            initialX = r.left;
            initialY = r.top;
            basket.style.right = 'auto';
            basket.style.bottom = 'auto';
            basket.style.top = initialY + 'px';
            basket.style.left = initialX + 'px';
        }

        function drag(e) {
            if(!isDragging) return;
            let currentX = e.clientX || e.touches[0].clientX;
            let currentY = e.clientY || e.touches[0].clientY;
            basket.style.left = (initialX + (currentX - startX)) + 'px';
            basket.style.top = (initialY + (currentY - startY)) + 'px';
        }
        function dragEnd() { isDragging = false; }
        basket.onclick = function() { if(!isDragging) { openCheckoutModal(); } };

        function loadMarketProducts(filterCat = "Women's Fashion") {
            let grid = document.getElementById('marketProductGrid');
            let products = getCachedProducts().filter(p => p.category && p.category.toLowerCase() === filterCat.toLowerCase());
            grid.innerHTML = products.map((p) => `
                <div class="product-card" onclick="openProductDetails('${p.title}')">
                    <div class="product-video-box">
                        <div class="video-click-blocker"></div>
                        <iframe src="${p.videoUrl}" frameborder="0" allow="autoplay; encrypted-media" playsinline></iframe>
                    </div>
                    <div class="product-info">
                        <div class="product-title">${p.title}</div>
                        <div class="stars"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></div>
                        <div style="font-size:10px; color:var(--gold-primary); font-weight:bold;">${p.bd}</div>
                    </div>
                    <div class="card-actions">
                        <button class="card-btn">View Details</button>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(cat, el) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            loadMarketProducts(cat);
        }

        function filterProducts() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let products = getCachedProducts();
            let grid = document.getElementById('marketProductGrid');
            grid.innerHTML = products.filter(p => p.title.toLowerCase().includes(query) || p.category.toLowerCase().includes(query)).map((p) => `
                <div class="product-card" onclick="openProductDetails('${p.title}')">
                    <div class="product-video-box">
                        <div class="video-click-blocker"></div>
                        <iframe src="${p.videoUrl}" frameborder="0" allow="autoplay; encrypted-media" playsinline></iframe>
                    </div>
                    <div class="product-info">
                        <div class="product-title">${p.title}</div>
                        <div class="stars"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></div>
                        <div style="font-size:10px; color:var(--gold-primary); font-weight:bold;">${p.bd}</div>
                    </div>
                    <div class="card-actions"><button class="card-btn">View Details</button></div>
                </div>
            `).join('');
        }

        function startVoiceSearch() {
            try {
                let rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
                rec.lang = 'en-US';
                rec.onresult = (e) => { document.getElementById('searchInput').value = e.results[0][0].transcript; filterProducts(); };
                rec.start();
            } catch(e) {
                let txt = prompt("Type product name:");
                if(txt) { document.getElementById('searchInput').value = txt; filterProducts(); }
            }
        }
        function triggerImageSearch() { document.getElementById('imageUploadInput').click(); }
        function handleImageUpload(e) { alert("AI Visual Match Found!"); document.getElementById('searchInput').value = "Royal"; filterProducts(); }

        let currentQty = 1;
        let activePrice = 0;
        let activeShipping = 0;
        let activeTitle = "";
        let isVideoMuted = true;

        function openProductDetails(title) {
            let p = getCachedProducts().find(item => item.title === title) || getCachedProducts()[0];
            activePrice = p.price;
            activeShipping = p.shipping;
            activeTitle = p.title;
            currentQty = 1;
            isVideoMuted = true;

            renderModalContent(p);
            document.getElementById('productModal').style.display = 'flex';
        }

        function renderModalContent(p) {
            let detailVideoSrc = isVideoMuted ? p.videoUrl : p.videoUrl.replace('mute=1', 'mute=0');

            document.getElementById('modalBody').innerHTML = `
                <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                <div class="details-stack">
                    <div>
                        <div class="large-preview-wrap">
                            <iframe src="${detailVideoSrc}" frameborder="0" allow="autoplay; encrypted-media"></iframe>
                            <div class="video-sound-toggle" onclick="toggleDetailVideoSound('${p.title}')" title="Toggle Sound">
                                <i class="fa-solid ${isVideoMuted ? 'fa-volume-xmark' : 'fa-volume-high'}"></i>
                            </div>
                        </div>
                    </div>
                    <div>
                        <span style="font-size:8px; color:var(--gold-primary); font-weight:bold; letter-spacing:1px;">${p.category}</span>
                        <h2 style="font-family:'Cormorant Garamond', serif; color:#fff; font-size:22px; margin:2px 0;">${p.title}</h2>
                        <div class="stars"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></div>
                        <p style="color:#aaa; font-size:10px; line-height:1.5; margin:8px 0;">${p.desc}</p>
                        
                        <div style="font-size:14px; color:var(--gold-primary); font-weight:bold;">Unit Price: ৳ <span id="unitPrice">${activePrice.toLocaleString()}</span></div>
                        <div style="font-size:10px; color:#aaa;">Seller Shipping: ৳ <span id="shippingFee">${activeShipping}</span></div>

                        <div class="qty-box">
                            <span style="font-size:10px; color:var(--gold-light);">Quantity:</span>
                            <button class="qty-btn" onclick="updateQty(-1)">-</button>
                            <span id="prodQty" style="font-weight:bold; font-size:12px; min-width:15px; text-align:center;">1</span>
                            <button class="qty-btn" onclick="updateQty(1)">+</button>
                        </div>

                        <div style="font-size:13px; color:#fff; font-weight:bold; text-align:center; margin-bottom:10px;">Subtotal: ৳ <span id="totalItemPrice">${(activePrice + activeShipping).toLocaleString()}</span></div>

                        <button class="apply-btn" id="addToCartBtn">ADD TO CART</button>
                    </div>
                </div>
            `;
            document.getElementById('addToCartBtn').onclick = function(e) { addCartAndAnimate(e, activeTitle, activePrice, activeShipping); };
        }

        function toggleDetailVideoSound(title) {
            isVideoMuted = !isVideoMuted;
            let p = getCachedProducts().find(item => item.title === title);
            renderModalContent(p);
        }

        function updateQty(change) {
            currentQty += change;
            if(currentQty < 1) currentQty = 1;
            document.getElementById('prodQty').innerText = currentQty;
            let subtotal = (activePrice * currentQty) + activeShipping;
            document.getElementById('totalItemPrice').innerText = subtotal.toLocaleString();
        }

        function addCartAndAnimate(event, name, price, shipping) {
            let cart = JSON.parse(localStorage.getItem('mme_cart_details') || '[]');
            cart.push({ name: name, qty: currentQty, price: price, shipping: shipping });
            localStorage.setItem('mme_cart_details', JSON.stringify(cart));
            updateCartBadgeCount();
            closeModal();
            alert("Added to Cart Successfully!");
        }

        function openCheckoutModal() {
            let cart = JSON.parse(localStorage.getItem('mme_cart_details') || '[]');
            if(cart.length === 0) { alert("Your cart is empty."); return; }

            let prodCost = 0, shipCost = 0;
            cart.forEach(i => { prodCost += (i.price * i.qty); shipCost += i.shipping; });
            let grandTotal = prodCost + shipCost;

            let cartItemsHTML = cart.map((item, idx) => `
                <div class="cart-item-row">
                    <span><b>${item.name}</b> (x${item.qty}) - ৳ ${(item.price * item.qty).toLocaleString()}</span>
                    <button class="cart-remove-btn" onclick="removeCartItem(${idx})"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');

            document.getElementById('modalBody').innerHTML = `
                <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                <h3 style="font-family:'Cormorant Garamond', serif; color:var(--gold-primary); font-size:20px; text-align:center; margin-bottom:5px;">Secure Luxury Checkout</h3>
                
                <div style="margin-bottom: 15px;">
                    <div style="font-size:9px; color:var(--gold-light); text-transform:uppercase; margin-bottom:5px; font-weight:bold;">Selected Cart Items:</div>
                    <div style="max-height: 120px; overflow-y: auto;">${cartItemsHTML}</div>
                </div>

                <div class="grand-total-box">
                    <div style="font-size:10px; color:#aaa; text-transform:uppercase;">Grand Total</div>
                    <div class="grand-total-price">৳ ${grandTotal.toLocaleString()}</div>
                </div>

                <div class="form-group-grid">
                    <div><input type="text" id="custName" class="input-box" placeholder="Full name *"></div>
                    <div><input type="text" id="custPhone" class="input-box" placeholder="WhatsApp Number *"></div>
                    <div class="form-full"><textarea id="custAddr" rows="2" class="input-box" placeholder="Complete Delivery Address *"></textarea></div>
                    <div class="form-full">
                        <select id="paymentMethod" class="input-box">
                            <option value="bKash">bKash (Send Money)</option>
                            <option value="Nagad">Nagad (Send Money)</option>
                        </select>
                    </div>
                    <div class="form-full"><input type="text" id="custTrx" class="input-box" placeholder="Transaction ID (TrxID) *"></div>
                </div>
                <button class="apply-btn" onclick="submitFinalOrder(${grandTotal})">CONFIRM & ORDER NOW</button>
            `;
            document.getElementById('productModal').style.display = 'flex';
        }

        function removeCartItem(index) {
            let cart = JSON.parse(localStorage.getItem('mme_cart_details') || '[]');
            cart.splice(index, 1);
            localStorage.setItem('mme_cart_details', JSON.stringify(cart));
            updateCartBadgeCount();
            openCheckoutModal();
        }

        function submitFinalOrder(grandTotal) {
            let name = document.getElementById('custName').value;
            let trx = document.getElementById('custTrx').value;
            if(!name || !trx) { alert("Please fill required fields and TrxID."); return; }
            localStorage.removeItem('mme_cart_details');
            updateCartBadgeCount();
            alert("Order placed successfully!");
            closeModal();
        }

        function openHiddenAdminPanel() {
            let p = prompt("Enter Master Admin Password:");
            if(p === '1422511460601767319670Mrmasudar@@@') {
                document.getElementById('modalBody').innerHTML = `
                    <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                    <h3 style="color:var(--gold-primary); text-align:center;">Admin Panel Open</h3>
                `;
                document.getElementById('productModal').style.display = 'flex';
            } else if(p) { window.location.href = "/"; }
        }
        function closeModal() { document.getElementById('productModal').style.display = 'none'; }
    </script>
</body>
</html>
