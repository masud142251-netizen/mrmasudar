<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR MASUDAR ENTERPRISE | Bangladesh Luxury Market</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --surface-card: #0a0a0a;
            --gold-primary: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            --border-luxury: rgba(212, 175, 55, 0.4);
            --text-white: #ffffff;
            --text-gray: #aaaaaa;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Top Header */
        .market-header {
            text-align: center;
            padding: 25px 20px;
            border: 1px solid var(--border-luxury);
            border-radius: 20px;
            background: var(--surface-card);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.15);
            max-width: 1200px;
            margin: 0 auto 30px auto;
        }
        .market-header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 8px 0 4px 0;
            letter-spacing: 2px;
        }

        /* Draggable / Floating Luxury Cart Basket */
        .floating-basket {
            position: fixed;
            top: 25px;
            right: 25px;
            background: var(--gold-gradient);
            color: #000;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.7);
            cursor: grab;
            z-index: 9999;
            transition: transform 0.1s ease;
            user-select: none;
        }
        .floating-basket:active { cursor: grabbing; }
        .basket-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #fff;
            color: #000;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 7px;
            border-radius: 50%;
            border: 2px solid #000;
        }

        /* Product Grid (4 items desktop, 2 items mobile) */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Luxury Product Card */
        .product-card {
            background: var(--surface-card);
            border: 1px solid var(--border-luxury);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            transition: 0.3s;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card:hover {
            border-color: var(--gold-primary);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
            transform: translateY(-4px);
        }
        .product-img-box {
            width: 100%;
            height: 170px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
        }
        .product-img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: 0.4s;
        }
        .product-card:hover .product-img-box img { transform: scale(1.06); }

        .product-info { padding: 12px; text-align: center; }
        .product-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-white);
            margin: 0 0 6px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }
        .stars { color: var(--gold-primary); font-size: 9px; margin-bottom: 6px; }
        .card-actions { display: flex; border-top: 1px solid #222; }
        .card-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px;
            color: var(--gold-primary);
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }
        .card-btn:hover { background: rgba(212, 175, 55, 0.15); }

        /* Full Screen Luxury Details Modal (Matches user reference image) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 15px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .modal-content {
            background: var(--surface-card);
            border: 2px solid var(--gold-primary);
            border-radius: 24px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.4);
            animation: zoomIn 0.3s ease-out;
            box-sizing: border-box;
        }
        @keyframes zoomIn { from { transform: scale(0.93); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .close-modal {
            position: absolute;
            top: 15px; right: 15px;
            background: transparent;
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            width: 32px; height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 13px;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s;
            z-index: 10;
        }
        .close-modal:hover { background: var(--gold-primary); color: #000; }

        .apply-btn {
            background: var(--gold-gradient);
            border: none;
            padding: 13px;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 30px;
            cursor: pointer;
            color: #000;
            width: 100%;
            letter-spacing: 1px;
            transition: 0.2s;
        }
        .apply-btn:hover { filter: brightness(1.15); transform: scale(1.01); }

        /* Gallery Thumbnails inside Modal */
        .thumb-gallery { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 5px; }
        .thumb-img { width: 55px; height: 55px; border-radius: 8px; border: 1px solid #333; object-fit: cover; cursor: pointer; transition: 0.2s; }
        .thumb-img:hover { border-color: var(--gold-primary); transform: scale(1.05); }

        /* Flying Animation Object */
        .flying-item {
            position: fixed;
            width: 35px;
            height: 35px;
            background: var(--gold-primary);
            border-radius: 50%;
            z-index: 99999;
            pointer-events: none;
            transition: all 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* Responsive Mobile Layout: 2 items per line */
        @media(max-width: 768px) {
            .product-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .market-header h1 { font-size: 20px; }
            .product-img-box { height: 120px; }
            .modal-content { padding: 20px; }
            .modal-grid { grid-template-columns: 1fr !important; }
        }
    </style>
</head>
<body>

    <!-- Draggable Floating Luxury Basket -->
    <div class="floating-basket" id="floatingBasket" title="Drag me or Click to view cart">
        <i class="fa-solid fa-basket-shopping"></i>
        <span class="basket-count" id="cartBadge">0</span>
    </div>

    <!-- Header -->
    <div class="market-header">
        <i class="fa-solid fa-house-chimney" style="color:var(--gold-primary); font-size: 26px;"></i>
        <h1>BANGLADESH LUXURY MARKET</h1>
        <p style="color: var(--text-gray); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; margin: 0;">Local Retail & Elite Global Showcase</p>
    </div>

    <!-- Product Grid Section -->
    <div class="product-grid" id="marketProductGrid"></div>

    <!-- Fullscreen Product Details Modal -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content" id="modalBody"></div>
    </div>

    <script>
        // Make Floating Basket Draggable on Mobile & Desktop
        const basket = document.getElementById('floatingBasket');
        let isDragging = false, startX, startY, initialX, initialY;

        basket.addEventListener('mousedown', dragStart);
        basket.addEventListener('touchstart', dragStart, {passive: true});
        document.addEventListener('mousemove', drag);
        document.addEventListener('touchmove', drag, {passive: true});
        document.addEventListener('mouseup', dragEnd);
        document.addEventListener('touchend', dragEnd);

        function dragStart(e) {
            isDragging = true;
            startX = e.clientX || e.touches[0].clientX;
            startY = e.clientY || e.touches[0].clientY;
            let rect = basket.getBoundingClientRect();
            initialX = rect.left;
            initialY = rect.top;
            basket.style.right = 'auto';
            basket.style.top = initialY + 'px';
            basket.style.left = initialX + 'px';
        }

        function drag(e) {
            if (!isDragging) return;
            let currentX = e.clientX || e.touches[0].clientX;
            let currentY = e.clientY || e.touches[0].clientY;
            let dx = currentX - startX;
            let dy = currentY - startY;
            basket.style.left = (initialX + dx) + 'px';
            basket.style.top = (initialY + dy) + 'px';
        }

        function dragEnd() {
            if(!isDragging) return;
            isDragging = false;
        }

        basket.onclick = function() {
            if(!isDragging) {
                openCartCheckoutDrawer();
            }
        };

        // Load Products
        function loadMarketProducts() {
            let grid = document.getElementById('marketProductGrid');
            let products = JSON.parse(localStorage.getItem('mme_products') || '[]');

            if(products.length === 0) {
                products = [
                    { name: "Royal Gamar Bed", title: "Handcrafted Luxury Teak Bed", category: "HOME DECOR", stock: "15", bd: "৳ 45,000", global: "$ 450", desc: "Pure high-gloss lacquer finish with solid Gamar wood structure." },
                    { name: "Executive Silk Suit", title: "Premium Men's Formal Wear", category: "FASHION (MEN)", stock: "30", bd: "৳ 8,500", global: "$ 85", desc: "Tailored Italian cut luxury fabric designed for top executives." },
                    { name: "Golden Baby Stroller", title: "Ultra Safe Luxury Pram", category: "BABY", stock: "10", bd: "৳ 22,000", global: "$ 220", desc: "Gold-plated alloy frame with shock-absorbent wheels." },
                    { name: "Artisan Ceramic Vase", title: "Handmade Gold Leaf Decor", category: "ART & CRAFT", stock: "25", bd: "৳ 3,500", global: "$ 35", desc: "Exclusive golden accented masterpiece for modern living rooms." }
                ];
            }

            grid.innerHTML = '';
            products.forEach((p, index) => {
                let card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-img-box" onclick="openProductDetails(${index})">
                        <img src="https://cdn-icons-png.flaticon.com/512/3176/3176363.png" alt="Product">
                    </div>
                    <div class="product-info">
                        <div class="product-title" onclick="openProductDetails(${index})">${p.title || p.name}</div>
                        <div class="stars"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></div>
                        <div style="font-size:12px; color:var(--gold-primary); font-weight:bold;">${p.bd || p.global || '৳ 2,500'}</div>
                    </div>
                    <div class="card-actions">
                        <button class="card-btn" onclick="openProductDetails(${index})">View Details</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Open Big Details Modal with 5-7 images & video preview
        function openProductDetails(index) {
            let products = JSON.parse(localStorage.getItem('mme_products') || '[]');
            if(products.length === 0) {
                products = [{ name: "Royal Gamar Bed", title: "Handcrafted Luxury Teak Bed", category: "HOME DECOR", bd: "৳ 45,000", desc: "Pure high-gloss lacquer finish." }];
            }
            let p = products[index] || products[0];

            let modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                <div class="modal-grid" style="display:grid; grid-template-columns: 1fr 1.2fr; gap:25px; align-items:start;">
                    <div>
                        <div style="background:#000; border:1px solid #333; border-radius:15px; height:240px; display:flex; align-items:center; justify-content:center; overflow:hidden;">
                            <img id="mainPreviewImg" src="https://cdn-icons-png.flaticon.com/512/3176/3176363.png" style="max-height:190px; object-fit:contain;">
                        </div>
                        <!-- 5-7 Image Gallery Thumbnails -->
                        <div class="thumb-gallery">
                            <img src="https://cdn-icons-png.flaticon.com/512/3176/3176363.png" class="thumb-img" onclick="document.getElementById('mainPreviewImg').src=this.src">
                            <img src="https://cdn-icons-png.flaticon.com/512/2933/2933888.png" class="thumb-img" onclick="document.getElementById('mainPreviewImg').src=this.src">
                            <img src="https://cdn-icons-png.flaticon.com/512/1041/1041883.png" class="thumb-img" onclick="document.getElementById('mainPreviewImg').src=this.src">
                            <img src="https://cdn-icons-png.flaticon.com/512/2618/2618488.png" class="thumb-img" onclick="document.getElementById('mainPreviewImg').src=this.src">
                            <img src="https://cdn-icons-png.flaticon.com/512/3050/3050259.png" class="thumb-img" onclick="document.getElementById('mainPreviewImg').src=this.src">
                        </div>
                        <!-- Video Preview Box -->
                        <div style="margin-top:12px; background:#000; border:1px solid #222; border-radius:10px; padding:8px; text-align:center;">
                            <span style="font-size:9px; color:var(--gold-light); text-transform:uppercase;">Product Video Showcase</span>
                            <div style="font-size:11px; color:#aaa; margin-top:4px;"><i class="fa-solid fa-circle-play" style="color:var(--gold-primary); font-size:16px;"></i> High Definition Review Video Loaded</div>
                        </div>
                    </div>
                    <div>
                        <span style="font-size:10px; color:var(--gold-primary); font-weight:bold; letter-spacing:2px;">${p.category || 'LUXURY ITEM'}</span>
                        <h2 style="font-family:'Cormorant Garamond', serif; color:#fff; font-size:26px; margin:4px 0 8px 0;">${p.title || p.name}</h2>
                        <div class="stars"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i> (Global Certified)</div>
                        <p style="color:#aaa; font-size:11px; line-height:1.6; margin:12px 0;">${p.desc || 'Masterpiece craftsmanship engineered for premier lifestyle requirements.'}</p>
                        <div style="font-size:18px; color:var(--gold-primary); font-weight:800; margin-bottom:15px;">Price: ${p.bd || p.global || '৳ 2,500'}</div>
                        <button class="apply-btn" onclick="addToCartAndAnimate(event, '${p.title || p.name}')">Add to Cart & Fly to Basket</button>
                    </div>
                </div>
            `;
            document.getElementById('productModal').style.display = 'flex';
        }

        // Add to Cart with Flying Animation & Direct Basket Connection
        function addToCartAndAnimate(event, prodName) {
            let badge = document.getElementById('cartBadge');
            let currentCount = parseInt(badge.innerText) + 1;
            badge.innerText = currentCount;

            // Save to Cart storage
            let cart = JSON.parse(localStorage.getItem('mme_cart') || '[]');
            cart.push(prodName);
            localStorage.setItem('mme_cart', JSON.stringify(cart));

            let btnRect = event.target.getBoundingClientRect();
            let basketRect = basket.getBoundingClientRect();

            let flyer = document.createElement('div');
            flyer.className = 'flying-item';
            flyer.style.left = btnRect.left + 'px';
            flyer.style.top = btnRect.top + 'px';
            document.body.appendChild(flyer);

            setTimeout(() => {
                flyer.style.left = (basketRect.left + 15) + 'px';
                flyer.style.top = (basketRect.top + 15) + 'px';
                flyer.style.transform = 'scale(0.2)';
                flyer.style.opacity = '0';
            }, 40);

            setTimeout(() => { flyer.remove(); closeModal(); }, 750);
        }

        // Open Cart & Checkout Form when clicking basket
        function openCartCheckoutDrawer() {
            let cart = JSON.parse(localStorage.getItem('mme_cart') || '[]');
            let modalBody = document.getElementById('modalBody');
            
            modalBody.innerHTML = `
                <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                <h3 style="font-family:'Cormorant Garamond', serif; color:var(--gold-primary); font-size:22px; text-align:center; margin-bottom:15px;">Luxury Shopping Basket & Checkout</h3>
                <p style="font-size:11px; color:#aaa; text-align:center; margin-bottom:15px;">Total Items in Basket: <b style="color:#fff;">${cart.length}</b></p>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; text-align:left;">
                    <div><label style="font-size:9px; color:var(--gold-light);">Full Name *</label><input type="text" id="custName" style="width:100%; background:#000; border:1px solid #333; padding:10px; color:#fff; border-radius:8px; margin-top:4px;" required></div>
                    <div><label style="font-size:9px; color:var(--gold-light);">Phone Number *</label><input type="text" id="custPhone" style="width:100%; background:#000; border:1px solid #333; padding:10px; color:#fff; border-radius:8px; margin-top:4px;" required></div>
                    <div style="grid-column: span 2;"><label style="font-size:9px; color:var(--gold-light);">Complete Delivery Address *</label><textarea id="custAddr" rows="2" style="width:100%; background:#000; border:1px solid #333; padding:10px; color:#fff; border-radius:8px; margin-top:4px;" required></textarea></div>
                </div>
                <div style="text-align:center; margin-top:20px;">
                    <button class="apply-btn" onclick="submitFinalOrder()">Submit Order & Dispatch</button>
                </div>
            `;
            document.getElementById('productModal').style.display = 'flex';
        }

        function submitFinalOrder() {
            let name = document.getElementById('custName').value;
            let phone = document.getElementById('custPhone').value;
            if(!name || !phone) {
                return;
            }
            localStorage.removeItem('mme_cart');
            document.getElementById('cartBadge').innerText = '0';
            closeModal();
        }

        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        window.onload = loadMarketProducts;
    </script>
</body>
</html>
