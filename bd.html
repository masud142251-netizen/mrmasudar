<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR MASUDAR ENTERPRISE | Bangladesh Luxury Market</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --surface-card: #0a0a0a;
            --gold-primary: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            --border-luxury: rgba(212, 175, 55, 0.4);
            --text-white: #ffffff;
            --text-gray: #aaaaaa;
        }

        body { background-color: var(--bg-color); color: var(--text-white); font-family: 'Montserrat', sans-serif; margin: 0; padding: 20px; overflow-x: hidden; }

        /* Secret Admin Lock */
        .lock-btn-fixed { position: fixed; bottom: 12px; left: 12px; color: var(--gold-primary); font-size: 11px; cursor: pointer; z-index: 99999; opacity: 0.2; transition: 0.3s; background: #0a0a0a; padding: 10px; border-radius: 50%; border: 1px solid var(--gold-primary); }
        .lock-btn-fixed:hover { opacity: 1; transform: scale(1.2); }

        /* Header */
        .market-header { text-align: center; padding: 25px 20px; border: 1px solid var(--border-luxury); border-radius: 20px; background: var(--surface-card); box-shadow: 0 0 30px rgba(212, 175, 55, 0.15); max-width: 1200px; margin: 0 auto 30px auto; }
        .market-header h1 { font-family: 'Cormorant Garamond', serif; font-size: 26px; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 8px 0 4px 0; letter-spacing: 2px; }

        /* Draggable Floating Luxury Basket */
        .floating-basket { position: fixed; top: 25px; right: 25px; background: var(--gold-gradient); color: #000; width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 0 30px rgba(212, 175, 55, 0.9); cursor: grab; z-index: 9999; user-select: none; transition: transform 0.2s ease; }
        .basket-count { position: absolute; top: -5px; right: -5px; background: #fff; color: #000; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 50%; border: 2px solid #000; }

        /* Product Grid */
        .product-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .product-card { background: var(--surface-card); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 16px; overflow: hidden; transition: 0.3s; box-shadow: 0 5px 20px rgba(0,0,0,0.9); display: flex; flex-direction: column; }
        .product-card:hover { border-color: var(--gold-primary); box-shadow: 0 0 25px rgba(212, 175, 55, 0.5); transform: translateY(-4px); }
        .product-img-box { width: 100%; height: 170px; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .product-img-box img { width: 100%; height: 100%; object-fit: contain; transition: 0.4s; }
        .product-card:hover .product-img-box img { transform: scale(1.06); }
        .product-info { padding: 12px; text-align: center; }
        .card-btn { flex: 1; background: transparent; border: none; padding: 10px; color: var(--gold-primary); font-size: 11px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .card-btn:hover { background: rgba(212, 175, 55, 0.15); }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(12px); display: none; align-items: center; justify-content: center; z-index: 10000; padding: 15px; overflow-y: auto; }
        .modal-content { background: var(--surface-card); border: 2px solid var(--gold-primary); border-radius: 24px; max-width: 950px; width: 100%; padding: 35px; position: relative; box-shadow: 0 0 60px rgba(212, 175, 55, 0.5); }
        .close-modal { position: absolute; top: 20px; right: 20px; background: transparent; border: 1px solid var(--gold-primary); color: var(--gold-primary); width: 35px; height: 35px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .apply-btn { background: var(--gold-gradient); border: none; padding: 14px; font-weight: 800; text-transform: uppercase; border-radius: 30px; cursor: pointer; color: #000; width: 100%; letter-spacing: 1.5px; }

        .thumb-img { width: 60px; height: 60px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); cursor: pointer; }
        .flying-coin { position: fixed; width: 40px; height: 40px; background: var(--gold-gradient); border: 2px solid #fff; border-radius: 50%; z-index: 99999; pointer-events: none; transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
        
        @media(max-width: 768px) { .product-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

    <div class="lock-btn-fixed" onclick="openAdminModal()"><i class="fa-solid fa-lock"></i></div>
    <div class="floating-basket" id="floatingBasket"><i class="fa-solid fa-basket-shopping"></i><span class="basket-count" id="cartBadge">0</span></div>

    <div class="market-header">
        <h1>BANGLADESH LUXURY MARKET</h1>
        <p style="font-size: 9px; letter-spacing: 2px; text-transform: uppercase;">Local Retail & Elite Global Showcase</p>
    </div>

    <div class="product-grid" id="marketProductGrid"></div>
    <div class="modal-overlay" id="productModal"><div class="modal-content" id="modalBody"></div></div>

    <script>
        // Draggable Logic
        const basket = document.getElementById('floatingBasket');
        let isDragging = false, startX, startY, initialX, initialY;
        basket.onmousedown = (e) => { isDragging = true; startX = e.clientX; startY = e.clientY; initialX = basket.offsetLeft; initialY = basket.offsetTop; };
        document.onmousemove = (e) => { if(isDragging) { basket.style.left = (initialX + e.clientX - startX) + 'px'; basket.style.top = (initialY + e.clientY - startY) + 'px'; } };
        document.onmouseup = () => isDragging = false;
        basket.onclick = () => { if(!isDragging) openCheckoutModal(); };

        function loadMarketProducts() {
            let grid = document.getElementById('marketProductGrid');
            let products = JSON.parse(localStorage.getItem('mme_products') || '[]');
            if(products.length === 0) products = [{name:"Royal Gamar Bed", title:"Handcrafted Luxury Teak Bed", bd:"৳ 45,000", desc:"Pure high-gloss lacquer finish."}];
            
            grid.innerHTML = products.map((p, i) => `
                <div class="product-card">
                    <div class="product-img-box" onclick="openProductDetails(${i})"><img src="https://cdn-icons-png.flaticon.com/512/3176/3176363.png"></div>
                    <div class="product-info"><div class="product-title">${p.title}</div><div style="color:var(--gold-primary); font-weight:bold;">${p.bd}</div></div>
                    <div class="card-actions"><button class="card-btn" onclick="openProductDetails(${i})">Explore</button></div>
                </div>
            `).join('');
        }

        function openProductDetails(i) {
            let p = JSON.parse(localStorage.getItem('mme_products')||'[]')[i] || {title:"Handcrafted Bed", bd:"৳ 45,000", desc:"Luxury."};
            document.getElementById('modalBody').innerHTML = `
                <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                    <div><img id="mainImg" src="https://cdn-icons-png.flaticon.com/512/3176/3176363.png" style="width:100%; border-radius:15px;"></div>
                    <div>
                        <h2>${p.title}</h2><p>${p.desc}</p><h3>${p.bd}</h3>
                        <button class="apply-btn" onclick="addCoinAndClose(event, '${p.title}')">ADD TO CART</button>
                    </div>
                </div>
            `;
            document.getElementById('productModal').style.display = 'flex';
        }

        function addCoinAndClose(e, name) {
            document.getElementById('cartBadge').innerText = parseInt(document.getElementById('cartBadge').innerText) + 1;
            let cart = JSON.parse(localStorage.getItem('mme_cart') || '[]');
            cart.push(name);
            localStorage.setItem('mme_cart', JSON.stringify(cart));
            
            // Animation & Sound
            let coin = document.createElement('div'); coin.className = 'flying-coin';
            coin.style.left = e.clientX + 'px'; coin.style.top = e.clientY + 'px';
            document.body.appendChild(coin);
            setTimeout(() => { coin.style.left = '50px'; coin.style.top = '50px'; coin.style.opacity = '0'; }, 50);
            
            try { 
                let ctx = new AudioContext(); let osc = ctx.createOscillator(); osc.frequency.value = 880; 
                osc.connect(ctx.destination); osc.start(); osc.stop(0.1); 
            } catch(e) {}
            
            setTimeout(() => { coin.remove(); closeModal(); }, 800);
        }

        function openCheckoutModal() {
            document.getElementById('modalBody').innerHTML = `
                <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                <h2 style="color:var(--gold-primary); text-align:center;">Luxury Checkout</h2>
                <input type="text" id="cName" placeholder="Full Name" style="width:100%; padding:10px; margin:5px 0;">
                <input type="email" id="cEmail" placeholder="Gmail" style="width:100%; padding:10px; margin:5px 0;">
                <input type="text" id="cPhone" placeholder="WhatsApp Number" style="width:100%; padding:10px; margin:5px 0;">
                <textarea id="cAddr" placeholder="Delivery Address" style="width:100%; padding:10px; margin:5px 0;"></textarea>
                <button class="apply-btn" onclick="submitOrder()">SUBMIT ORDER & DISPATCH</button>
            `;
            document.getElementById('productModal').style.display = 'flex';
        }

        function submitOrder() {
            let o = {name:document.getElementById('cName').value, phone:document.getElementById('cPhone').value};
            let orders = JSON.parse(localStorage.getItem('mme_orders') || '[]');
            orders.push(o);
            localStorage.setItem('mme_orders', JSON.stringify(orders));
            alert("Order Submitted!"); closeModal();
        }

        function openAdminModal() {
            let p = prompt("Enter Admin Password:");
            if(p === 'mrbtrmlc') alert("Admin Panel Accessed");
        }

        function closeModal() { document.getElementById('productModal').style.display = 'none'; }
        window.onload = loadMarketProducts;
    </script>
</body>
</html>
