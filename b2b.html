<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR MASUDAR ENTERPRISE | Global Luxury Wholesale Market</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --surface-card: #0a0a0a;
            --gold-primary: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            --border-luxury: rgba(212, 175, 55, 0.4);
            --text-white: #ffffff;
            --text-gray: #aaaaaa;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .lock-btn-fixed { position: fixed; bottom: 3px; left: 3px; color: var(--gold-primary); font-size: 8px; cursor: pointer; z-index: 99999; opacity: 0.08; transition: 0.3s; padding: 4px; }
        .lock-btn-fixed:hover { opacity: 1; transform: scale(1.5); }

        .market-header {
            text-align: center;
            padding: 15px;
            border: 1px solid var(--border-luxury);
            border-radius: 16px;
            background: var(--surface-card);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
            max-width: 1200px;
            margin: 0 auto 12px auto;
        }
        .market-header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 4px 0;
            letter-spacing: 1px;
        }

        .search-bar-container {
            display: flex;
            align-items: center;
            background: #000;
            border: 1px solid var(--gold-primary);
            border-radius: 30px;
            max-width: 500px;
            margin: 10px auto 0 auto;
            padding: 5px 12px;
        }
        .search-bar-container input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 11px;
            outline: none;
            padding: 5px;
        }
        .search-icon-btn {
            background: transparent;
            border: none;
            color: var(--gold-primary);
            font-size: 13px;
            cursor: pointer;
            padding: 0 6px;
        }

        /* Wholesale Hub & 3 Buttons Section */
        .wholesale-hub-card {
            max-width: 1200px;
            margin: 0 auto 15px auto;
            background: var(--surface-card);
            border: 1px solid var(--gold-primary);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }
        .wholesale-hub-card h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 16px;
            color: var(--gold-primary);
            margin: 4px 0;
            letter-spacing: 1px;
        }
        .wholesale-buttons-group {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .wholesale-action-btn {
            background: var(--gold-gradient);
            border: none;
            padding: 6px 14px;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 18px;
            cursor: pointer;
            color: #000;
            font-size: 9px;
            box-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
            transition: 0.2s;
        }
        .wholesale-action-btn:hover { transform: scale(1.05); }

        .category-menu-wrap {
            max-width: 1200px;
            margin: 0 auto 15px auto;
            overflow: hidden;
            position: relative;
            padding: 5px 0;
        }
        .category-menu {
            display: flex;
            gap: 10px;
            width: max-content;
            animation: autoScrollCat 25s linear infinite;
        }
        .category-menu:hover { animation-play-state: paused; }
        @keyframes autoScrollCat {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .cat-chip {
            background: var(--surface-card);
            border: 1px solid var(--border-luxury);
            color: var(--gold-light);
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .cat-chip:hover, .cat-chip.active {
            background: var(--gold-gradient);
            color: #000;
            border-color: #fff;
        }

        .floating-basket {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--gold-gradient);
            color: #000;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.8);
            cursor: grab;
            z-index: 9999;
            user-select: none;
            touch-action: none;
            animation: basketFloatEffect 3s ease-in-out infinite;
            transition: transform 0.2s ease;
        }
        @keyframes basketFloatEffect {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-6px) scale(1.05); }
        }
        .floating-basket:active { cursor: grabbing; animation: none; }
        
        .basket-center-focus {
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) scale(1.6) !important;
            box-shadow: 0 0 60px #fff, 0 0 40px var(--gold-primary) !important;
            z-index: 99999 !important;
            animation: none !important;
        }

        .basket-count {
            position: absolute;
            top: -3px;
            right: -3px;
            background: #fff;
            color: #000;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 50%;
            border: 2px solid #000;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .product-card {
            background: var(--surface-card);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: 0.2s;
        }
        .product-card:hover { border-color: var(--gold-primary); transform: translateY(-2px); }
        
        .product-video-box {
            width: 100%;
            aspect-ratio: 9 / 16;
            background: #000;
            position: relative;
            overflow: hidden;
            border-radius: 11px 11px 0 0;
            cursor: pointer;
        }
        .product-video-box iframe {
            width: 100%;
            height: 100%;
            border: none;
            transform: scale(1.35);
            pointer-events: none;
        }
        .video-click-blocker {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5;
            background: transparent;
        }

        .product-info { padding: 8px; text-align: center; }
        .product-title { font-size: 10px; font-weight: 700; color: #fff; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
        .stars { color: var(--gold-primary); font-size: 8px; margin-bottom: 4px; }
        .card-actions { display: flex; border-top: 1px solid #222; }
        .card-btn { flex: 1; background: transparent; border: none; padding: 8px; color: var(--gold-primary); font-size: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .card-btn:hover { background: rgba(212, 175, 55, 0.15); }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 10px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .modal-content {
            background: var(--surface-card);
            border: 2px solid var(--gold-primary);
            border-radius: 18px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            position: relative;
            box-sizing: border-box;
        }
        .close-modal {
            position: absolute;
            top: 12px; right: 12px;
            background: transparent;
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            width: 28px; height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 11px;
            display: flex; align-items: center; justify-content: center;
        }

        .apply-btn {
            background: var(--gold-gradient);
            border: none;
            padding: 10px 20px;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 20px;
            cursor: pointer;
            color: #000;
            width: 100%;
            max-width: 280px;
            display: block;
            margin: 15px auto 0 auto;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(212,175,55,0.3);
            font-size: 11px;
        }

        .grand-total-box {
            background: rgba(212, 175, 55, 0.12);
            border: 2px solid var(--gold-primary);
            border-radius: 14px;
            padding: 15px;
            text-align: center;
            margin: 15px 0;
            box-shadow: 0 0 20px rgba(212,175,55,0.2);
        }
        .grand-total-price {
            font-size: 24px;
            font-weight: 900;
            color: var(--gold-primary);
            margin: 4px 0;
        }

        .details-stack { display: flex; flex-direction: column; gap: 12px; }
        .large-preview-wrap { background: #000; border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; aspect-ratio: 9/16; width: 100%; max-height: 320px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin: 0 auto; position: relative; }
        .large-preview-wrap iframe { width: 100%; height: 100%; border: none; transform: scale(1.3); }
        
        .qty-box { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 8px 0; }
        .qty-btn { background: #222; border: 1px solid var(--gold-primary); color: #fff; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-weight: bold; }

        .cart-item-row { display: flex; justify-content: space-between; align-items: center; background: #000; border: 1px solid #333; padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 11px; }
        .cart-remove-btn { color: #ff4d4d; cursor: pointer; font-size: 13px; background: none; border: none; }

        .flying-coin {
            position: fixed;
            width: 45px;
            height: 45px;
            background: var(--gold-gradient);
            border: 3px solid #fff;
            border-radius: 50%;
            z-index: 99999;
            pointer-events: none;
            box-shadow: 0 0 25px var(--gold-primary);
            transition: all 0.6s cubic-bezier(0.15, 0.85, 0.25, 1);
        }

        .form-group-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; }
        .form-full { grid-column: span 2; }
        .input-box { width: 100%; background: #000; border: 1px solid #333; padding: 10px; color: #fff; border-radius: 8px; margin-top: 3px; font-size: 11px; box-sizing: border-box; outline: none; }
        .input-box:focus { border-color: var(--gold-primary); }

        .admin-table { width: 100%; border-collapse: collapse; font-size: 10px; margin-top: 10px; }
        .admin-table th, .admin-table td { border: 1px solid #333; padding: 8px; text-align: left; }
        .admin-table th { background: rgba(212,175,55,0.2); color: var(--gold-primary); }

        @media(max-width: 768px) {
            .product-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .market-header h1 { font-size: 16px; }
            .form-group-grid { grid-template-columns: 1fr; }
            .form-full { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <div class="lock-btn-fixed" onclick="openAdminModal()"><i class="fa-solid fa-lock"></i></div>

    <div class="floating-basket" id="floatingBasket" title="Checkout">
        <i class="fa-solid fa-basket-shopping"></i>
        <span class="basket-count" id="cartBadge">0</span>
    </div>

    <div class="market-header">
        <h1>MR MASUDAR ENTERPRISE</h1>
        <p style="color: var(--text-gray); font-size: 7px; letter-spacing: 1px; text-transform: uppercase; margin: 0;">Global Luxury Wholesale & B2B Solutions</p>
        
        <div class="search-bar-container">
            <i class="fa-solid fa-magnifying-glass" style="color:var(--gold-primary); margin-left: 4px;"></i>
            <input type="text" id="searchInput" placeholder="Search luxury products..." onkeyup="filterProducts()">
            <button class="search-icon-btn" onclick="startVoiceSearch()"><i class="fa-solid fa-microphone"></i></button>
            <button class="search-icon-btn" onclick="triggerImageSearch()"><i class="fa-solid fa-camera"></i></button>
            <input type="file" id="imageUploadInput" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
        </div>
    </div>

    <!-- Wholesale Hub & 3 Action Buttons -->
    <div class="wholesale-hub-card">
        <i class="fa-solid fa-warehouse" style="color:var(--gold-primary); font-size:20px; margin-bottom:4px;"></i>
        <h3>WHOLESALE & GLOBAL B2B SOLUTIONS</h3>
        <div class="wholesale-buttons-group">
            <button class="wholesale-action-btn" onclick="openWholesaleModal('bulk')">📦 Bulk Order (Min. 5+ Pcs)</button>
            <button class="wholesale-action-btn" onclick="openWholesaleModal('business')">🤝 Business Partnership</button>
            <button class="wholesale-action-btn" onclick="openWholesaleModal('custom')">✨ Custom Brand Supply</button>
        </div>
    </div>

    <div class="category-menu-wrap">
        <div class="category-menu" id="catMenu">
            <div class="cat-chip" onclick="filterCategory('Women\'s Fashion', this)">👗 Women's Fashion</div>
            <div class="cat-chip" onclick="filterCategory('Men\'s Fashion', this)">👔 Men's Fashion</div>
            <div class="cat-chip" onclick="filterCategory('Baby', this)">🍼 Baby</div>
            <div class="cat-chip" onclick="filterCategory('Gift', this)">🎁 Gift</div>
            <div class="cat-chip" onclick="filterCategory('Decor', this)">🏺 Decor</div>
        </div>
    </div>

    <div class="product-grid" id="marketProductGrid"></div>

    <div class="modal-overlay" id="productModal">
        <div class="modal-content" id="modalBody"></div>
    </div>

    <script>
        let idleTimer;
        function resetIdleTimer() {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                localStorage.removeItem('mme_cart_details');
                location.reload();
            }, 300000);
        }
        window.onload = () => {
            loadMarketProducts("Women's Fashion");
            resetIdleTimer();
            updateCartBadgeCount();
        };
        document.onmousemove = resetIdleTimer;
        document.onkeypress = resetIdleTimer;

        function updateCartBadgeCount() {
            let cart = JSON.parse(localStorage.getItem('mme_cart_details') || '[]');
            let totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cartBadge').innerText = totalQty;
        }

        const basket = document.getElementById('floatingBasket');
        let isDragging = false, startX, startY, initialX, initialY;

        basket.addEventListener('mousedown', dragStart);
        basket.addEventListener('touchstart', dragStart, {passive: true});
        document.addEventListener('mousemove', drag);
        document.addEventListener('touchmove', drag, {passive: true});
        document.addEventListener('mouseup', dragEnd);
        document.addEventListener('touchend', dragEnd);

        function dragStart(e) {
            isDragging = true;
            startX = e.clientX || e.touches[0].clientX;
            startY = e.clientY || e.touches[0].clientY;
            let r = basket.getBoundingClientRect();
            initialX = r.left;
            initialY = r.top;
            basket.style.right = 'auto';
            basket.style.top = initialY + 'px';
            basket.style.left = initialX + 'px';
        }

        function drag(e) {
            if(!isDragging) return;
            let currentX = e.clientX || e.touches[0].clientX;
            let currentY = e.clientY || e.touches[0].clientY;
            basket.style.left = (initialX + (currentX - startX)) + 'px';
            basket.style.top = (initialY + (currentY - startY)) + 'px';
        }

        function dragEnd() { isDragging = false; }
        basket.onclick = function() { if(!isDragging) { openCheckoutModal(); } };

        function getProducts() {
            let p = JSON.parse(localStorage.getItem('mme_products_v3') || '[]');
            let ytEmbedBase = "https://www.youtube.com/embed/ZVTRyR7Ubas?autoplay=1&mute=1&loop=1&playlist=ZVTRyR7Ubas&controls=0&modestbranding=1&playsinline=1&rel=0";

            if(p.length === 0) {
                p = [
                    { name: "Designer Silk Saree", title: "Royal Katan Silk Saree", category: "Women's Fashion", price: 15000, wholesalePrice: 11500, bd: "৳ 15,000", shipping: 80, desc: "Exquisite hand-woven golden zari work for luxury occasions.", videoUrl: ytEmbedBase },
                    { name: "Executive Silk Suit", title: "Premium Men's Formal Wear", category: "Men's Fashion", price: 8500, wholesalePrice: 6500, bd: "৳ 8,500", shipping: 70, desc: "Tailored Italian cut luxury fabric designed for top executives.", videoUrl: ytEmbedBase },
                    { name: "Golden Baby Stroller", title: "Ultra Safe Luxury Pram", category: "Baby", price: 22000, wholesalePrice: 17500, bd: "৳ 22,000", shipping: 120, desc: "Gold-plated alloy frame with shock-absorbent wheels.", videoUrl: ytEmbedBase },
                    { name: "Luxury Gift Hamper", title: "Gold-Accent Gift Box", category: "Gift", price: 4500, wholesalePrice: 3500, bd: "৳ 4,500", shipping: 50, desc: "Exotic curated luxury gift items for special events.", videoUrl: ytEmbedBase },
                    { name: "Royal Gamar Bed", title: "Handcrafted Luxury Teak Bed", category: "Decor", price: 45000, wholesalePrice: 36000, bd: "৳ 45,000", shipping: 150, desc: "Pure high-gloss lacquer finish with solid Gamar wood structure.", videoUrl: ytEmbedBase }
                ];
                localStorage.setItem('mme_products_v3', JSON.stringify(p));
            }
            return p;
        }

        function loadMarketProducts(filterCat = "Women's Fashion") {
            let grid = document.getElementById('marketProductGrid');
            let products = getProducts().filter(p => p.category && p.category.toLowerCase() === filterCat.toLowerCase());
            grid.innerHTML = products.map((p) => `
                <div class="product-card">
                    <div class="product-video-box" onclick="openProductDetails('${p.title}', false)">
                        <div class="video-click-blocker"></div>
                        <iframe src="${p.videoUrl}" frameborder="0" allow="autoplay; encrypted-media" playsinline loading="eager"></iframe>
                    </div>
                    <div class="product-info">
                        <div class="product-title" onclick="openProductDetails('${p.title}', false)">${p.title}</div>
                        <div class="stars"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></div>
                        <div style="font-size:10px; color:var(--gold-primary); font-weight:bold;">${p.bd}</div>
                    </div>
                    <div class="card-actions">
                        <button class="card-btn" onclick="openProductDetails('${p.title}', false)">View Details</button>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(cat, el) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            loadMarketProducts(cat);
        }

        function filterProducts() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let products = getProducts();
            let grid = document.getElementById('marketProductGrid');
            grid.innerHTML = products.filter(p => p.title.toLowerCase().includes(query) || p.category.toLowerCase().includes(query)).map((p) => `
                <div class="product-card">
                    <div class="product-video-box" onclick="openProductDetails('${p.title}', false)">
                        <div class="video-click-blocker"></div>
                        <iframe src="${p.videoUrl}" frameborder="0" allow="autoplay; encrypted-media" playsinline loading="eager"></iframe>
                    </div>
                    <div class="product-info">
                        <div class="product-title">${p.title}</div>
                        <div class="stars"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></div>
                        <div style="font-size:10px; color:var(--gold-primary); font-weight:bold;">${p.bd}</div>
                    </div>
                    <div class="card-actions"><button class="card-btn" onclick="openProductDetails('${p.title}', false)">View Details</button></div>
                </div>
            `).join('');
        }

        function startVoiceSearch() {
            try {
                let rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
                rec.lang = 'en-US';
                rec.onresult = (e) => {
                    document.getElementById('searchInput').value = e.results[0][0].transcript;
                    filterProducts();
                };
                rec.start();
            } catch(e) {
                let txt = prompt("Type product name:");
                if(txt) { document.getElementById('searchInput').value = txt; filterProducts(); }
            }
        }

        function triggerImageSearch() { document.getElementById('imageUploadInput').click(); }
        function handleImageUpload(e) { alert("AI Visual Match Found!"); document.getElementById('searchInput').value = "Royal"; filterProducts(); }

        let currentQty = 1;
        let activePrice = 0;
        let activeShipping = 0;
        let activeTitle = "";
        let isWholesaleMode = false;

        function openWholesaleModal(type) {
            let products = getProducts();
            let titleText = type === 'bulk' ? "Bulk Order (Min. 5+ Pcs)" : type === 'business' ? "Business Partnership" : "Custom Brand Supply";
            
            let html = products.map(p => `
                <div class="cart-item-row" style="cursor:pointer;" onclick="openProductDetails('${p.title}', true)">
                    <span><b>${p.title}</b><br><span style="color:var(--gold-primary);">Wholesale Price: ৳ ${p.wholesalePrice.toLocaleString()}</span></span>
                    <button class="card-btn" style="flex:0; padding:4px 8px; border:1px solid var(--gold-primary); border-radius:6px;">Select</button>
                </div>
            `).join('');

            document.getElementById('modalBody').innerHTML = `
                <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                <div class="modal-scroll-body">
                    <h3 style="font-family:'Cormorant Garamond', serif; color:var(--gold-primary); font-size:18px; text-align:center; margin-bottom:5px;">${titleText}</h3>
                    <p style="color:#aaa; font-size:10px; text-align:center; margin-bottom:10px;">Select any luxury product to proceed with your wholesale/B2B inquiry.</p>
                    <div style="max-height: 300px; overflow-y: auto;">${html}</div>
                </div>
            `;
            document.getElementById('productModal').style.display = 'flex';
        }

        function openProductDetails(title, wholesale = false) {
            isWholesaleMode = wholesale;
            let p = getProducts().find(item => item.title === title) || getProducts()[0];
            activePrice = wholesale ? p.wholesalePrice : p.price;
            activeShipping = p.shipping;
            activeTitle = p.title + (wholesale ? " [WHOLESALE BULK]" : "");
            currentQty = wholesale ? 5 : 1;

            document.getElementById('modalBody').innerHTML = `
                <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                <div class="details-stack">
                    <div>
                        <div class="large-preview-wrap">
                            <iframe src="${p.videoUrl}" frameborder="0" allow="autoplay; encrypted-media" playsinline></iframe>
                        </div>
                    </div>
                    <div>
                        <span style="font-size:8px; color:var(--gold-primary); font-weight:bold; letter-spacing:1px;">${isWholesaleMode ? 'WHOLESALE B2B' : p.category}</span>
                        <h2 style="font-family:'Cormorant Garamond', serif; color:#fff; font-size:22px; margin:2px 0;">${p.title}</h2>
                        <div class="stars"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></div>
                        <p style="color:#aaa; font-size:10px; line-height:1.5; margin:8px 0;">${p.desc}</p>
                        
                        <div style="font-size:14px; color:var(--gold-primary); font-weight:bold;">Unit Price: ৳ <span id="unitPrice">${activePrice.toLocaleString()}</span></div>
                        <div style="font-size:10px; color:#aaa;">Seller Shipping: ৳ <span id="shippingFee">${activeShipping}</span></div>

                        <div class="qty-box">
                            <span style="font-size:10px; color:var(--gold-light);">Quantity:</span>
                            <button class="qty-btn" onclick="updateQty(-1)">-</button>
                            <span id="prodQty" style="font-weight:bold; font-size:12px; min-width:15px; text-align:center;">${currentQty}</span>
                            <button class="qty-btn" onclick="updateQty(1)">+</button>
                        </div>

                        <div style="font-size:13px; color:#fff; font-weight:bold; text-align:center; margin-bottom:10px;">Subtotal: ৳ <span id="totalItemPrice">${((activePrice * currentQty) + activeShipping).toLocaleString()}</span></div>

                        <button class="apply-btn" id="addToCartBtn">ADD TO CART</button>
                    </div>
                </div>
            `;
            document.getElementById('productModal').style.display = 'flex';

            document.getElementById('addToCartBtn').onclick = function(e) {
                addCartAndAnimate(e, activeTitle, activePrice, activeShipping);
            };
        }

        function updateQty(change) {
            currentQty += change;
            let minLimit = isWholesaleMode ? 5 : 1;
            if(currentQty < minLimit) currentQty = minLimit;
            document.getElementById('prodQty').innerText = currentQty;
            let subtotal = (activePrice * currentQty) + activeShipping;
            document.getElementById('totalItemPrice').innerText = subtotal.toLocaleString();
        }

        function playLuxurySound() {
            try {
                let ctx = new (window.AudioContext || window.webkitAudioContext)();
                let now = ctx.currentTime;

                let osc1 = ctx.createOscillator();
                let gain1 = ctx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(659.25, now);
                osc1.frequency.exponentialRampToValueAtTime(1318.51, now + 0.4);
                gain1.gain.setValueAtTime(0.08, now);
                gain1.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
                osc1.connect(gain1);
                gain1.connect(ctx.destination);
                osc1.start(now);
                osc1.stop(now + 0.4);

                let osc2 = ctx.createOscillator();
                let gain2 = ctx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(1046.50, now + 0.08);
                osc2.frequency.exponentialRampToValueAtTime(2093.00, now + 0.5);
                gain2.gain.setValueAtTime(0.06, now + 0.08);
                gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
                osc2.connect(gain2);
                gain2.connect(ctx.destination);
                osc2.start(now + 0.08);
                osc2.stop(now + 0.5);
            } catch(e) {}
        }

        function addCartAndAnimate(event, name, price, shipping) {
            let cart = JSON.parse(localStorage.getItem('mme_cart_details') || '[]');
            cart.push({ name: name, qty: currentQty, price: price, shipping: shipping });
            localStorage.setItem('mme_cart_details', JSON.stringify(cart));
            updateCartBadgeCount();

            playLuxurySound();
            closeModal();

            let btnRect = event.target.getBoundingClientRect();
            let basketRect = basket.getBoundingClientRect();

            let coin = document.createElement('div');
            coin.className = 'flying-coin';
            coin.style.left = btnRect.left + 'px';
            coin.style.top = btnRect.top + 'px';
            document.body.appendChild(coin);

            setTimeout(() => {
                coin.style.left = (basketRect.left + 15) + 'px';
                coin.style.top = (basketRect.top + 15) + 'px';
                coin.style.transform = 'scale(0.2) rotate(720deg)';
                coin.style.opacity = '0';
            }, 30);

            setTimeout(() => {
                coin.remove();
                let oldLeft = basket.style.left;
                let oldTop = basket.style.top;
                basket.classList.add('basket-center-focus');
                
                setTimeout(() => {
                    basket.classList.remove('basket-center-focus');
                    basket.style.left = oldLeft;
                    basket.style.top = oldTop;
                }, 800);
            }, 600);
        }

        function openCheckoutModal() {
            let cart = JSON.parse(localStorage.getItem('mme_cart_details') || '[]');
            if(cart.length === 0) {
                alert("Your cart is currently empty.");
                return;
            }

            let prodCost = 0, shipCost = 0;
            cart.forEach(i => { prodCost += (i.price * i.qty); shipCost += i.shipping; });
            let grandTotal = prodCost + shipCost;

            let cartItemsHTML = cart.map((item, idx) => `
                <div class="cart-item-row">
                    <span><b>${item.name}</b> (x${item.qty}) - ৳ ${(item.price * item.qty).toLocaleString()}</span>
                    <button class="cart-remove-btn" onclick="removeCartItem(${idx})"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');

            document.getElementById('modalBody').innerHTML = `
                <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                <h3 style="font-family:'Cormorant Garamond', serif; color:var(--gold-primary); font-size:20px; text-align:center; margin-bottom:5px;">Secure Global B2B Checkout</h3>
                
                <div style="margin-bottom: 15px;">
                    <div style="font-size:9px; color:var(--gold-light); text-transform:uppercase; margin-bottom:5px; font-weight:bold;">Selected Cart Items (Manage / Remove):</div>
                    <div style="max-height: 120px; overflow-y: auto;">${cartItemsHTML}</div>
                </div>

                <div class="grand-total-box">
                    <div style="font-size:10px; color:#aaa; text-transform:uppercase;">Grand Total (Products + Shipping)</div>
                    <div class="grand-total-price">৳ ${grandTotal.toLocaleString()}</div>
                    <div style="font-size:9px; color:var(--gold-light);">Items: ${cart.length} | Shipping Included: ৳ ${shipCost}</div>
                </div>

                <div class="form-group-grid">
                    <div>
                        <label style="font-size:8px; color:var(--gold-light); text-transform:uppercase; font-weight:bold;">Full Name *</label>
                        <input type="text" id="custName" class="input-box" placeholder="Full name">
                    </div>
                    <div>
                        <label style="font-size:8px; color:var(--gold-light); text-transform:uppercase; font-weight:bold;">Company / Business Name *</label>
                        <input type="text" id="custCompany" class="input-box" placeholder="Your Enterprise / LLC">
                    </div>
                    <div>
                        <label style="font-size:8px; color:var(--gold-light); text-transform:uppercase; font-weight:bold;">Gmail Address *</label>
                        <input type="email" id="custEmail" class="input-box" placeholder="client@gmail.com">
                    </div>
                    <div>
                        <label style="font-size:8px; color:var(--gold-light); text-transform:uppercase; font-weight:bold;">WhatsApp / Mobile Number *</label>
                        <div style="display:flex; gap:4px; margin-top:3px;">
                            <select id="countryCode" style="width:75px; background:#000; border:1px solid #333; color:#fff; padding:8px; border-radius:6px; font-size:10px;">
                                <option value="+880" selected>+880 (BD)</option>
                                <option value="+1">+1 (USA/CA)</option>
                                <option value="+44">+44 (UK)</option>
                                <option value="+91">+91 (IN)</option>
                                <option value="+971">+971 (UAE)</option>
                                <option value="+966">+966 (KSA)</option>
                                <option value="+65">+65 (SG)</option>
                                <option value="+61">+61 (AU)</option>
                                <option value="+49">+49 (DE)</option>
                                <option value="+33">+33 (FR)</option>
                                <option value="+81">+81 (JP)</option>
                                <option value="+86">+86 (CN)</option>
                            </select>
                            <input type="text" id="custPhone" class="input-box" placeholder="Number without code" style="margin-top:0;">
                        </div>
                    </div>
                    <div>
                        <label style="font-size:8px; color:var(--gold-light); text-transform:uppercase; font-weight:bold;">City / State *</label>
                        <input type="text" id="custCity" class="input-box" placeholder="City">
                    </div>
                    <div>
                        <label style="font-size:8px; color:var(--gold-light); text-transform:uppercase; font-weight:bold;">Country *</label>
                        <input type="text" id="custCountryName" class="input-box" placeholder="Country">
                    </div>
                    <div class="form-full">
                        <label style="font-size:8px; color:var(--gold-light); text-transform:uppercase; font-weight:bold;">Complete Delivery Address *</label>
                        <textarea id="custAddr" rows="2" class="input-box" placeholder="House, Road, Area, Zip Code..."></textarea>
                    </div>
                    <div class="form-full">
                        <label style="font-size:8px; color:var(--gold-light); text-transform:uppercase; font-weight:bold;">Payment Gateway *</label>
                        <select id="paymentMethod" class="input-box" onchange="togglePaymentFields()">
                            <option value="bKash">bKash / Nagad (Send Money: 01767319670)</option>
                            <option value="International Card">International Wire / Visa / MasterCard / PayPal</option>
                        </select>
                    </div>
                    <div class="form-full" id="trxBox">
                        <label style="font-size:8px; color:var(--gold-light); text-transform:uppercase; font-weight:bold;">Transaction ID (TrxID) *</label>
                        <input type="text" id="custTrx" class="input-box" placeholder="Enter TrxID after sending payment">
                    </div>
                </div>

                <button class="apply-btn" onclick="submitFinalOrder(${grandTotal})">CONFIRM & ORDER NOW</button>
            `;
            document.getElementById('productModal').style.display = 'flex';
        }

        function removeCartItem(index) {
            let cart = JSON.parse(localStorage.getItem('mme_cart_details') || '[]');
            cart.splice(index, 1);
            localStorage.setItem('mme_cart_details', JSON.stringify(cart));
            updateCartBadgeCount();
            openCheckoutModal();
        }

        function togglePaymentFields() {
            let m = document.getElementById('paymentMethod').value;
            document.getElementById('trxBox').style.display = m.includes('International') ? 'none' : 'block';
        }

        function submitFinalOrder(grandTotal) {
            let name = document.getElementById('custName').value;
            let company = document.getElementById('custCompany').value;
            let email = document.getElementById('custEmail').value;
            let code = document.getElementById('countryCode').value;
            let phone = document.getElementById('custPhone').value;
            let city = document.getElementById('custCity').value;
            let country = document.getElementById('custCountryName').value;
            let addr = document.getElementById('custAddr').value;
            let payment = document.getElementById('paymentMethod').value;
            let trx = document.getElementById('custTrx') ? document.getElementById('custTrx').value : 'International Wire';
            let cart = JSON.parse(localStorage.getItem('mme_cart_details') || '[]');

            if(!name || !company || !email || !phone || !city || !country || !addr || (!payment.includes('International') && !trx)) {
                alert("Please fill in all required fields (including Company Name, Email, WhatsApp & Payment details).");
                return;
            }

            let orderData = {
                id: 'MME-B2B-' + Math.floor(100000 + Math.random() * 900000),
                name: name, company: company, email: email, phone: code + phone, city: city + ', ' + country, addr: addr,
                payment: payment + (trx !== 'International Wire' ? ' (Trx: ' + trx + ')' : ''),
                total: '৳ ' + grandTotal.toLocaleString(),
                status: 'Paid / Global B2B Dispatch',
                items: cart.map(i => `${i.name} (x${i.qty})`).join(', '),
                date: new Date().toLocaleString()
            };

            let orders = JSON.parse(localStorage.getItem('mme_orders_b2b') || '[]');
            orders.push(orderData);
            localStorage.setItem('mme_orders_b2b', JSON.stringify(orders));

            localStorage.removeItem('mme_cart_details');
            updateCartBadgeCount();
            alert("Wholesale & B2B Order placed successfully! Our global dispatch team will contact you shortly.");
            closeModal();
        }

        function openAdminModal() {
            let p = prompt("Enter Admin Password:");
            if(p === 'mrbtrmlc') {
                let orders = JSON.parse(localStorage.getItem('mme_orders_b2b') || '[]');
                let rows = orders.length > 0 ? orders.map(o => `<tr><td><b>${o.id}</b></td><td>${o.name} (${o.company})<br>${o.phone}</td><td>${o.status}<br>${o.payment}</td><td><b>${o.items}</b><br><span style="color:var(--gold-primary);">${o.total}</span></td></tr>`).join('') : '<tr><td colspan="4" style="text-align:center;">No B2B orders yet.</td></tr>';
                document.getElementById('modalBody').innerHTML = `
                    <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                    <h3 style="color:var(--gold-primary); text-align:center;">Master B2B Admin Panel</h3>
                    <p style="font-size:10px; color:#2ecc71;">Total Wholesale Orders: ${orders.length}</p>
                    <div style="max-height:300px; overflow-y:auto;"><table class="admin-table"><thead><tr><th>ID</th><th>Client / Company</th><th>Payment</th><th>Total/Items</th></tr></thead><tbody>${rows}</tbody></table></div>
                `;
                document.getElementById('productModal').style.display = 'flex';
            } else if(p) {
                alert("Incorrect Password!");
            }
        }

        function closeModal() { document.getElementById('productModal').style.display = 'none'; }
    </script>
</body>
</html>
